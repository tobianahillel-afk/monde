name: MONDE Dev V2 Journal Inspector (READ ONLY)
# The legacy file path is retained to avoid breaking traceability. As of the
# single-interactive-writer topology, NO issue_comment event may post results.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          persist-credentials: false
      - name: Validate test Issue journal (read only)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const controller = require('./.github/scripts/monde-dev/controller.cjs');
            const state = await controller.inspect(github, {
              mode: 'TEST_ONLY',
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: 20,
              allowedActors: ['tobianahillel-afk'],
              botActor: 'github-actions[bot]'
            });
            core.info('TEST_ONLY issue-journal inspection: ' + JSON.stringify(state));
