name: One-shot v10 TEST-0008 materialization runner
# trigger: 2

on:
  push:
    branches:
      - review/test-0008-github-models
    paths:
      - .github/workflows/admin-v10-authorizations-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout admin script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: review/test-0008-github-models
          path: admin
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact PR #3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/work-0001-assurance-closure
          path: target
          fetch-depth: 1
      - name: Consume REVIEW-0027 authorization
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "db2f737ceda531916590c4cc32d9f46964d601e0"
          git -C target config user.name 'MONDE governance automation'
          git -C target config user.email '269188945+tobianahillel-afk@users.noreply.github.com'
          python admin/tools/admin_v10_materialize_test8.py target consume-review
          git -C target diff --check
          git -C target add registry/status-machines.yaml
          git -C target commit -m 'chore(governance): consume REVIEW-0027 authorization'
      - name: Import TEST-0008 external PASS
        run: |
          set -euo pipefail
          python admin/tools/admin_v10_materialize_test8.py target import-test
          git -C target diff --check
          git -C target add registry/tests/TEST-0008.yaml
          git -C target commit -m 'chore(governance): import TEST-0008 external L2 PASS'
          git -C target rev-parse HEAD > /tmp/test8_import_sha
      - name: Bind TEST-0008 and consume authorization
        run: |
          set -euo pipefail
          TEST8_IMPORT_SHA="$(cat /tmp/test8_import_sha)"
          python admin/tools/admin_v10_materialize_test8.py target bind-test "$TEST8_IMPORT_SHA"
          git -C target diff --check
          git -C target add registry/tests/TEST-0008.yaml registry/status-machines.yaml
          git -C target commit -m 'chore(governance): bind and consume TEST-0008 external import'
      - name: Push exact commit chain
        run: |
          set -euo pipefail
          git -C target log --oneline -4
          git -C target push origin HEAD:chore/work-0001-assurance-closure
