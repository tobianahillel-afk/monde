name: One-shot v10 handover synchronization runner
# trigger: 3

on:
  push:
    branches:
      - review/test-0008-github-models
    paths:
      - .github/workflows/admin-v10-authorizations-v3.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout admin script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: review/test-0008-github-models
          path: admin
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact PR #3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/work-0001-assurance-closure
          path: target
          fetch-depth: 1
      - name: Synchronize v10 handover
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "74dc253d849e3b6b6570fe55df415f5e9da65ab2"
          git -C target config user.name 'MONDE governance automation'
          git -C target config user.email '269188945+tobianahillel-afk@users.noreply.github.com'
          python admin/tools/admin_v10_sync_handover.py target
          git -C target diff --check
          git -C target diff -- PROJECT_STATE.md registry/work-items/WORK-0001.yaml registry/tests/TEST-0008.yaml
          git -C target add PROJECT_STATE.md registry/work-items/WORK-0001.yaml registry/tests/TEST-0008.yaml
          git -C target commit -m 'chore(governance): synchronize v10 acceptance handover'
      - name: Push synchronized candidate
        run: |
          set -euo pipefail
          git -C target log --oneline -3
          git -C target push origin HEAD:chore/work-0001-assurance-closure
