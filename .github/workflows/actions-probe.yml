name: Actions branch probe

on:
  push:
    branches:
      - review/test-0008-github-models

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/work-0002-governance-ci
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.15'

      - name: Correct REVIEW-0030 findings and prove candidate
        run: |
          git fetch origin review/test-0008-github-models
          git show origin/review/test-0008-github-models:.github/admin/pr2-review0030-fixes.sh > /tmp/pr2-review0030-fixes.sh
          bash /tmp/pr2-review0030-fixes.sh
