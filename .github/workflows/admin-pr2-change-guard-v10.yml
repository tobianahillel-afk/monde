name: Admin PR2 change guard v10

on:
  push:
    branches: [review/test-0008-github-models]
    paths:
      - .github/workflows/admin-pr2-change-guard-v10.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/work-0002-governance-ci
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact source heads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ba9f467fa73a1e1151fb6df13955f1a88e5d8a1f"
          git fetch origin main review/test-0008-github-models
          test "$(git rev-parse origin/main)" = "29086643387ff46ab6636dd2fa3014efccc10165"
          git cat-file -e 30f2c390741f58a1dc7af67915ce6e99c404b3ec^{commit}

      - name: Reapply graph-aware patch and align mutation harness
        run: |
          set -euo pipefail
          git show 30f2c390741f58a1dc7af67915ce6e99c404b3ec:.github/workflows/admin-pr2-change-guard-v10.yml > /tmp/original.yml
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/original.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='- name: Patch graph-aware v10 change guard and regressions')
          stop=next(i for i,l in enumerate(src[start+1:],start+1) if l.strip()=='- name: Set up Python')
          block=src[start:stop]
          run_i=next(i for i,l in enumerate(block) if l.strip()=='run: |')
          script='\n'.join((line[10:] if line.startswith('          ') else line) for line in block[run_i+1:])+'\n'
          Path('/tmp/reapply.sh').write_text(script)
          PY
          bash /tmp/reapply.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/governance_mutation_smoke.py')
          s=p.read_text()
          old="""        'if change_relevant_to_work(root, path, work, reviewed, head, file_path)',
        'if True',
"""
          new="""        'if file_path in endpoint_set\\n                and change_relevant_to_work(root, path, work, reviewed, head, file_path)',
        'if change_relevant_to_work(root, path, work, reviewed, head, file_path)',
"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements/governance-ci.txt

      - name: Prove complete patched tree before push
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/governance-ci.txt
          python -m pytest --cov=tools.governance --cov-branch --cov-report=term-missing --cov-fail-under=100
          python scripts/governance_mutation_smoke.py
          python -m tools.governance.validate_repo .
          python -m tools.governance.strict_contracts .
          python -m tools.governance.path_safety .
          python -m tools.governance.change_guard . --base 29086643387ff46ab6636dd2fa3014efccc10165 --head ba9f467fa73a1e1151fb6df13955f1a88e5d8a1f

      - name: Commit and push graph-aware correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/governance/change_guard.py tests/governance/test_change_guard.py scripts/governance_mutation_smoke.py
          git diff --cached --check
          git commit -m 'fix(governance): make change guard v10 merge-aware'
          git push origin HEAD:feat/work-0002-governance-ci
          echo "CORRECTED_HEAD=$(git rev-parse HEAD)"
