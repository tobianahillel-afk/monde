name: One-shot v10 authorization commit v2

on:
  push:
    branches:
      - review/test-0008-github-models
    paths:
      - .github/workflows/admin-v10-authorizations-v2.yml

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR #3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/work-0001-assurance-closure
          fetch-depth: 1

      - name: Verify frozen parent and apply v10 authorization-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c12a5b55c89168f20c028c2964da16de6f95ac56"
          python - <<'PY'
          from pathlib import Path

          status_path = Path('registry/status-machines.yaml')
          s = status_path.read_text(encoding='utf-8')
          assert s.startswith('version: 9\ncanonical: true\n')
          s = s.replace('version: 9\n', 'version: 10\n', 1)

          review_principle = '  - "A review completed externally before registry materialization may be imported in its resulting status only through immutable pre-v7 historical evidence or a one-shot external-import authorization that already exists in a parent commit before materialization and is later bound to the actual import commit."\n'
          test_principle = '  - "A TEST execution completed externally while its registry record is still non-terminal may be imported in its resulting status only through an exact one-shot external-execution authorization that exists in a parent commit before result materialization, binds the source/executor/exact tested revision, and is later bound and consumed by the actual import commit; normal lifecycle checkpoints must never be replayed after the external execution already finished."\n'
          assert s.count(review_principle) == 1
          s = s.replace(review_principle, review_principle + test_principle, 1)

          review_rule = '    external_import_rule: "For an externally completed review materialized after v7, a matching one-shot authorization must already exist in a parent commit before the REVIEW record first appears. The authorization binds record_id, resulting status, reviewed artifact SHA, source review identity/time, reviewer context and expected outcome. The imported REVIEW must declare that authorization. A later metadata-only binding must set consumed_by_commit to the actual first-materialization commit before the imported review may satisfy any work completion gate. An authorization with consumed_by_commit set cannot be reused."\n'
          assert s.count(review_rule) == 1
          review_auth = '''      - record_id: REVIEW-0027
        imported_status: COMPLETE
        artifact_commit_sha: "c12a5b55c89168f20c028c2964da16de6f95ac56"
        source_review_id: "github-actions-run:34793888383:attempt:1"
        source_submitted_at: "2026-09-14T00:49:49.870683Z"
        reviewer_context_id: "github-actions:34793888383:1:test-0008-v2"
        expected_outcome: APPROVE_WITH_FOLLOWUP
        one_shot: true
        consumed_by_commit: null
        source_kind: GITHUB_ACTIONS_COPILOT_CLI
        reason: "A fresh-context GitHub Actions Copilot CLI L2 completed against exact frozen candidate c12a5b55 before REVIEW-0027 materialization. It independently parsed WORK-0001, recomputed all three requirement digests, verified REVIEW-0026/F-1/F-2/F-3, recorded all fifteen TEST-0008 cold-read outcomes PASS, returned APPROVE_WITH_FOLLOWUP with no material findings, and is therefore preauthorized for one-shot truthful import without replaying OPEN/IN_PROGRESS."
'''
          assert 'record_id: REVIEW-0027' not in s
          i = s.index('      - record_id: REVIEW-0026\n')
          j = s.index(review_rule, i)
          s = s[:j] + review_auth + s[j:]

          old_cold = '    acceptance_cold_read_rule: "A TEST may qualify for requirement acceptance only when acceptance_cold_read.qualifies=true and all v9 requirement cold-read preconditions are satisfied: durable source identity/time, L2/L3 context-separated executor identity, fresh_context=true, authoring_context_separated=true, exact REQUIREMENT_NORMATIVE_V1 digest binding for every covered requirement while PROPOSED, all required outcome keys equal PASS, all_required_outcomes_pass=true, and exact execution.commit_sha/result=PASS. Generic PASS TEST records with no such qualification remain valid test evidence but never satisfy requirement acceptance."\n'
          assert s.count(old_cold) == 1
          s = s.replace(old_cold, old_cold.replace('all v9 requirement', 'all v10 requirement'), 1)

          hist_rule = '    historical_pass_rule: "If an older PASS execution has no provable exact revision, do not invent one and do not keep that record as active gating PASS evidence. Preserve its historical execution fields, transition the record to SUPERSEDED, identify replacement evidence that actually re-executes or explicitly partitions the superseded scope, and use revision-bound evidence for current gates."\n'
          assert s.count(hist_rule) == 1
          test_import = '''    external_execution_import_required_fields:
      - record_id
      - from_status
      - imported_status
      - execution_commit_sha
      - source_id
      - source_submitted_at
      - executor_context_id
      - expected_result
      - one_shot
      - consumed_by_commit
    external_execution_import_authorizations:
      - record_id: TEST-0008
        from_status: PLANNED
        imported_status: PASS
        execution_commit_sha: "c12a5b55c89168f20c028c2964da16de6f95ac56"
        source_id: "github-actions-run:34793888383:attempt:1"
        source_submitted_at: "2026-09-14T00:49:49.870683Z"
        executor_context_id: "github-actions:34793888383:1:test-0008-v2"
        expected_result: PASS
        one_shot: true
        consumed_by_commit: null
        source_kind: GITHUB_ACTIONS_COPILOT_CLI
        reason: "TEST-0008 was genuinely executed outside the registry lifecycle by a fresh-context GitHub Actions Copilot CLI L2 while the canonical record remained PLANNED. The run inspected exact candidate c12a5b55 while REQ-0023/24/25 were PROPOSED, independently parsed WORK-0001, recomputed the exact JCS digests, returned PASS for all fifteen required cold-read outcomes, verified REVIEW-0026/F-1/F-2/F-3 and produced approval-capable evidence. This authorization permits exactly one truthful PLANNED -> PASS result import instead of fabricating READY/RUNNING checkpoints after execution."
    external_execution_import_rule: "A TEST execution that already completed externally may bypass the normal repository-native state path only when an exact matching authorization above existed in a parent commit before the result/status import. The authorization must bind record_id, actual pre-import status, imported status/result, exact execution.commit_sha, durable source identity/time and executor context. The imported TEST must declare external_import.authorization_source and initially external_import.import_commit=null. A later metadata-only binding must set external_import.import_commit to the actual result-import commit and set the authorization consumed_by_commit to that same import commit before the TEST may satisfy any requirement-acceptance or work-completion gate. No READY/RUNNING checkpoints may be invented retroactively, and a consumed authorization cannot be reused."
'''
          s = s.replace(hist_rule, test_import + hist_rule, 1)
          status_path.write_text(s, encoding='utf-8')

          tpl_path = Path('registry/tests/_TEMPLATE.yaml')
          t = tpl_path.read_text(encoding='utf-8')
          anchor = '  completed_at: null\n\nexecution:\n'
          assert t.count(anchor) == 1
          t = t.replace(anchor, '''  completed_at: null

# Non-null only for a status/result imported from a pre-authorized external
# execution that completed before repository lifecycle materialization.
external_import:
  authorization_source: null
  import_commit: null

execution:
''', 1)
          tpl_path.write_text(t, encoding='utf-8')
          PY

          git diff --check
          git diff -- registry/status-machines.yaml registry/tests/_TEMPLATE.yaml

      - name: Commit authorization parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MONDE governance automation'
          git config user.email '269188945+tobianahillel-afk@users.noreply.github.com'
          git add registry/status-machines.yaml registry/tests/_TEMPLATE.yaml
          git commit -m 'feat(governance): authorize external L2 and TEST-0008 import'
          git push origin HEAD:chore/work-0001-assurance-closure
