name: Admin REVIEW-0028 verified finding closure

on:
  push:
    branches:
      - review/test-0008-github-models
    paths:
      - .github/workflows/admin-review0028-close-findings.yml

permissions:
  contents: write

jobs:
  close-findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/work-0001-assurance-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact reviewed closure head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4c945fa83a6b246365451a4df74f7c0ac34431f5"
          python - <<'PY'
          from pathlib import Path
          p=Path('registry/reviews/REVIEW-0028.yaml').read_text()
          assert 'status: COMPLETE' in p
          assert 'outcome: APPROVE_WITH_FOLLOWUP' in p
          assert 'total: 41' in p
          assert 'all_closable: true' in p
          assert 'material_findings: []' in p
          PY

      - name: Resolve exact independently verified finding set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          expected = {
            'REVIEW-0004': ['F-1','F-2','F-3','F-4','F-5','F-6'],
            'REVIEW-0005': ['F-1','F-2','F-3'],
            'REVIEW-0006': ['F-1','F-2'],
            'REVIEW-0007': ['F-1'],
            'REVIEW-0008': ['F-1'],
            'REVIEW-0009': ['F-1','F-2'],
            'REVIEW-0010': ['F-1'],
            'REVIEW-0011': ['F-1'],
            'REVIEW-0012': ['F-1'],
            'REVIEW-0013': ['F-1'],
            'REVIEW-0014': ['F-1','F-2'],
            'REVIEW-0015': ['F-1'],
            'REVIEW-0016': ['F-1'],
            'REVIEW-0017': ['F-1','F-2'],
            'REVIEW-0018': ['F-1'],
            'REVIEW-0019': ['F-1','F-2'],
            'REVIEW-0020': ['F-1'],
            'REVIEW-0021': ['F-1'],
            'REVIEW-0022': ['F-1','F-2'],
            'REVIEW-0023': ['F-1'],
            'REVIEW-0024': ['F-1','F-2'],
            'REVIEW-0025': ['F-1','F-2','F-3'],
            'REVIEW-0026': ['F-1','F-2','F-3'],
          }
          assert sum(map(len, expected.values())) == 41

          changed=[]
          seen=[]
          for review_id, finding_ids in expected.items():
              path=Path(f'registry/reviews/{review_id}.yaml')
              text=path.read_text()
              original=text
              for fid in finding_ids:
                  marker=f'  - id: {fid}\n'
                  start=text.find(marker)
                  assert start >= 0, f'{review_id}/{fid} missing'
                  next_f=text.find('\n  - id: ', start + len(marker))
                  next_checks=text.find('\nchecks:', start + len(marker))
                  ends=[x for x in (next_f,next_checks) if x >= 0]
                  assert ends, f'{review_id}/{fid} block end missing'
                  end=min(ends)
                  block=text[start:end]
                  assert block.count('    disposition: OPEN\n') == 1, f'{review_id}/{fid} not uniquely OPEN'
                  assert block.count('    resolved_by: null\n') == 1, f'{review_id}/{fid} resolved_by unexpected'
                  block=block.replace('    disposition: OPEN\n','    disposition: RESOLVED\n',1)
                  block=block.replace('    resolved_by: null\n','    resolved_by: REVIEW-0028\n',1)
                  text=text[:start]+block+text[end:]
                  seen.append(f'{review_id}/{fid}')
              assert text != original
              path.write_text(text)
              changed.append(str(path))

          expected_ids=[f'{r}/{f}' for r,fs in expected.items() for f in fs]
          assert seen == expected_ids
          print(f'closed_findings={len(seen)} files={len(changed)}')
          PY

          git diff --check
          python - <<'PY'
          import subprocess
          expected=[f'registry/reviews/REVIEW-{i:04d}.yaml' for i in range(4,27)]
          actual=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert actual == expected, (actual, expected)
          PY

      - name: Commit and push atomic closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/reviews/REVIEW-0*.yaml
          git commit -m 'chore(review): resolve REVIEW-0028 verified findings'
          git push origin HEAD:chore/work-0001-assurance-closure
