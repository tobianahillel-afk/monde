name: MONDE Governance Core

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Deterministic governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements/governance-ci.txt

      - name: Install governance toolchain
        run: python -m pip install --require-hashes -r requirements/governance-ci.txt

      - name: Unit, property and branch coverage
        run: |
          python -m pytest \
            --cov=tools.governance \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100

      - name: Critical mutation smoke
        run: python scripts/governance_mutation_smoke.py

      - name: Validate repository state
        run: |
          python -m tools.governance.validate_repo . --json-out governance-findings.json
          python -m tools.governance.path_safety . --json-out path-findings.json

      - name: Validate base-to-head transition
        if: inputs.event_name == 'pull_request'
        run: |
          python -m tools.governance.change_guard . \
            --base '${{ inputs.base_sha }}' \
            --head '${{ inputs.head_sha }}' \
            --json-out change-findings.json

      - name: Generate AI context manifest
        if: inputs.event_name == 'pull_request'
        run: |
          python -m tools.governance.context_manifest . \
            --base '${{ inputs.base_sha }}' \
            --head '${{ inputs.head_sha }}' \
            --out context-manifest.json

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MONDE deterministic governance'
            echo
            echo '- Event: `${{ inputs.event_name }}`'
            echo '- Base: `${{ inputs.base_sha }}`'
            echo '- Head: `${{ inputs.head_sha }}`'
            echo '- Coverage target: **100% line + branch**'
            echo '- Mutation smoke: critical governance mutants must be killed'
            echo '- Static repository, path, schema, secret-pattern, action-pin and transition guards executed above'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monde-governance-${{ inputs.head_sha }}
          path: |
            coverage.xml
            governance-findings.json
            path-findings.json
            change-findings.json
            context-manifest.json
          if-no-files-found: warn
          retention-days: 14
