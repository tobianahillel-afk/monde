            if(result.format!=='MONDE_MINI_SOURCE_POSITION_CONFLICT_INVENTORY_V1' ||
               result.conflicting_entity_count<1 ||
               !result.source_conflicts.some(g=>g.entity===conflict[0]) ||
               result.applied_filters.entity!=='' ||
               result.source_snapshot_report_count!==data.features.length)
              throw Error('invalid conflict inventory structure');
            var exported=result.source_conflicts.flatMap(g=>g.reports);
