              var result=JSON.parse(await blob.text());
              if(result.format!=='MONDE_MINI_GPX_SOURCE_SEGMENT_PROFILE_V1' ||
                  result.visible_sample_count!==3 ||
                  result.adjacent_pair_count!==2 ||
                  result.approximate_adjacent_separation_km<1.5 ||
                  result.approximate_adjacent_separation_km>3.5 ||
                  result.source_trace.original_sample_count!==3 ||
                  result.source_timestamp_pair_count!==2 ||
                  result.reversed_source_timestamp_pair_count!==1 ||
                  result.missing_source_timestamp_pair_count!==0 ||
                  result.nonnegative_source_timestamp_delta_seconds!==60 ||
                  result.source_timestamp_pairs[0].source_reported_delta_seconds!==60 ||
                  result.source_timestamp_pairs[1].source_reported_delta_seconds!==-120 ||
                  result.source_elevation_sample_count!==3 ||
                  result.source_elevation_pair_count!==2 ||
                  result.missing_source_elevation_pair_count!==0 ||
