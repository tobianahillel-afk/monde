name: MONDE Mini product CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-mini:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Compile Python
        run: python3 -m compileall -q src/monde tests/test_world_mini.py
      - name: Run behavioral and end-to-end tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p 'test_world*.py' -v
      - name: Generate standalone HTML map from actual source Point fixture
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          from monde.world import WorldMini
          from monde.geojson import to_document
          w = WorldMini.read("examples/monde-mini.json")
          points = WorldMini.load_document("examples/monde-mini-points.geojson")
          w.append_document(to_document(points, source_id="map-demo",
              locator="fixture://map-demo", captured_at="2026-01-10T10:00:00Z",
              valid_from="2026-01-01T00:00:00Z"))
          w.save("/tmp/monde-map-state.json")
          PY
          python3 -m monde.map_view \
            --state /tmp/monde-map-state.json \
            --bbox '2.34,48.84,2.36,48.87' \
            --at '2026-01-02T00:00:00Z' \
            --known-at '2026-01-10T10:00:00Z' \
            --output /tmp/monde-evidence-map.html
      - name: Exercise direct GeoJSON-to-offline-map in real browser
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -m monde.map_view \
            --geojson examples/monde-mini-points.geojson \
            --source-id original-map-source \
            --source-locator 'dataset://original/points.geojson' \
            --captured-at '2026-01-10T10:00:00Z' \
            --valid-from '2026-01-01T00:00:00Z' \
            --at '2026-01-02T00:00:00Z' \
            --known-at '2026-01-10T10:00:00Z' \
            --output /tmp/monde-direct-geojson.html
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --timeout=15000 --dump-dom \
            file:///tmp/monde-direct-geojson.html > /tmp/monde-direct-geojson-dom.html
          grep -q 'data-monde-ready="true"' /tmp/monde-direct-geojson-dom.html
          grep -q 'original-map-source' /tmp/monde-direct-geojson-dom.html
          grep -q '<circle' /tmp/monde-direct-geojson-dom.html
          # Confirm real Chromium executed the offline Natural Earth SVG renderer.
          grep -q 'data-monde-land-count="127"' /tmp/monde-direct-geojson-dom.html
          grep -q 'id="land"' /tmp/monde-direct-geojson-dom.html
      - name: Generate real corrected-source knowledge-change HTML map
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          from monde.world import WorldMini
          w = WorldMini.read("/tmp/monde-map-state.json")
          source = {e["id"]: e["source_id"] for e in w.export()["evidence"]}
          prior = next(a for a in w.export()["assertions"]
              if a["attribute"] == "geo_point" and source[a["evidence_id"]] == "map-demo")
          w.add_evidence({"id": "demo-map-revision-evidence", "source_id": "map-demo",
              "locator": "fixture://map-demo/revision",
              "captured_at": "2026-01-11T10:00:00Z", "source_event_at": None})
          w.add_assertion({**prior, "id": "demo-map-revision-assertion",
              "known_at": "2026-01-11T10:00:00Z",
              "evidence_id": "demo-map-revision-evidence",
              "supersedes": prior["id"],
              "value": {"type": "Point", "coordinates": [5.0, 45.0]}})
          w.save("/tmp/monde-map-revised-state.json")
          PY
          python3 -m monde.map_view \
            --state /tmp/monde-map-revised-state.json \
            --bbox '2.34,48.84,2.36,48.87' \
            --at '2026-01-02T00:00:00Z' \
            --compare-known-at '2026-01-10T10:00:00Z' \
            --known-at '2026-01-11T10:00:00Z' \
            --output /tmp/monde-knowledge-changes-map.html
      - name: Generate offline source world-time comparison
        env:
          PYTHONPATH: src
        run: |
          python3 -m monde.map_view \
            --state /tmp/monde-map-state.json \
            --bbox '2.34,48.84,2.36,48.87' \
            --compare-at '2025-12-31T00:00:00Z' \
            --at '2026-01-02T00:00:00Z' \
            --known-at '2026-01-10T10:00:00Z' \
            --output /tmp/monde-world-changes-map.html
      - name: Verify real headless browser renders all map modes
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --timeout=15000 --dump-dom \
            file:///tmp/monde-evidence-map.html > /tmp/monde-rendered-dom.html
          grep -q 'data-monde-ready="true"' /tmp/monde-rendered-dom.html
          grep -q '<circle' /tmp/monde-rendered-dom.html
          grep -q 'map-demo' /tmp/monde-rendered-dom.html
          grep -q 'id="export-dossier"' /tmp/monde-rendered-dom.html
          "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --timeout=15000 --dump-dom \
            file:///tmp/monde-knowledge-changes-map.html > /tmp/monde-knowledge-rendered.html
          grep -q 'data-monde-ready="true"' /tmp/monde-knowledge-rendered.html
          grep -q 'demo-map-revision-assertion' /tmp/monde-knowledge-rendered.html
          grep -q 'NEWLY_CURRENT' /tmp/monde-knowledge-rendered.html
          grep -q 'NOT verified physical movement' /tmp/monde-knowledge-rendered.html
          "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --timeout=15000 --dump-dom \
            file:///tmp/monde-world-changes-map.html > /tmp/monde-world-rendered.html
          grep -q 'data-monde-ready="true"' /tmp/monde-world-rendered.html
          grep -q 'NEWLY_CURRENT' /tmp/monde-world-rendered.html
          grep -q 'NOT verified physical movement' /tmp/monde-world-rendered.html
      - name: Exercise pairwise source separation in a real offline browser
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # Include both original Point fixtures, not only the smaller viewport.
          python3 -m monde.map_view \
            --state /tmp/monde-map-state.json \
            --bbox '2.28,48.84,2.36,48.88' \
            --at '2026-01-02T00:00:00Z' \
            --known-at '2026-01-10T10:00:00Z' \
            --output /tmp/monde-pairwise-state.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("/tmp/monde-pairwise-state.html").read_text(encoding="utf-8")
          probe = """<script>
          (function(){
            var buttons=document.querySelectorAll('#report-list button');
            if(buttons.length<2)throw Error('fixture must contain two reported positions');
            buttons[0].click();
            document.getElementById('measure-a').click();
            var second=document.querySelectorAll('#report-list button');
            second[1].click();
            document.getElementById('measure-b').click();
            var summary=document.getElementById('measure-summary').textContent;
            if(!summary.includes('Approx.') || !summary.includes('source-reported coordinates only'))
              throw Error('pairwise source distance not displayed');
            if(document.getElementById('export-measure').disabled)
              throw Error('evidence pair export not enabled');
            document.getElementById('clear-measure').click();
            if(!document.getElementById('export-measure').disabled)
              throw Error('clear must disable stale distance export');
            document.body.setAttribute('data-monde-pairwise-distance','pass');
          }());
          </script>"""
          Path("/tmp/monde-evidence-map-pair-test.html").write_text(
              page.replace("</body>", probe+"</body>"), encoding="utf-8")
          PY
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --timeout=15000 --dump-dom \
            file:///tmp/monde-evidence-map-pair-test.html > /tmp/monde-pair-dom.html
          grep -q 'data-monde-pairwise-distance="pass"' /tmp/monde-pair-dom.html
      - name: Exercise evidence search and focus in a real headless browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/monde-evidence-map.html')
          page = path.read_text(encoding='utf-8')
          probe = """<script>
          (function(){
            var field = document.getElementById('report-search');
            field.value = 'source-that-does-not-exist';
            field.dispatchEvent(new Event('input'));
            if(document.querySelectorAll('#points circle').length !== 0)
              throw Error('search did not filter all points');
            field.value = 'map-demo';
            field.dispatchEvent(new Event('input'));
            if(document.querySelectorAll('#points circle').length < 1)
              throw Error('source search did not restore points');
            document.querySelector('#report-list button').click();
            var box = document.getElementById('map').getAttribute('viewBox');
            if(box === '0 0 1200 600' ||
               document.getElementById('focus-selected').disabled)
              throw Error('selected evidence failed to center');
            document.getElementById('clear-search').click();
            if(field.value !== '')throw Error('clear search failed');
            document.body.setAttribute('data-monde-evidence-search','pass');
          }());
          </script>"""
          path = Path('/tmp/monde-evidence-map-search-test.html')
          path.write_text(page.replace('</body>', probe + '</body>'),
                          encoding='utf-8')
          PY
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --timeout=15000 --dump-dom \
            file:///tmp/monde-evidence-map-search-test.html > /tmp/monde-search-dom.html
          grep -q 'data-monde-evidence-search="pass"' /tmp/monde-search-dom.html
      - name: Generate a map with contradictory source-reported positions
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import copy
          from monde.world import WorldMini
          from monde.geojson import to_document
          world = WorldMini.read("/tmp/monde-map-state.json")
          source = WorldMini.load_document("examples/monde-mini-points.geojson")
          alternative = copy.deepcopy(source)
          alternative["features"] = alternative["features"][:1]
          alternative["features"][0]["geometry"]["coordinates"] = [5.0, 45.0]
          world.append_document(to_document(alternative, source_id="contrary-map",
              locator="fixture://contrary-map", captured_at="2026-01-10T10:00:00Z",
              valid_from="2026-01-01T00:00:00Z"))
          world.save("/tmp/monde-compare-state.json")
          PY
          python3 -m monde.map_view \
            --state /tmp/monde-compare-state.json \
            --bbox '2.34,48.84,2.36,48.87' \
            --at '2026-01-02T00:00:00Z' \
            --known-at '2026-01-10T10:00:00Z' \
            --output /tmp/monde-compare-claims.html
      - name: Compare contradictory source reports in a real offline browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          original = Path("/tmp/monde-compare-claims.html").read_text(encoding="utf-8")
          probe = """<script>
          (async function(){
            var payload=JSON.parse(document.getElementById('monde-data').textContent);
            var entities=document.getElementById('entities');
            var checks=document.getElementById('disagreements-only');
            if(payload.features.length!==2||entities.options.length!==2)
              throw Error('missing competing source reports');
             var linkLayer=document.getElementById('disagreement-links');
             var toggle=document.getElementById('show-disagreement-links');
             if(linkLayer.querySelectorAll('line').length!==1)
               throw Error('expected one cross-source disagreement link');
             toggle.checked=false;
             toggle.dispatchEvent(new Event('change'));
             if(linkLayer.querySelectorAll('line').length!==0)
               throw Error('disagreement link was not hidden');
             toggle.checked=true;
             toggle.dispatchEvent(new Event('change'));
             if(linkLayer.querySelectorAll('line').length!==1)
               throw Error('disagreement link was not restored');
            var entity=payload.features[0].properties.entity;
            entities.value=entity;
            entities.dispatchEvent(new Event('change'));
            if(document.querySelectorAll('#entity-comparison-list button').length!==2)
              throw Error('entity comparison omitted source evidence');
            var summary=document.getElementById('entity-comparison-summary').textContent;
            if(!summary.includes('2 sources')||!summary.includes('2 distinct reported positions'))
              throw Error('competing positions incorrectly described');
            document.querySelector('#entity-comparison-list button').click();
            if(!document.getElementById('details').textContent.includes('Evidence:'))
              throw Error('comparison cannot inspect original evidence');
            checks.checked=true;
            checks.dispatchEvent(new Event('change'));
            if(document.querySelectorAll('#points circle').length!==2)
              throw Error('different-source position filter lost source reports');
            var blob=null;
            var oldCreate=URL.createObjectURL,oldClick=HTMLAnchorElement.prototype.click;
            URL.createObjectURL=function(data){blob=data;return 'blob:local-probe';};
            HTMLAnchorElement.prototype.click=function(){};
            document.getElementById('export-visible').click();
            var result=JSON.parse(await blob.text());
            if(result.features.length!==2||
               result.monde_visible_export.filters.entity!==entity||
               result.monde_visible_export.filters.different_source_positions_only!==true)
              throw Error('comparison metadata/evidence missing from GeoJSON');
            // Center a source report then zoom until competing source position
            // leaves the displayed window; original evidence remains intact.
            document.getElementById('reset').click();
            document.querySelector('#report-list button').click();
            for(var z=0;z<4;z++)document.getElementById('zoom-in').click();
            var displayed=document.getElementById('current-view-only');
            displayed.checked=true;
            displayed.dispatchEvent(new Event('change'));
            if(document.querySelectorAll('#points circle').length!==1)
              throw Error('map window did not filter competing source reports');
            blob=null;
            document.getElementById('export-visible').click();
            var filtered=JSON.parse(await blob.text());
            if(filtered.features.length!==1||
               filtered.monde_visible_export.filters.displayed_map_window_only!==true||
               filtered.monde_visible_export.filters.displayed_map_window_bbox_wgs84?.length!==4||
               payload.features.length!==2)
              throw Error('map-window export lost evidence lineage or filter');
            document.getElementById('reset').click();
            if(document.querySelectorAll('#points circle').length!==2)
              throw Error('whole-world reset failed to restore source reports');
            document.getElementById('zoom-in').click();
            var map=document.getElementById('map');
            var previousX=Number(map.getAttribute('viewBox').split(' ')[0]);
            map.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
            if(Number(map.getAttribute('viewBox').split(' ')[0])<=previousX)
              throw Error('keyboard pan failed to navigate the map');
            var search=document.getElementById('report-search');
            search.value='no-such-source-assertion';
            search.dispatchEvent(new Event('input'));
            if(linkLayer.querySelectorAll('line').length!==0)
               throw Error('filtered evidence still has disagreement links');
             if(document.querySelectorAll('#points circle').length!==0||
               !document.getElementById('export-visible').disabled)
              throw Error('entity comparison and search filters did not compose');
            URL.createObjectURL=oldCreate;
            HTMLAnchorElement.prototype.click=oldClick;
            document.body.setAttribute('data-monde-compare','pass');
          }()).catch(e=>document.body.setAttribute('data-monde-compare','fail:'+e.message));
          </script>"""
          Path("/tmp/monde-compare-smoke.html").write_text(
              original.replace("</body>", probe+"</body>"), encoding="utf-8")
          PY
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=2000 --timeout=15000 --dump-dom \
            file:///tmp/monde-compare-smoke.html > /tmp/monde-compare-dom.html
          if ! grep -q 'data-monde-compare="pass"' /tmp/monde-compare-dom.html; then
            grep -o 'data-monde-compare="[^"]*"' /tmp/monde-compare-dom.html || true
            echo 'Offline entity comparison browser behavior did not pass'
            exit 1
          fi
      - name: Verify filtered GeoJSON export in a real offline browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for src, target in (
              ('/tmp/monde-evidence-map.html', '/tmp/monde-filtered-export-smoke.html'),
              ('/tmp/monde-knowledge-changes-map.html', '/tmp/monde-filtered-changes-smoke.html'),
              ('/tmp/monde-world-changes-map.html', '/tmp/monde-filtered-world-smoke.html'),
          ):
              page = Path(src).read_text(encoding='utf-8')
              probe = """<script>
              (async function(){
                var data=JSON.parse(document.getElementById('monde-data').textContent);
                var query=document.getElementById('report-search');
                var exportButton=document.getElementById('export-visible');
                var download=null;
                var payload=null;
                var originalClick=HTMLAnchorElement.prototype.click;
                var originalCreate=URL.createObjectURL;
                URL.createObjectURL=function(blob){payload=blob;return 'blob:monde-test';};
                HTMLAnchorElement.prototype.click=function(){download=this.download;};
                var captureFrom=document.getElementById('captured-from');
                var captureThrough=document.getElementById('captured-through');
                var days=data.features.map(f=>
                  new Date(Date.parse(f.properties.captured_at)).toISOString().slice(0,10)).sort();
                if(!days.length)throw Error('no capture timestamp fixture');
                captureThrough.value=days[0];
                captureThrough.dispatchEvent(new Event('change'));
                var firstDay=data.features.filter(f=>
                  new Date(Date.parse(f.properties.captured_at)).toISOString().slice(0,10)<=days[0]);
                if(document.querySelectorAll('#points circle').length!==firstDay.length)
                  throw Error('inclusive capture end filter mismatch');
                captureThrough.value='1900-01-01';
                captureThrough.dispatchEvent(new Event('change'));
                if(document.querySelectorAll('#points circle').length!==0||
                   !exportButton.disabled)
                  throw Error('capture filter did not exclude reports');
                captureThrough.value='';
                captureThrough.dispatchEvent(new Event('change'));
                captureFrom.value=days[days.length-1];
                captureFrom.dispatchEvent(new Event('change'));
                var lastDay=data.features.filter(f=>
                  new Date(Date.parse(f.properties.captured_at)).toISOString().slice(0,10)>=days[days.length-1]);
                if(document.querySelectorAll('#points circle').length!==lastDay.length)
                  throw Error('inclusive capture start filter mismatch');
                captureFrom.value='';
                captureFrom.dispatchEvent(new Event('change'));
                if(document.querySelectorAll('#points circle').length!==data.features.length)
                  throw Error('capture filter reset lost source reports');
                var srcName=data.features[0]?.properties.source_id;
                if(!srcName)throw Error('no fixture reports');
                document.getElementById('sources').value=srcName;
                document.getElementById('sources').dispatchEvent(new Event('change'));
                var expected=data.features.filter(f=>f.properties.source_id===srcName);
                if(!expected.length||exportButton.disabled)throw Error('no export selection');
                exportButton.click();
                if(!payload||download!=='monde-visible-source-evidence.geojson')
                  throw Error('missing visible GeoJSON download');
                var result=JSON.parse(await payload.text());
                if(result.type!=='FeatureCollection'||
                   JSON.stringify(result.features)!==JSON.stringify(expected)||
                   result.monde_visible_export.exported_feature_count!==expected.length||
                   result.monde_visible_export.original_feature_count!==data.features.length||
                   result.monde_visible_export.scope!=='VISIBLE_SOURCE_REPORTS_ONLY'||
                   result.monde_visible_export.filters.captured_from_utc_day!==''||
                   result.monde_visible_export.filters.captured_through_utc_day!=='')
                  throw Error('lost filtered source evidence');
                if(JSON.stringify(data.features).includes('monde_visible_export'))
                  throw Error('source snapshot mutated');
                query.value='no-possible-source-matches-999';
                query.dispatchEvent(new Event('input'));
                if(!exportButton.disabled)throw Error('empty export must be disabled');

                 var fit=document.getElementById('fit-reports');
                 if(!fit.disabled)throw Error('fit enabled with no reports');
                 query.value='';
                 query.dispatchEvent(new Event('input'));
                 if(fit.disabled)throw Error('fit disabled with matching reports');
                 var windowOnly=document.getElementById('current-view-only');
                 windowOnly.checked=true;
                 windowOnly.dispatchEvent(new Event('change'));
                 document.getElementById('zoom-in').click();
                 fit.click();
                 var b=document.getElementById('map').getAttribute('viewBox')
                   .split(' ').map(Number);
                 var reports=data.features.filter(f=>f.properties.source_id===srcName);
                 if(b.length!==4||b.some(n=>!Number.isFinite(n))||
                   b[2]>1200||b[3]>600||Math.abs(b[2]-2*b[3])>0.00001||
                   reports.some(f=>{
                     var coords=f.geometry.coordinates;
                     var px=(coords[0]+180)/360*1200;
                     var py=(90-coords[1])/180*600;
                     return px<b[0]-0.00001||px>b[0]+b[2]+0.00001||
                       py<b[1]-0.00001||py>b[1]+b[3]+0.00001;
                   }))
                   throw Error('fit does not frame the matching reports');
                 if(document.querySelectorAll('#points circle').length!==reports.length)
                   throw Error('fit did not restore offscreen matching reports');

                document.body.setAttribute('data-monde-export','pass');
                URL.createObjectURL=originalCreate;
                HTMLAnchorElement.prototype.click=originalClick;
              }()).catch(e=>document.body.setAttribute('data-monde-export','fail:'+e.message));
              </script>"""
              Path(target).write_text(page.replace('</body>', probe+'</body>'),encoding='utf-8')
          PY
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for page in filtered-export-smoke filtered-changes-smoke filtered-world-smoke; do
            "$browser" --headless --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --virtual-time-budget=2000 \
              --timeout=15000 --dump-dom \
              "file:///tmp/monde-$page.html" > "/tmp/monde-$page-dom.html"
            grep -q 'data-monde-export="pass"' "/tmp/monde-$page-dom.html"
          done
      - name: Export filtered spreadsheet-safe source CSV in real offline Chromium
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from monde.map_view import render_map
          original = Path("/tmp/monde-compare-claims.html").read_text(encoding="utf-8")
          match = re.search(r'id="monde-data">(.*?)</script>', original, re.S)
          if match is None:
              raise ValueError("missing source GeoJSON")
          data = json.loads(match.group(1))
          data["features"][0]["properties"]["locator"] = "=SUM(1,2)"
          src = render_map(data)
          script = """
          <script>
          (async function(){
            try {
              var raw=JSON.parse(document.getElementById('monde-data').textContent);
              if(raw.features.length<2)throw Error('requires independent sources');
              var selected=raw.features[0].properties.source_id;
              var chooser=document.getElementById('sources');
              chooser.value=selected;
              chooser.dispatchEvent(new Event('change'));
              var btn=document.getElementById('export-visible-csv');
              if(btn.disabled)throw Error('button disabled for source reports');
              var originalClick=HTMLAnchorElement.prototype.click;
              var oldCreate=URL.createObjectURL,blob=null,filename=null;
              URL.createObjectURL=function(value){blob=value;return 'blob:offline-csv';};
              HTMLAnchorElement.prototype.click=function(){filename=this.download;};
              btn.click();
              if(filename!=='monde-visible-source-evidence.csv'||!blob)
                throw Error('missing CSV download');
              var csv=await blob.text();
              if(!csv.replace(/^\\uFEFF/,'').startsWith('entity,longitude,latitude,assertion_id,'))
                throw Error('missing canonical CSV schema');
              if(!csv.includes('FILTERED_VISIBLE_SOURCE_REPORTS_ONLY'))
                throw Error('missing source-only scope');
              if(!csv.includes(String.fromCharCode(39)+'=SUM(1,2)'))
                throw Error('spreadsheet-formula text was not escaped');
              var loc=raw.features[0].geometry.coordinates;
              if(!csv.includes(',"'+String(loc[0])+'","'+String(loc[1])+'",'))
                throw Error('numeric WGS84 coordinates unexpectedly modified');
              var count=raw.features.filter(f=>f.properties.source_id===selected).length;
              if(csv.trimEnd().split('\\r\\n').length!==count+1)
                throw Error('filtered report count mismatch');
              var others=raw.features.filter(f=>f.properties.source_id!==selected);
              if(others.some(f=>csv.includes('"'+f.id+'"')))
                throw Error('source selection leaked another assertion');
              chooser.value='';chooser.dispatchEvent(new Event('change'));
              raw=JSON.parse(document.getElementById('monde-data').textContent);
              btn.click();
              if(!blob||btn.disabled)throw Error('export failed');
              var search=document.getElementById('report-search');
              search.value='unlikely-no-monde-match-zz';
              search.dispatchEvent(new Event('input'));
              if(!btn.disabled)throw Error('empty set did not disable export');
              URL.createObjectURL=oldCreate;
              HTMLAnchorElement.prototype.click=originalClick;
              document.body.setAttribute('data-monde-csv-export','pass');
            }catch(e){document.body.setAttribute('data-monde-csv-export','fail:'+e.message);}
          })();
          </script>
          """
          Path("/tmp/monde-visible-csv-smoke.html").write_text(
              src.replace("</body>",script+"</body>"),encoding="utf-8")
          PY
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=2500 --timeout=15000 --dump-dom \
            file:///tmp/monde-visible-csv-smoke.html > /tmp/monde-visible-csv-dom.html
          if ! grep -q 'data-monde-csv-export="pass"' /tmp/monde-visible-csv-dom.html; then
            grep -o 'data-monde-csv-export="[^"]*"' /tmp/monde-visible-csv-dom.html || true
            exit 1
          fi
      - name: Exercise cross-entity conflict navigator and evidence download in real Chromium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/monde-compare-claims.html').read_text(encoding='utf-8')
          check = """<script>
          (async function(){
            var data=JSON.parse(document.getElementById('monde-data').textContent);
            var groups=new Map();
            data.features.forEach(f=>{
              var entity=f.properties.entity;
              if(!groups.has(entity))groups.set(entity,[]);
              groups.get(entity).push(f);
            });
            var conflict=Array.from(groups).find(([entity,reports])=>
              new Set(reports.map(f=>f.properties.source_id)).size>1 &&
              new Set(reports.map(f=>JSON.stringify(f.geometry.coordinates))).size>1);
            if(!conflict)throw Error('missing conflict fixture');
            var buttons=document.querySelectorAll('#conflict-list button');
            if(!buttons.length)throw Error('conflict navigator empty');
            var original=JSON.stringify(data.features);
            buttons[0].click();
            if(!document.getElementById('entities').value)
              throw Error('conflict selection did not update entity');
            var download=null,blob=null;
            URL.createObjectURL=function(b){blob=b;return 'blob:conflicts';};
            HTMLAnchorElement.prototype.click=function(){download=this.download;};
            var exp=document.getElementById('export-conflicts');
            if(exp.disabled)throw Error('conflict export disabled despite conflicting evidence');
            exp.click();
            if(!blob||download!=='monde-source-conflict-inventory.json')
              throw Error('missing conflict inventory download');
            var result=JSON.parse(await blob.text());
            if(result.format!=='MONDE_MINI_SOURCE_POSITION_CONFLICT_INVENTORY_V1' ||
               result.conflicting_entity_count<1 ||
               !result.source_conflicts.some(g=>g.entity===conflict[0]) ||
               result.applied_filters.entity!=='' ||
               result.source_snapshot_report_count!==data.features.length)
              throw Error('invalid conflict inventory structure');
            var exported=result.source_conflicts.flatMap(g=>g.reports);
            if(exported.some(f=>!f.id||!f.properties.source_id||!f.properties.evidence_id))
              throw Error('source/evidence identity lost');
            if(JSON.stringify(data.features)!==original)
              throw Error('embedded source evidence mutated');
            document.body.setAttribute('data-monde-conflicts','pass');
          }()).catch(e=>document.body.setAttribute('data-monde-conflicts','fail:'+e.message));
          </script>"""
          Path('/tmp/monde-conflicts-smoke.html').write_text(
              source.replace('</body>', check+'</body>'),encoding='utf-8')
          PY
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=2200 --timeout=15000 --dump-dom \
            "file:///tmp/monde-conflicts-smoke.html" > /tmp/monde-conflicts-dom.html
          if ! grep -q 'data-monde-conflicts="pass"' /tmp/monde-conflicts-dom.html; then
            grep -o 'data-monde-conflicts="[^"]*"' /tmp/monde-conflicts-dom.html || true
            exit 1
          fi
      - name: Exercise capture-day timeline and date filter in real offline Chromium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          html = Path('/tmp/monde-compare-claims.html').read_text(encoding='utf-8')
          match = re.search(r'(<script type="application/json" id="monde-data">)(.*?)(</script>)', html, re.S)
          if not match:
              raise RuntimeError('missing source evidence snapshot')
          data = json.loads(match.group(2))
          if len(data['features']) < 2:
              raise RuntimeError('missing two source reports')
          data['features'][0]['properties']['captured_at'] = '2026-01-10T10:00:00Z'
          data['features'][1]['properties']['captured_at'] = '2026-01-11T10:00:00Z'
          encoded = json.dumps(data, ensure_ascii=False, separators=(',', ':')).replace('<', '\\u003c').replace('>', '\\u003e').replace('&', '\\u0026')
          html = html[:match.start(2)] + encoded + html[match.end(2):]
          script = """<script>
          (function(){
            try{
              var timeline=document.getElementById('capture-timeline');
              var buttons=Array.from(timeline.querySelectorAll('button'));
              if(buttons.length<2)throw Error('missing original source capture-day choices');
              var target=buttons.find(b=>b.textContent.includes('2026-01-10'));
              if(!target)throw Error('capture day missing');
              var original=document.getElementById('monde-data').textContent;
              target.click();
              if(document.getElementById('captured-from').value!=='2026-01-10' ||
                 document.getElementById('captured-through').value!=='2026-01-10')
                throw Error('capture day click did not update both time bounds');
              var visible=Array.from(document.querySelectorAll('#report-list button'));
              if(!visible.length)throw Error('capture-day filter did not retain original report');
              if(timeline.querySelectorAll('button').length<2)
                throw Error('other day disappeared after selecting a day');
              if(!Array.from(timeline.querySelectorAll('button')).some(b=>
                  b.getAttribute('aria-pressed')==='true'))throw Error('missing selected-day state');
              document.getElementById('clear-capture-days').click();
              if(document.getElementById('captured-from').value ||
                 document.getElementById('captured-through').value)
                throw Error('clear dates did not restore all days');
              if(document.getElementById('monde-data').textContent!==original)
                throw Error('original source snapshot mutated');
              document.body.setAttribute('data-monde-capture-timeline','pass');
            }catch(e){document.body.setAttribute('data-monde-capture-timeline','fail:'+e.message);}
          })();
          </script>"""
          Path('/tmp/monde-capture-timeline-smoke.html').write_text(
              html.replace('</body>',script+'</body>'),encoding='utf-8')
          PY
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=2500 --timeout=15000 --dump-dom \
            file:///tmp/monde-capture-timeline-smoke.html > /tmp/monde-capture-timeline-dom.html
          if ! grep -q 'data-monde-capture-timeline="pass"' /tmp/monde-capture-timeline-dom.html; then
            grep -o 'data-monde-capture-timeline="[^"]*"' /tmp/monde-capture-timeline-dom.html || true
            exit 1
          fi
