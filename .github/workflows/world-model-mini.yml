                  result.source_elevation_pairs[0].source_reported_elevation_delta_m!==5.5 ||
                  result.source_elevation_pairs[1].source_reported_elevation_delta_m!==-6.5 ||
                  result.source_elevation_pairs[0].from_assertion_id!==result.original_reports[0].id ||
                  result.source_elevation_pairs[1].to_assertion_id!==result.original_reports[2].id ||
                  result.original_reports.some(f=>!f.properties.monde_gpx_sample_time) ||
                  result.original_reports.length!==3 ||
                  result.original_reports.some(f=>!f.id || !f.properties.evidence_id ||
                    !f.properties.source_id) ||
                  !result.applied_filters.gpx_source_trace ||
                  !result.source_query)
                throw Error('invalid profile: '+JSON.stringify({samples:result.visible_sample_count,
                  pairs:result.adjacent_pair_count,
                  km:result.approximate_adjacent_separation_km,
                  original:result.source_trace.original_sample_count,
                  exported:result.original_reports.length,
                  filters:!!result.applied_filters.gpx_source_trace,
                  query:!!result.source_query}));
