name: MONDE Dev V2 Interactive Delegation CI
# PR code is tested with read-only checkout; NO candidate-controlled github-script,
# privileged event trigger, Issue mutation or GitHub token-capable code execution.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate without persisted GitHub credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check pure delegation syntax
        run: node --check .github/scripts/monde-dev/delegation.cjs
      - name: Run read-only delegation tests
        run: node --test --experimental-test-coverage .github/scripts/monde-dev/delegation.test.cjs
