name: Governance

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/governance-ci.txt

      - name: Install locked governance toolchain
        run: python -m pip install -r requirements/governance-ci.txt

      - name: Unit and branch coverage
        run: python -m pytest --cov=tools.governance --cov-branch --cov-report=term-missing --cov-fail-under=100

      - name: Validate repository governance
        run: |
          python -m tools.governance.validate_repo .
          python -m tools.governance.path_safety .
