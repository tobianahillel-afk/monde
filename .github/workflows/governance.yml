name: MONDE Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: monde-gate-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-core:
    name: Governance core
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_governance-core.yml
    with:
      event_name: ${{ github.event_name }}
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  dependency-review:
    name: Dependency review
    if: startsWith(github.event_name, 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Probe Dependency Graph availability
        id: depgraph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/monde-sbom.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          case "$code" in
            200)
              echo 'supported=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'supported=false' >> "$GITHUB_OUTPUT"
              echo '::notice title=Dependency Graph unavailable::Dependency Review is defined but cannot become an effective hard gate until WORK-0003 enables GitHub Dependency Graph.'
              ;;
            *)
              echo "Unexpected Dependency Graph probe HTTP status: $code" >&2
              cat /tmp/monde-sbom.json >&2 || true
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.depgraph.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Record unavailable capability
        if: steps.depgraph.outputs.supported == 'false'
        run: |
          echo 'Dependency Review: UNAVAILABLE (Dependency Graph disabled; tracked by WORK-0003)' >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: CodeQL
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  final-gate:
    name: MONDE / Merge Gate
    if: always() && github.event_name != 'schedule'
    needs:
      - governance-core
      - dependency-review
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify lane results
        shell: bash
        run: |
          set -euo pipefail
          echo "governance-core=${{ needs.governance-core.result }}"
          echo "dependency-review=${{ needs.dependency-review.result }}"
          echo "codeql=${{ needs.codeql.result }}"
          test '${{ needs.governance-core.result }}' = 'success'
          test '${{ needs.codeql.result }}' = 'success'
          case '${{ needs.dependency-review.result }}' in
            success|skipped) ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact current PR head
        if: startsWith(github.event_name, 'pull_request')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify live GitHub review state
        if: startsWith(github.event_name, 'pull_request')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m tools.governance.github_live_gate \
            --repo '${{ github.repository }}' \
            --pr '${{ github.event.pull_request.number }}' \
            --head '${{ github.event.pull_request.head.sha }}' \
            --root . \
            --json-out github-live-gate.json

      - name: Write final gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MONDE Merge Gate'
            echo
            echo '- Deterministic governance: `${{ needs.governance-core.result }}`'
            echo '- Dependency review lane: `${{ needs.dependency-review.result }}` (the lane reports UNAVAILABLE when Dependency Graph is disabled; WORK-0003 must enable it)'
            echo '- CodeQL: `${{ needs.codeql.result }}`'
            echo '- Live PR exact-head state, durable finding identities, repository-owner permission and independent exact-head APPROVED review are checked for pull-request-family events.'
            echo '- Review submissions/dismissals and review-comment changes rerun the live gate immediately; a trusted scheduled poll invalidates a previously successful gate if an existing review conversation is later unresolved.'
            echo '- The required exact-head approval is submitted only after thread resolution.'
            echo
            echo '**Only this stable final gate should become the required MONDE status check.**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live gate evidence
        if: always() && startsWith(github.event_name, 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monde-live-gate-${{ github.event.pull_request.head.sha }}
          path: github-live-gate.json
          if-no-files-found: warn
          retention-days: 14

  review-thread-state-poll:
    name: Review thread stale-green poll
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch poller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements/governance-ci.txt
      - name: Install governance toolchain
        run: python -m pip install --require-hashes -r requirements/governance-ci.txt
      - name: Invalidate stale successful gates after thread unresolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.governance.thread_state_poll
