[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monde-governance"
version = "0.1.0"
description = "Deterministic repository governance validator for MONDE"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["tools.governance"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
