[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "monde-governance"
version = "0.2.0"
description = "Deterministic repository and GitHub control-plane governance for MONDE"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-cov==7.0.0", "coverage==7.13.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["tools.governance"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
