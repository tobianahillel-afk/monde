rules:
  - "All progress status values and transitions are defined only by registry/status-machines.yaml#progress; this matrix stores current instances and never defines a competing vocabulary."
  - "Every active work item must appear in this matrix; planned work should also be represented once assigned an ID."
  - "A work item's matrix status must mirror the WORK registry lifecycle; a work item cannot be DONE while any mandatory applicable dimension is NOT_STARTED, PARTIAL, BLOCKED or IN_REVIEW."
  - "NOT_APPLICABLE requires a non-empty justification in the corresponding work item and remains reviewable for non-compensable gates."
  - "Agents update this matrix in the same PR that changes work status."
  - "Policy/documentation may be DONE while automated enforcement remains separately PARTIAL/NOT_STARTED; do not conflate definition with enforcement."
  - "Applicable hard gates are non-compensable regardless of aggregate quality score."
