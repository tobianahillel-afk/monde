rules:
  - "Every active work item must appear in this matrix."
  - "A work item cannot be DONE while any mandatory applicable dimension is NOT_STARTED, PARTIAL, BLOCKED or IN_REVIEW."
  - "NOT_APPLICABLE requires justification in the work item."
  - "Agents update this matrix in the same PR that changes work status."
  - "Policy/documentation may be DONE while automated enforcement remains separately PARTIAL/NOT_STARTED; do not conflate definition with enforcement."
