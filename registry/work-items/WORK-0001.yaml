scope_change:
  approved: true
  rationale: |
    Fresh-context reviews successively narrowed foundational assurance debt without adding MONDE product scope. REVIEW-0026 found independently-resolvable authority evidence, byte-exact normative JSON serialization and transition-stable handover gaps. The current correction binds accepted-finding authority to independent GitHub metadata, makes requirement identity byte-exact through RFC 8785/JCS, advances the handover directly to REVIEW-0026, and re-proves the affected content/authority contracts. The first synchronized REVIEW-0026 TEST-0006 rerun then correctly failed because the handover still ordered that rerun after hypothetical PASS; PROJECT_STATE has now been rewritten as state-conditional routing. No product capability scope is added.
