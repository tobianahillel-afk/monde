discoveries:
  - "Repository intentionally remains public by owner decision; public-code-safe constraints apply."
  - "Acceptance criteria are not a substitute for stable atomic REQ identities when behavior is material and normative."
  - "One broad acceptance criterion may legitimately map to several atomic normative requirements."
  - "Definition of Ready, Definition of Done and verification strategy are independently fail-able even when one acceptance criterion mentions all three."
  - "A compound accepted requirement should be superseded, not silently narrowed; post-v7 replacements must follow normal lifecycle checkpoints."
  - "A syntactically legal PROPOSED → ACCEPTED transition does not itself satisfy specification acceptance; required Review Council hats and cold-read evidence must exist first."
  - "A prematurely accepted post-v7 requirement cannot be rolled backward to PROPOSED; preserve it as historical evidence and replace it through legal supersession with a proposed owner."
  - "Registry status semantics must be registry-specific and machine-readable before CI can enforce transitions safely."
  - "A post-merge independent review can expose assurance debt that was invisible to same-context review."
  - "Historical evidence must not be widened retroactively to corrective files or requirements created after execution."
  - "An unprovable historical tested SHA must not be guessed; the evidence should be superseded and replaced with revision-bound proof."
  - "Superseding evidence must preserve or explicitly partition the behavior represented by the superseded artifact."
  - "A blocking review finding marked ACCEPTED needs explicit accepting authority and evidence, not only a disposition token."
  - "COMPLETE is necessary but not sufficient for approval: only positive outcomes are approval-capable."
  - "A SHA-bound PASS can remain valid for its exact tree while later administrative edits re-question its applicability to the current head; the current gate must be rerun without erasing the historical PASS."
  - "Concurrent active work on different PRs still has one global lifecycle truth; PROJECT_STATE, WORK records and progress matrix must agree."
  - "Cross-branch work mirrors must not put branch-only prerequisites into current-tree read_before; branch checkout is an explicit epistemic/context boundary."
  - "Completion evidence may truthfully regress from DONE to IN_REVIEW after new adverse evidence; reopening must be explicit, reviewed and re-gated."
  - "Immutable historical lifecycle mistakes require exact record/commit-bound migration exceptions, not generic future shortcuts or rewritten history."
  - "Post-contract registry records first materialized after an external completed governance event require exact record/status/commit-bound import evidence; imports are not alternate initial states or reusable transitions."
  - "A syntactically ordered lifecycle replay after an external review already completed is not execution evidence; immutable replay must be labeled as such rather than passed off as normal lifecycle."
  - "A future externally completed review needs a one-shot authorization that exists in a parent commit before materialization, followed by exact import-consumption binding; this separates source-review provenance from repository-native lifecycle execution."
  - "Current proof must be reachable both from the requirement's verification mapping and from the test's protected-requirements edge."
  - "Cold-resume handover currentness must agree in PROJECT_STATE and the active WORK record; updating only one surface is insufficient."
  - "A transition-stable handover should route current mutable execution identity to the canonical TEST record and avoid duplicating volatile PR/test SHAs as second sources of truth."
  - "Current proof must also be enumerated in the active WORK required-test plan, not only in requirement/test traceability."
  - "A cold-resume test must fail rather than bless a correct contract when the canonical handover describing that contract is stale."
  - "CLOSED and COMPLETE review states have different evidence semantics."
  - "A status vocabulary is incomplete as a machine contract without an initial state and transitions."
  - "100% coverage alone is insufficient; test-strength and non-compensable gates are required."
