implementation_plan:
  tasks:
    - id: T1
      description: "Create repository navigation, README, agent protocol and project state."
      depends_on: []
      expected_files: [README.md, AGENTS.md, docs/00_START_HERE.md, PROJECT_STATE.md]
      status: DONE
    - id: T2
      description: "Create Constitution and machine-readable tracking schemas."
      depends_on: [T1]
      expected_files: [docs/09_GOVERNANCE/constitution.md, registry/work-items/_TEMPLATE.yaml, registry/progress/matrix.yaml, registry/dependencies/README.md, registry/capabilities/_TEMPLATE.yaml]
      status: DONE
    - id: T3
      description: "Define development lifecycle, review gates, DoD and testing strategy."
      depends_on: [T2]
      expected_files: [docs/10_ROADMAP/development-process.md, docs/13_QUALITY/definition-of-done.md, docs/13_QUALITY/testing-strategy.md]
      status: DONE
    - id: T4
      description: "Define documentation architecture, development/security rules and ADR process."
      depends_on: [T2]
      expected_files: [docs/03_ARCHITECTURE/documentation-architecture.md, docs/09_GOVERNANCE/development-rules.md, docs/11_ADR/README.md]
      status: DONE
    - id: T5
      description: "Add GitHub PR/issue templates, capability registry contract, project scorecard and Phase-0 roadmap."
      depends_on: [T3, T4]
      expected_files: [.github/pull_request_template.md, .github/ISSUE_TEMPLATE/feature.yml, .github/ISSUE_TEMPLATE/bug.yml, registry/capabilities/README.md, docs/13_QUALITY/project-scorecard.md, docs/10_ROADMAP/phase-0.md]
      status: DONE
    - id: T6
      description: "Open/review bootstrap PR and update canonical project state for handover."
      depends_on: [T5]
      expected_files: [PROJECT_STATE.md, registry/work-items/WORK-0001.yaml, registry/progress/matrix.yaml]
      status: IN_REVIEW
  planned_runs:
    - id: RUN-1
      objective: "Repository navigation, governance and tracking bootstrap"
      tasks: [T1, T2]
      exit_condition: "Core resume and tracking contracts exist"
      status: DONE
    - id: RUN-2
      objective: "Quality, lifecycle and GitHub workflow bootstrap"
      tasks: [T3, T4, T5]
      exit_condition: "Development gates and templates exist"
      status: DONE
    - id: RUN-3
      objective: "Bootstrap PR review and handover"
      tasks: [T6]
      exit_condition: "PR reviewed and project state points to the next work"
      status: IN_REVIEW

required_tests:
  unit: []
  integration: []
  contract:
    - "Cross-file consistency review of status vocabulary, path names and work-item fields"
  e2e:
    - "Resume-path review: README → START_HERE → PROJECT_STATE → WORK-0001 identifies exact next action"
  regression: []
  security:
    - "Repository visibility reviewed; current state observed as public"
  performance: []
  real_system:
    - "Branch writes performed against actual GitHub repository"
    - "Dedicated GitHub pull request created and inspected"

validation:
  executed:
    - "Actual GitHub repository and main branch inspected"
    - "Bootstrap branch created from main"
    - "All bootstrap documents written on the real branch"
    - "Manual read-path consistency check"
    - "PR #1 opened and full diff reviewed"
    - "Structured PR review submitted"
    - "Status-vocabulary inconsistency found during review and corrected before merge"
  evidence:
    - "Git history on bootstrap/ai-governance"
    - "PR #1 review discussion"
  coverage:
    line: NOT_APPLICABLE_NO_EXECUTABLE_CODE
    branch: NOT_APPLICABLE_NO_EXECUTABLE_CODE
  known_gaps:
    - "Registry/document consistency is not yet enforced automatically in CI"
    - "No CI status checks are currently attached to the bootstrap PR"
    - "Repository visibility remains public until owner changes repository settings"
    - "Owner/final merge review remains pending"

risk:
  security: LOW
  data: LOW
  epistemic: MEDIUM
  performance: NONE
  operational: MEDIUM

rollback:
  strategy: "Close/revert bootstrap PR; initial README-only state remains recoverable through Git history."

run_log:
