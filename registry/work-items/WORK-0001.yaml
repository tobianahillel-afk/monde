    - "repository-wide traceability/lifecycle contract changes"
    - "acceptance authority or requirement-acceptance semantics change"

scope_change:
  approved: true
  rationale: |
    Post-merge fresh-context reviews successively narrowed assurance debt without expanding MONDE product scope. REVIEW-0013..0024 established current lifecycle proof, truthful historical/import boundaries, active AC-5 atomic owners, exact proof SHA integrity, cross-branch isolation and machine-enforced v8 acceptance ordering. REVIEW-0025/F-1/F-2/F-3 further requires exact normative-content binding, a genuinely fresh-context acceptance cold read, and machine-resolvable risk/finding authority. v9 introduces only reusable governance primitives needed to satisfy those findings; no product capability scope is added.
