id: WORK-0001
title: "Bootstrap AI-first repository governance"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.1
owner: "repository bootstrap"
created_at: "2026-09-10"
updated_at: "2026-09-14"

purpose: |
  Establish the repository operating system required for MONDE to be safely specified and developed by AI agents without relying on chat history, duplicated work, hidden assumptions or unverifiable completion claims.

scope:
  in:
    - repository navigation and resume protocol
    - AI agent rules and project-state handover
    - work/progress/dependency/reuse registries
    - requirement/assumption/risk/review/test/experiment contracts
    - registry lifecycle/status-machine semantics
    - requirement normative-content identity and acceptance evidence
    - machine-resolvable risk/finding acceptance authority
    - end-to-end traceability
    - development lifecycle and Phase-0 roadmap
    - Definition of Ready, Definition of Done and verification strategy
    - specification-quality, research and Review Council governance
    - assurance levels and advanced verification
    - reproducibility/backtesting and leakage controls
    - security/development/threat-modeling rules
    - ADR/process templates and repository scorecard
  out:
    - MONDE product capability implementation
    - final MONDE product/world-model specifications
    - production infrastructure
    - governance CI implementation owned by WORK-0002
    - GitHub protection/settings implementation owned by WORK-0003

acceptance_criteria:
  - {id: AC-1, description: "A new AI agent can determine what to read and current project state without reading the whole repository.", status: DONE}
  - {id: AC-2, description: "Every future implementation/specification can be represented by a machine-readable work item with dependencies, reuse, tasks, runs, tests and validation evidence.", status: DONE}
  - {id: AC-3, description: "Canonical product/engineering invariants are documented.", status: DONE}
  - {id: AC-4, description: "Development lot/sublot lifecycle and mandatory review gates are documented.", status: DONE}
  - {id: AC-5, description: "Definition of Ready, Definition of Done and comprehensive testing strategy are documented.", status: DONE}
  - {id: AC-6, description: "Progress, dependency, requirement, assumption, risk, review, test, experiment and traceability contracts exist.", status: DONE}
  - {id: AC-7, description: "PR and issue templates force traceability to work items and validation.", status: DONE}
  - {id: AC-8, description: "A repository scorecard covering at least 30 engineering criteria exists.", status: DONE}
  - {id: AC-9, description: "Bootstrap changes receive structured review in a dedicated PR before merge.", status: DONE}
  - {id: AC-10, description: "Canonical documentation/specification work has scientific quality gates, atomic requirements, assumptions/risks, research and end-to-end traceability.", status: DONE}
  - {id: AC-11, description: "Backtesting/reproducibility rules prevent future-information leakage and require baseline/replay evidence for scientific/model claims.", status: DONE}
  - {id: AC-12, description: "Critical quality dimensions are non-compensable and can block completion regardless of aggregate score.", status: DONE}
  - {id: AC-13, description: "Risk-based assurance levels and Review Council roles scale rigor with blast radius and criticality.", status: DONE}
  - {id: AC-14, description: "100% coverage is supplemented by advanced test-strength methods such as mutation/fuzz/property/metamorphic/differential/fault-injection where appropriate.", status: DONE}

