discoveries:
  - "A typed authority field is insufficient when its evidence reference resolves only to the accepting finding itself; authority evidence must independently establish the actor/role."
  - "Canonical JSON semantics are insufficient for content-addressed identity unless the exact serialized bytes are standardized."
  - "A transition-stable handover must advance when the independent review arrives; conditional wording that begins with completed administration can still be stale."
  - "A requirement remaining PROPOSED does not keep stale proof valid after normative content or canonicalization-contract changes."
  - "A generic exact-SHA PASS is not equivalent to an independent cold read; acceptance requires explicit fresh-context provenance and outcomes."
  - "Fail-closed proof preserves useful failures rather than rewriting them."
  - "Cross-branch mirrors must expose only locally resolvable evidence before explicit checkout."
