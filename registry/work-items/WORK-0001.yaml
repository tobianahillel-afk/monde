  scientific_validation: "WORK-0001 defines scientific-validation/backtesting governance but contains no model/forecast claim requiring its own backtest; governance behavior is verified by exact-SHA drills and independent review."

assurance:
  level: A3
  rationale: "Foundational governance affects all subsequent MONDE work and can create systemic process errors if incomplete."
  escalation_triggers:
    - "constitutional process changes"
    - "repository-wide traceability/lifecycle contract changes"
    - "acceptance authority or requirement-acceptance semantics change"

scope_change:
  approved: true
  rationale: |
    Fresh-context reviews successively narrowed foundational assurance debt without adding MONDE product scope. REVIEW-0025 required exact normative-content binding, genuine fresh-context acceptance cold reads and machine-resolvable authority. REVIEW-0026 then found three implementation-level gaps in those corrections: authority evidence was self-referential, normative JSON serialization was not byte-exact across implementations, and the handover repeated already-completed proof work. The current correction binds accepted-finding authority to independent GitHub metadata, makes requirement identity byte-exact through RFC 8785/JCS, and advances the handover directly to the latest external review. No product capability scope is added.
  evidence:
    - REVIEW-0025/F-1
    - REVIEW-0025/F-2
    - REVIEW-0025/F-3
    - REVIEW-0026/F-1
    - REVIEW-0026/F-2
    - REVIEW-0026/F-3

