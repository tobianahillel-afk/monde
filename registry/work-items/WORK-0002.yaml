impact_analysis:
  blast_radius: CROSS_COMPONENT
  upstream: [WORK-0001]
  downstream: [WORK-0003, WORK-0004]
  migrations_or_reprocessing: []
  compatibility_notes: "Validators fail closed and do not rewrite canonical state. Historical execution evidence remains historical rather than being relabeled as proof of later SHAs. The default-branch mirror carries globally resolvable WORK-0002 lifecycle/dependency state plus the narrow PR #5 predecessor; richer PR #2 implementation/review state remains branch-local until integration. Effective merge state is the exact latest GitHub Actions-owned MONDE / Merge Gate check. Target history is sampled only after exact check + unresolved-thread stale-green classification. Actions filtered history uses stable unique time-partition snapshots below GitHub's 1000-result ceiling. Pull Requests authority now passes through a narrow adapter that double-reads open and bounded closed collections, rejects duplicate PR numbers, and compares canonical authority-field fingerprints before core logic can consume them. Both live probe and scheduled poll execute this adapter. Closed history remains bounded by earliest stale-green active incarnation. Protected target jobs bind exact run/current attempt; identifiers use strict types. REVIEW-0031 through REVIEW-0039 are terminal COMPLETE/CHANGES_REQUIRED. REVIEW-0040 and REVIEW-0041 are CLOSED administrative negative evidence after author-side findings invalidated their frozen heads before independent review returned. REVIEW-0042 is OPEN and must receive proven OPEN and IN_PROGRESS checkpoints before fresh independent review. After PR #5 merge, PR #2's older permissive thread_state_poll must directly port/reuse the final hardened contract before T12 can close."

