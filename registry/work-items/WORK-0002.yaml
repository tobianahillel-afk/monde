    - "valid/invalid status, ID, reference, path, transition, review and progress variants"
    - "canonical workflow identity and PR-family event selection remain fail closed"
    - "workflow-run discovery for polling is bounded by active head SHA and earliest active PR-incarnation creation time"
    - "Actions envelope total_count is a stable non-negative exact integer and equals the complete observed collection cardinality"
    - "every canonical PR-family run validates status, repository identity and temporal lifetime before identity filtering"
    - "the required MONDE / Merge Gate job is unique, completed, bound to exact positive integer run_id, selected head/current positive run_attempt and has a supported terminal conclusion"
    - "the independently selected current-incarnation target run exposes a valid protected MONDE / Merge Gate job before rerun even when its run ID equals the effective run ID"
    - "success, neutral and skipped protected required-check conclusions all trigger stale-green thread revalidation even when the workflow conclusion differs"
    - "open PR collection members explicitly validate state=open"
    - "open PR and workflow-run head repository/ref/SHA identities must be complete and unambiguous"
    - "current-incarnation target selection excludes pre-current runs and runs created during same-repository/same-branch overlap windows even when the closed PR final SHA changed before close"
  integration:
    - TEST-0009
    - "PR #5 read-only GitHub contract probe against live PR #2 open-PR, closed-PR history, active-head-scoped canonical workflow-runs, Actions Jobs and review-thread APIs"
  contract:
    - "registry/schema/progress/review/change-control integrity"
