impact_analysis:
  blast_radius: CROSS_COMPONENT
  upstream: [WORK-0001]
  downstream: [WORK-0003, WORK-0004]
  migrations_or_reprocessing: []
  compatibility_notes: "Validators fail closed and do not rewrite canonical state. Historical execution evidence remains historical rather than being relabeled as proof of later SHAs. Review requirements are substantive; adding completed-review evidence is administrative. This default-branch mirror intentionally carries only globally resolvable WORK-0002 lifecycle/dependency state plus the narrow PR #5 stale-green bootstrap predecessor; the richer T7-T12 implementation, review/test registry graph and PR #2 closure identities remain authoritative only after explicit checkout of feat/work-0002-governance-ci until PR #2 is integrated. PR #5 run identity is derived from GitHub-server head repository/ref/SHA. Current target selection also consults PR.created_at/run.created_at and same-repository/same-branch closed-PR lifetime windows without trusting the closed PR final SHA as complete history; workflow_run.pull_requests remains non-authoritative association metadata. REVIEW-0031 and REVIEW-0032 are durable terminal CHANGES_REQUIRED evidence and are never reopened. REVIEW-0033 is the fresh successor review. The bootstrap is temporary and must be removed or rationalized only after the canonical PR #2 poller is integrated and WORK-0003 owns repository protection."

