id: WORK-0002
title: "Automate repository governance validation"
status: PLANNED
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
created_at: "2026-09-10"
updated_at: "2026-09-10"

purpose: |
  Turn the governance contracts introduced by WORK-0001 into executable CI checks so repository state, specifications, traceability and review evidence cannot silently drift.

scope:
  in:
    - validate YAML/registry structure
    - validate allowed statuses and state transitions
    - validate unique immutable IDs across WORK/CAP/REQ/ASM/RISK/REVIEW/TEST/EXP records
    - validate referenced work/capability/dependency/requirement/assumption/risk/review/test/experiment IDs
    - validate read_before paths
    - validate PROJECT_STATE active work references
    - validate canonical documentation links/front matter where practical
    - validate DONE work-item completion requirements
    - detect orphan Accepted requirements and orphan DONE capabilities where possible
    - detect broken traceability chains for critical artifacts
    - validate expired/review-due assumptions and risks
    - validate review-plan requirements are satisfied before completion
    - validate accepted canonical docs do not contain unresolved placeholders where detectable
    - introduce CI workflow and tests for the validator
  out:
    - product implementation
    - full language/toolchain CI for future application code
    - semantic equivalence detection requiring advanced model reasoning

acceptance_criteria:
  - id: AC-1
    description: "Invalid registry/status/reference/path state fails CI with actionable diagnostics."
    status: NOT_STARTED
  - id: AC-2
    description: "Governance validator itself has 100% meaningful line and branch coverage."
    status: NOT_STARTED
  - id: AC-3
    description: "CI executes on pull requests and protects against regressions in canonical repository state."
    status: NOT_STARTED
  - id: AC-4
    description: "Critical traceability and review-completion defects are detectable automatically before a work item can claim DONE."
    status: NOT_STARTED
  - id: AC-5
    description: "Accepted specification records are checked for valid linked requirements/assumptions/risks and canonical references where required."
    status: NOT_STARTED

