purpose: 'Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review
  evidence, scope and proof cannot silently drift.

  '
scope_change:
  approved: true
  rationale: |
    T12 default-branch integration is DONE via merged PR #5 / main b4b52c77fbf05eda65e8f0e951959da70e7edbe7, but T4/AC-6 remain open. REVIEW-0083 reached a valid frozen integrated-head proof on cc37d74e2ee49aea62cfdfa30634c01a1032751f via Bootstrap #346 and Gate #272: 821 tests, 7816 statements / 3568 branches at 100 percent line+branch, 38/38 baseline + 40/40 L2 + 5/5 T10 + 11/11 T11 + 6/6 T13 mutations, all deterministic validators green, CodeQL and Dependency Review green; live gate failed only on 77 unresolved threads and missing exact-head approval. Fresh independent L2 PRR_kwDOUUI5ts8AAAABPJeT9Q then produced three new P1 findings: PRRT_kwDOUUI5ts6lzzao (inherited workflow/job execution controls), PRRT_kwDOUUI5ts6lzzas (backgrounded validator command with single ampersand), and PRRT_kwDOUUI5ts6lzzax (dependency-review skip bypass). Author-side PRRT_kwDOUUI5ts6lz1l8 duplicated the inherited-control finding. Live PR #2 is now 81 unresolved threads. REVIEW-0083 is CLOSED/CHANGES_REQUIRED; a successor review is required after all four live identities are synchronized and the three distinct defects are corrected.
    Fresh exact-SHA L2 REVIEW-0030 found six additional risk-acceptance, normative-digest, authority-evidence, external-import-finalization, PASS-test-revision and review-lifecycle defects after the REVIEW-0029 corrective candidate. GitHub Codex review PRR_kwDOUUI5ts8AAAABNfhWLQ on 5e4dd33995d17587be1452265b830f2b32e0f89b added nine further findings; PRR_kwDOUUI5ts8AAAABNgjLtg and PRR_kwDOUUI5ts8AAAABNgxnRw on 6e6f7a68ed63262e7ff9af56521695d79f6d015b added five and six more. Fresh-context review PRR_kwDOUUI5ts8AAAABNiFSzA on exact candidate 09e4c89c31d6db7343b22d1e0b3badb7b9db7706 added eight further findings covering canonical-policy trust anchors, immutable adoption boundaries, same-evidence acceptance binding, identity-policy revision binding, repository-owner proof anchored outside mutable policy, exact-head independent approval in the live merge gate, and durable tracking of the complete closure set. Fresh-context review PRR_kwDOUUI5ts8AAAABNih5Qw on exact candidate 296ef2005de2ab5964d004d6383393b693594de9 then added six further findings: same-status ACCEPTED requirement and risk invariant revalidation, immutability of all completion-bearing COMPLETE-review fields, detection of intervening content-identity-policy revisions even when reverted, L2 eligibility/trust binding for exact-head approvers, and target-scoped WORK-status reopening triggers. Fresh-context review PRR_kwDOUUI5ts8AAAABNmehrQ on exact candidate 061c17e7144396cbfd01963fb4036f3fc3c58ed3 added six T9 findings covering full merge-history policy traversal, continuing imported-evidence finalization, one-shot import_commit immutability, base-preexisting protected-policy authority, genuinely new reopening triggers, and exact durable/live thread-identity equality. Fresh-context review PRR_kwDOUUI5ts8AAAABNnPvYg on exact candidate 9e4144d255590360f99652e59c38a02dbf95ccfa added four T10 P1 findings covering review-state-triggered live-gate reruns, integration-provenance trust-anchor protection, dependency-driven continuing ACCEPTED requirement revalidation and dependency-driven continuing ACCEPTED risk revalidation. Fresh-context review PRR_kwDOUUI5ts8AAAABNoalkw on exact candidate cc6e98d542fbedf097a8ffbb7eb5dcf128237c84 added five T11 findings covering pre-T10 provenance bootstrap auditing, full-history import materialization, stale-green invalidation after review-thread unresolve, raw committed-blob secret scanning, and structural workflow-trigger parsing. These GitHub reviews remain adverse live source evidence and are not retroactively converted into approving canonical review evidence. The corrective scope also includes duplicate-key YAML rejection and exact immutable integration-history bridges already discovered during earlier correction rounds. These changes harden the existing governance contract without changing MONDE product scope; every historical exception remains exact and non-reusable.
