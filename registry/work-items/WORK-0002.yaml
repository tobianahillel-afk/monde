id: WORK-0002
title: "Automate repository governance validation"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-16"

purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "PR #5 is the narrow trusted-default-branch T12 predecessor. REVIEW-0043 independently rejected the previous 60-call cap strategy with two P1s: a fourteen-head zero-progress outage and stale shared-head thread classification. The successor candidate a1441f506fb1a0f42dbdf984d42e1f847e55db51 introduces bounded rotating head scheduling, at most three reruns per invocation, per-sibling target resolution and a final thread-state read immediately before rerun. Bootstrap #103 proves 86 tests, 664 statements, 292 branches, 100 percent line/branch and a live PR #2 probe at 7/60. REVIEW-0044 is OPEN; all 46 inline material threads remain unresolved."

scope:
  in:
    - deterministic repository-governance validation and traceability
    - GitHub control-plane exact merge-check and review-thread gating
    - trusted default-branch stale-green bootstrap required before PR #2 closure
    - stable unique open Pull Requests authority snapshots
    - canonical PR-family triggering-PR authority from exactly one reusable-workflow `refs/pull/<N>/merge` reference
    - no trust in dynamic `workflow_run.pull_requests` cardinality as event-time provenance
    - same-repository/ref/SHA PR separation by PR number
    - stable partitioned Actions history below GitHub filtered-search caps
    - strict run/job/current-attempt/identifier validation and protected target-job validation
    - fail-closed REST/GraphQL/Checks/Actions metadata and bounded pagination
    - explicit GitHub request-resource control without sacrificing stale-green invalidation progress
    - grouping open PRs by exact head SHA so shared-head siblings remain one scheduling unit
    - rotating head-group order by ten-minute fairness slot
    - maximum seven head groups considered per invocation
    - maximum three stale-green reruns per invocation
    - stable open-authority refresh before target resolution
    - per-sibling PR-bound target resolution using canonical reusable-workflow pull refs
    - protected target-job validation before final review-thread-state observation
    - final review-thread reclassification immediately before rerun decision
    - at most one sibling rerun for a shared SHA per invocation
    - one invocation-wide hard GitHub request counter that blocks request 61 before network I/O
    - least-privilege live read-only probe and actions:write only on trusted scheduled path
    - exact-head line/branch coverage, real GitHub probe and review lifecycle proof
    - stable REQ-0026 -> WORK-0002 -> TEST-0009 -> REVIEW evidence chain through REVIEW-0044
  out:
    - MONDE product implementation
    - product-language CI not yet selected
    - semantic duplicate detection requiring AI reasoning
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

