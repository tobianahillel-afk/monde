    - "PR #5 bootstrap stdlib regression suite covering exact Checks authority, REST pagination/cardinality/unique IDs, filtered-search partitioning and snapshot stability, bounded GraphQL thread pagination, current-incarnation canonical rerun-target discovery, complete run/job-record validation, strict workflow/run/job/check identifier and run-attempt typing, merge-acceptable conclusion semantics, overlapping PR lifetimes, branch-reset history, bounded closed-PR history, check/job caching, ten-minute schedule, workflow trigger completeness and fail-closed malformed data"
  property:
    - "valid/invalid status, ID, reference, path, transition, review and progress variants"
    - "exact latest GitHub Actions-owned MONDE / Merge Gate check is the only effective merge-state authority"
    - "canonical workflow identity and PR-family event selection remain fail closed for rerun targets"
    - "filtered workflow-run discovery partitions below the GitHub 1000-result ceiling into non-overlapping second windows"
    - "accepted filtered workflow-run snapshots have unique exact IDs and identical repeated membership"
    - "Actions envelope total_count is a stable non-negative exact integer and equals the complete observed collection cardinality"
    - "every canonical PR-family run validates status, repository identity and temporal lifetime before target selection"
    - "the required target MONDE / Merge Gate job is unique, completed, bound to exact positive integer run_id, selected head/current positive run_attempt and has a supported terminal conclusion"
    - "workflow_id and every trust-binding identifier reject Boolean, float and coercible non-integer values"
    - "success, neutral and skipped exact required-check conclusions all trigger stale-green thread revalidation"
