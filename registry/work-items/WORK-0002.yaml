scope:
  in:
  - deterministic registry/status/reference/path validation
  - JSON Schema validation for registry records
  - reverse progress-matrix membership and DONE-dimension validation
  - review-evidence status/outcome/hat/independence/blocking-finding validation
  - hierarchical L0/L1/L2/L3 review-independence enforcement
  - assurance-derived minimum review independence for A3/A4
  - canonical Review Council outcome vocabulary with bounded legacy compatibility
  - exact reviewed-commit binding for completed review evidence
  - substantive PASS-test record validation, including real Git commit existence/ancestry
  - exact squash and malformed-YAML integration provenance with fail-closed commit/blob/tree binding
  - canonical RFC 8785/JCS recomputation for requirement normative digests
  - risk-acceptance preconditions and authority-matrix enforcement
  - repository-owner authority evidence bound to the governed MONDE repository
  - external review-import finalization before completion eligibility
  - duplicate-key YAML rejection for canonical machine-readable records
  - work dependency, task/run and cycle validation
  - PROJECT_STATE active-work validation
  - assumption/risk due-date validation
  - Markdown title/path parsing and repository path containment
  - immutable GitHub Action and Docker-action pin validation
  - high-confidence committed-secret pattern detection at HEAD and across the PR commit range
  - raw changed-blob secret-history scanning across every PR commit with an explicit fail-closed size bound
  - base-to-head and per-commit transition validation over the union of paths touched in the commit sequence
  - immutable registry IDs and published-record deletion guard
  - post-READY semantic scope-drift guard
  - review-freshness guard after substantive changes, including review requirements themselves
  - meta-governance path binding to an active changed A3/A4 work item through affected_paths
  - canonical status/authority/content-identity/integration-provenance policy registries treated as protected meta-governance trust anchors
  - exact immutable five-commit audit of the pre-T10 integration-provenance bootstrap
  - NOT_APPLICABLE progress-justification enforcement
  - AI context-manifest generation seeded by changed registry records and dependency closure
  - GitHub live HEAD/mergeability/review-thread gate
  - exact-head independent approval verification in the live merge gate
  - review/review-comment event-driven live-gate reruns on supported GitHub Actions events
  - scheduled stale-green invalidation when an existing review conversation is later unresolved
  - effective workflow trigger and poller structure validated by parsed YAML rather than source-text snippets
  - hash-locked governance Python toolchain
  - reusable GitHub Actions governance core, Dependency Review and CodeQL lanes
  - CI artifacts and stable MONDE merge gate
  - exact pull-request HEAD checkout for deterministic proof
  - immutable/fresh completed-review approval semantics
  - authority evidence that resolves the claimed actor and governed scope
  - Git-history verification of external-review materialization commits
  - full merge-history first-status materialization checks for imported REVIEW/TEST evidence
  - exact squash-tree history recovery kept separate from review/test evidence-eligibility allowlists
  - requirement-acceptance review-import finalization and cold-read reachability
  - same review and same cold-read records satisfying the complete acceptance contract and owning-WORK floor
  - acceptance evidence bound to the exact content-identity policy revision
  - ACCEPTED requirement and risk invariants revalidated on same-status edits
  - dependency-driven revalidation of current ACCEPTED requirements and risks when bound evidence, authority, owning work or policy dependencies change
  - all completion-bearing COMPLETE-review fields immutable after completion
  - content-identity policy full merge history between review/cold-read and acceptance must contain no intervening revision, including side-branch change-then-revert
  - exact-head approvers must be trusted and bound to qualifying fresh-context L2 evidence, not merely differ from the PR author
  - canonical progress lifecycle/reopening enforcement after immutable predecessor-bound adoption
  - WORK-status reopening triggers scoped to the exact reopened WORK and requiring a newly added finding/evidence identity or newly approved scope event
  - protected-policy amendment authority anchored to base-preexisting independently approved active A3/A4 scope
  - explicit non-reusable squash provenance flags and review-ID eligibility
  - one-shot external review import_commit binding to the exact first COMPLETE materialization commit, frozen after binding
  - durable per-finding closure set compared by exact unique GitHub thread identities rather than cardinality
  - DONE task/run terminal-state enforcement
  out:
  - MONDE product implementation
  - product-language CI not yet selected
  - semantic duplicate detection requiring AI reasoning
  - branch/ruleset/visibility administration owned by WORK-0003
  - product architecture fitness functions requiring product code
acceptance_criteria:
- id: AC-1
  description: Invalid registry/status/reference/path/schema state fails deterministically with actionable diagnostics.
  status: DONE
- id: AC-2
  description: A DONE work item cannot pass with incomplete progress dimensions or invalid/incomplete review evidence.
  status: DONE
- id: AC-3
  description: Published IDs, records, state transitions and post-READY semantic scope are guarded across the actual PR commit sequence.
  status: DONE
- id: AC-4
  description: GitHub CI uses immutable/hash-locked dependencies, least privilege, CodeQL, dependency review, artifacts and a stable final merge gate.
  status: DONE
- id: AC-5
  description: AI context and live GitHub state are generated/checked without treating stale repository prose as current merge truth.
  status: DONE
- id: AC-6
  description: All Codex findings are proven fixed on the substantive final HEAD and a fresh-context L2 review approves completion.
  status: IN_REVIEW
