required_tests:
  unit:
    - TEST-0009
    - "PR #5 bootstrap stdlib regression suite covering REST pagination/cardinality, bounded GraphQL thread pagination, active-head/incarnation-scoped canonical workflow discovery, complete canonical run/job-record validation, protected-job versus workflow conclusion semantics, strict identifier and run-attempt typing, effective/target protected-job validation regardless ID equality, merge-acceptable conclusion semantics, trusted head-identity/current-incarnation run selection, overlapping PR lifetimes, branch-reset history, shared-SHA rerun targeting, workflow trigger completeness and fail-closed malformed data"
