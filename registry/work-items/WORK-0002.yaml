id: WORK-0002
title: "Automate repository governance validation"
status: PLANNED
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
created_at: "2026-09-10"
updated_at: "2026-09-10"

purpose: |
  Turn the governance contracts introduced by WORK-0001 into executable CI checks so repository state cannot silently drift.

scope:
  in:
    - validate YAML/registry structure
    - validate allowed statuses
    - validate unique immutable IDs
    - validate referenced work/capability/dependency IDs
    - validate read_before paths
    - validate PROJECT_STATE active work references
    - validate documentation links where practical
    - validate DONE work-item completion requirements
    - introduce CI workflow and tests for the validator
  out:
    - product implementation
    - full language/toolchain CI for future application code

acceptance_criteria:
  - id: AC-1
    description: "Invalid registry/status/reference/path state fails CI with actionable diagnostics."
    status: NOT_STARTED
  - id: AC-2
    description: "Governance validator itself has 100% meaningful line and branch coverage."
    status: NOT_STARTED
  - id: AC-3
    description: "CI executes on pull requests and protects against regressions in canonical repository state."
    status: NOT_STARTED

