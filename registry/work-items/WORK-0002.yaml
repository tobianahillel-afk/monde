discoveries:
  - "100 percent coverage did not prevent missing governance properties; review, mutation and transition checks are separately required."
  - "GitHub live state can invalidate stale PROJECT_STATE prose after it is committed."
  - "Test/review definitions must be separated from SHA-bound execution evidence."
  - "Meta-governance authorization must bind the changed sensitive path to the active work item, not merely observe an unrelated A3/A4 record."
  - "Security scanning must account for reachable PR commit history until squash-only merge is enforced."
  - "Cross-branch work mirrors must not place branch-only files, schemas or proof-record IDs into locally traversable fields; the checkout boundary must be explicit before those prerequisites/evidence records become mandatory."
  - "A scheduled workflow cannot establish a pre-merge invariant from a PR branch because GitHub schedules execute trusted default-branch workflow state; a predecessor bridge must exist on main first."
  - "A polling bridge must query the canonical workflow directly; repository-wide scheduled-run accumulation can otherwise exhaust bounded pagination and disable the bridge."
  - "Mock-only tests are insufficient for foundational GitHub automation; a safe read-only contract probe is required alongside full local coverage."
blockers:
  - "PR #5 must pass another fresh exact-head independent review after this state synchronization before the bootstrap may merge to main."
  - "After PR #5 merges, PR #2 must integrate the new main and prove the bootstrap is base-preexisting before T12 can be author-side complete."
  - "WORK-0002 final closure still requires an eligible trusted non-author exact-head L2/L3 APPROVED review; the Codex connector has no collaborator write permission and cannot satisfy that live-gate requirement."
