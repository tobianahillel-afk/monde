id: WORK-0002
title: "Automate repository governance validation"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-16"

purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "PR #5 is the narrow trusted-default-branch T12 predecessor. Historical detail remains immutable in prior WORK-0002 commits and REVIEW-0031..0042. The current candidate corrects REVIEW-0042 same-head/late-open P1s with refs/pull/<N>/merge per-PR run authority, late stable-open revalidation and a 60-call invocation budget. REVIEW-0043 OPEN passed exact-head proof and is now IN_PROGRESS."

scope:
  in:
    - deterministic repository-governance validation and traceability
    - GitHub control-plane exact merge-check and review-thread gating
    - trusted default-branch stale-green bootstrap required before PR #2 closure
    - stable unique open Pull Requests authority snapshots
    - stale-green classification before rerun-target discovery
    - fresh stable open-authority revalidation before target selection/rerun
    - canonical PR-family triggering-PR authority from exactly one reusable-workflow `refs/pull/<N>/merge` reference
    - no trust in dynamic `workflow_run.pull_requests` cardinality as event-time provenance
    - same-repository/ref/SHA PR separation by PR number
    - stable partitioned Actions history below GitHub filtered-search caps
    - strict run/job/current-attempt/identifier validation and protected target-job validation
    - fail-closed REST/GraphQL/Checks/Actions metadata and bounded pagination
    - one invocation-wide request counter covering adapter-mediated REST, GraphQL and rerun POST calls
    - maximum 60 script-issued GitHub API calls per invocation; 61st blocked before network I/O; used/60 logged
    - ten-minute schedule, five-minute job timeout and maximum 360 scheduled script calls/hour
    - least-privilege live read-only probe and actions:write only on trusted scheduled path
    - exact-head line/branch coverage, real GitHub probe and review lifecycle proof
    - stable REQ-0026 -> WORK-0002 -> TEST-0009 -> REVIEW evidence chain through REVIEW-0043
  out:
    - MONDE product implementation
    - product-language CI not yet selected
    - semantic duplicate detection requiring AI reasoning
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

