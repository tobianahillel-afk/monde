  - 'REVIEW-0030/F-2 / R2: recompute REQUIREMENT_NORMATIVE_V1 from the canonical RFC 8785/JCS projection before acceptance.'
  - 'REVIEW-0030/F-3 / R2: bind repository-owner authority evidence to the governed MONDE repository and independently established actor.'
  - 'REVIEW-0030/F-4 / R2: imported COMPLETE reviews are ineligible for completion until import_commit and one-shot authorization consumption are bound.'
  - 'REVIEW-0030/F-5 / R2: PASS TEST execution revisions must exist and belong to relevant Git ancestry.'
