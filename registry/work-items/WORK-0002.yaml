discoveries:
  - "100 percent coverage did not prevent missing governance properties; review, mutation and transition checks are separately required."
  - "GitHub live state can invalidate stale PROJECT_STATE prose after it is committed."
  - "Test/review definitions must be separated from SHA-bound execution evidence."
  - "Cross-branch work mirrors must not place branch-only proof records into locally traversable fields unless those records are materialized in the same mirror."
  - "A scheduled workflow cannot establish a pre-merge invariant from a PR branch because GitHub schedules execute trusted default-branch workflow state; a predecessor bridge must exist on main first."
  - "Scoping to the canonical workflow is necessary but not sufficient for lifetime boundedness; active head SHA and active-incarnation time bounds prevent unrelated historical accumulation from exhausting the poll."
  - "Actions total_count/cardinality is part of the fail-closed collection contract; short-page length alone cannot prove completeness."
  - "Mock-only tests are insufficient for foundational GitHub automation; a safe read-only contract probe is required alongside full local coverage."
  - "workflow_run.pull_requests is association metadata, not authoritative triggering-PR identity when multiple PRs share a commit."
  - "All canonical PR-family fields and cross-field relations that can affect effective shared-SHA state must be validated before current-PR identity filtering; server-side endpoint filters are not authority."
  - "GitHub required checks treat success, neutral and skipped as merge-acceptable; stale-green invalidation must use GitHub's merge semantics rather than a literal-success predicate."
  - "The aggregate workflow-run conclusion is not branch-protection authority; the protected MONDE / Merge Gate job/check must be inspected and bound to the selected run/head."
  - "Actions Jobs filter=latest is not sufficient authority by itself; workflow and job run_attempt must both be positive non-Boolean integers and match exactly."
  - "Python numeric equality accepts values such as 4.0 == 4; GitHub identifiers used as trust bindings require exact integer type validation."
  - "Equal run IDs do not prove independently selected effective and target records are equivalent; the target protected job remains an independent validation obligation."
  - "When shared-SHA effective state belongs to a different run than the current-incarnation rerun target, the target run's protected gate must also be validated before rerun."
  - "Head repository/ref/SHA plus PR.created_at is insufficient when PR lifetimes overlap; target-run attribution must exclude runs created during the other PR's server-reported lifetime window."
  - "A closed PR's final head SHA is only a snapshot; same-repository/same-branch lifetime overlap remains ambiguous across force-push/reset even when the final SHA differs from the historical run SHA."
  - "A later overlapping duplicate must not invalidate a legitimate run the current PR created before the overlap began; ambiguity filtering is window-based rather than a single coarse cutoff."
  - "GraphQL pageInfo is an API contract on terminal pages too; endCursor presence/type must be validated before accepting resolved state."
  - "Executable test discovery, workflow path triggers and TEST registry routing are three surfaces of one verification contract and must remain synchronized."
  - "Material bootstrap governance behavior is not exempt from atomic REQ identity and TEST/REVIEW traceability."
  - "Review lifecycle changes must be synchronized across REVIEW, WORK and PROJECT_STATE and must themselves trigger exact-head bootstrap proof."
  - "PR #2's canonical thread_state_poll must port/reuse the bootstrap hardening after trusted-base integration; predecessor proof alone does not make the older durable implementation safe."
