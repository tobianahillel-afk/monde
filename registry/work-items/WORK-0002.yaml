  migrations_or_reprocessing: []
  compatibility_notes: |
    Validators fail closed and do not rewrite canonical state. Historical execution evidence remains historical rather than being relabeled as proof of later SHAs. Review requirements are substantive; adding completed-review evidence is administrative. Exact integration-provenance entries preserve only verified immutable squash/tree and malformed->repair commit/blob relationships; they do not create generic ancestry or YAML-parsing bypasses. New adoption boundaries must be anchored to immutable predecessor history rather than trusted from the candidate policy itself. One-shot external review binding may set import_commit only from null to the exact first COMPLETE materialization SHA under matching prior preauthorization; subsequent qualification still requires consumed authorization and the field is immutable thereafter. Continuing ACCEPTED requirement/risk revalidation is dependency-driven from exact referenced proof/authority/owning-work/policy paths so later hardening is not retroactively imposed on unrelated historical records. T11 distinguishes exact historical first-status recovery through a tree-equivalent squash from evidence eligibility: the former may establish where a record was actually materialized, while T7/T9 still require explicit eligible review/test IDs before that record can count as acceptance evidence.
