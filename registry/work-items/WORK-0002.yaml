purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "PR #5 remains the narrow trusted-default-branch T12 predecessor. REVIEW-0050 through REVIEW-0065 are terminal negative evidence for successive recovery, multi-check, pagination, pending-lifetime, acknowledgement, snapshot, chronology and mutation-bound cross-object authority defects. REVIEW-0066 now carries a coherent G1 -> exact current PR authority + unresolved threads -> G2 pre-mutation snapshot. Both full Gate proofs must remain merge-acceptable with the exact pending_check_id, the PR must remain exactly open with the pending_authority digest, threads must remain unresolved, and full mutation reserve must remain after G2. Technical candidate a816853357a57f5b09c4504129a4630b82754218 passed Bootstrap #255 / run 35854415761 at 323/323 tests, 2646 statements / 1136 branches, 100 percent line+branch and live PR #2 probe SUCCESS at 7/100 requests. REVIEW-0066 is OPEN pending its state-only checkpoint proof. All 65 inline material threads remain unresolved; T4/T12/AC-6 remain IN_REVIEW."

scope:
  in:
    - deterministic repository-governance validation and traceability
    - GitHub control-plane exact merge-check and review-thread gating
    - trusted default-branch stale-green bootstrap required before PR #2 closure
    - exact latest GitHub Actions-owned MONDE / Merge Gate check as merge-state authority
    - current-PR rerun authority bound to exact head/base/merge-ref identity
    - bounded drift-detecting target discovery and durable scheduler continuation
    - exact positive non-Boolean GitHub identifiers and closed-world metadata
    - durable write-ahead pending mutation identity before rerun POST
    - pending authority surviving origin-PR closure until terminal head-scoped effect is accounted for
    - no automatic replay while mutation outcome is ambiguous
    - operator recovery that never erases pending authority from non-atomic observations
    - seven-head bound, three actual rerun POST cap and 100-request hard cap/reserves
    - least-privilege real GitHub contract probing and exact-head 100 percent line/branch proof
  out:
    - MONDE product implementation
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

