    - "current-incarnation target selection excludes pre-current runs and runs created during same-repository/same-branch overlap windows even when the closed PR final SHA changed before close"
    - "closed-PR history stops only after ordered history is older than the earliest active incarnation and fails closed if the relevant window itself exhausts its page bound"
    - "one poll reuses one exact check lookup per SHA and one target-job validation per run/attempt"
