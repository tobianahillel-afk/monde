id: WORK-0002
title: "Automate repository governance validation"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-10"

purpose: |
  Turn the governance contracts introduced by WORK-0001 into executable CI checks so repository state,
  specifications, traceability and review evidence cannot silently drift.

scope:
  in:
    - deterministic repository governance validator
    - validate YAML registry structure
    - validate allowed statuses
    - validate unique stable IDs across WORK/CAP/REQ/ASM/RISK/REVIEW/TEST/EXP records
    - validate cross-record references
    - validate read_before and affected path references
    - validate work dependencies, task/run references and dependency cycles
    - validate PROJECT_STATE active work references
    - validate progress matrix status consistency
    - validate DONE work-item completion gates
    - validate overdue assumption/risk review dates
    - validate canonical Markdown placeholders and relative links
    - reject declared and Markdown paths that escape repository root
    - GitHub Actions execution on pull requests and development branches
    - 100 percent meaningful line and branch coverage for governance code
    - real-repository CI validation and actionable diagnostics
  out:
    - MONDE product implementation
    - language/toolchain CI for future product code
    - AI-based semantic-equivalence detection
    - branch protection and required-check configuration owned by WORK-0003
    - final architecture fitness functions that require product code to exist
    - hash-locked Python artifact generation
    - exhaustive JSON Schema validation of every future registry field

acceptance_criteria:
  - {id: AC-1, description: "Invalid registry/status/reference/path state fails CI with actionable diagnostics.", status: DONE}
  - {id: AC-2, description: "Governance code has 100% meaningful line and branch coverage.", status: DONE}
  - {id: AC-3, description: "CI executes on pull requests and validates the actual repository.", status: DONE}
  - {id: AC-4, description: "Critical work-item completion, dependency and project-state defects are detectable automatically.", status: DONE}
  - {id: AC-5, description: "Documentation, time-based assumption/risk, progress and repository-boundary defects are checked automatically.", status: DONE}
  - {id: AC-6, description: "Validation evidence, security/performance/reuse/traceability review and handover are recorded before merge.", status: IN_REVIEW}

requirements: []
assumptions: []
risks: []

assurance:
  level: A3
  rationale: "This validator becomes a repository-wide hard gate and can block or falsely permit all future work."
  escalation_triggers:
    - "changes to DONE semantics"
    - "changes to canonical status or ID rules"
    - "changes that execute untrusted repository content"

read_before:
  - AGENTS.md
  - docs/00_START_HERE.md
  - docs/03_ARCHITECTURE/documentation-architecture.md
  - docs/09_GOVERNANCE/development-rules.md
  - docs/09_GOVERNANCE/threat-modeling.md
  - docs/10_ROADMAP/development-process.md
  - docs/13_QUALITY/definition-of-ready.md
  - docs/13_QUALITY/definition-of-done.md
  - docs/13_QUALITY/testing-strategy.md
  - docs/13_QUALITY/specification-quality.md
  - docs/13_QUALITY/review-council.md
  - docs/13_QUALITY/advanced-verification.md
  - registry/README.md
  - registry/work-items/_TEMPLATE.yaml
  - registry/capabilities/_TEMPLATE.yaml
  - registry/requirements/_TEMPLATE.yaml
  - registry/assumptions/_TEMPLATE.yaml
  - registry/risks/_TEMPLATE.yaml
  - registry/reviews/_TEMPLATE.yaml
  - registry/tests/_TEMPLATE.yaml
  - registry/experiments/_TEMPLATE.yaml
  - registry/traceability/README.md
  - registry/progress/matrix.yaml

depends_on: [WORK-0001]
blocks:
  - "reliable automated governance for all later specification and implementation PRs"
reuses:
  - "status vocabulary"
  - "work-item registry contract"
  - "capability registry contract"
  - "requirement/assumption/risk/review/test/experiment contracts"
  - "traceability contract"
affected_capabilities: []
affected_engines: []
affected_schemas: []
affected_docs:
  - PROJECT_STATE.md
  - registry/progress/matrix.yaml
contracts:
  - "repository governance validation"
  - "CI quality gate"
adrs: []

impact_analysis:
  blast_radius: CROSS_COMPONENT
  upstream: [WORK-0001]
  downstream:
    - WORK-0003
    - WORK-0004
    - "all future PR governance checks"
  migrations_or_reprocessing: []
  compatibility_notes: "Validators report failures only; they never rewrite canonical repository state."

implementation_plan:
  tasks:
    - {id: T1, description: "Define deterministic validator rules and execution boundaries.", depends_on: [], expected_files: [tools/governance/validate_repo.py], status: DONE}
    - {id: T2, description: "Implement registry, path, dependency, progress, project-state and Markdown validation.", depends_on: [T1], expected_files: [tools/governance/validate_repo.py], status: DONE}
    - {id: T3, description: "Build meaningful unit/integration fixtures and reach 100% line/branch coverage.", depends_on: [T2], expected_files: [tests/governance/test_validate_repo.py, tests/governance/test_path_safety.py, pyproject.toml], status: DONE}
    - {id: T4, description: "Add minimal-permission, immutable-action, exact-dependency GitHub Actions workflow.", depends_on: [T2, T3], expected_files: [.github/workflows/governance.yml, requirements/governance-ci.txt], status: DONE}
    - {id: T5, description: "Execute governance suite on actual repository through PR CI and resolve true/false positives.", depends_on: [T4], expected_files: [], status: DONE}
    - {id: T6, description: "Synchronize TEST/REVIEW evidence, security/performance review, state and handover for merge.", depends_on: [T5], expected_files: [registry/tests/TEST-0002.yaml, registry/tests/TEST-0003.yaml, registry/reviews/REVIEW-0002.yaml, PROJECT_STATE.md, registry/progress/matrix.yaml], status: IN_REVIEW}
  planned_runs:
    - {id: RUN-1, objective: "Implement deterministic validator and prove local test strength", tasks: [T1, T2, T3, T4], exit_condition: "Governance code/workflow exist with 100% line/branch coverage", status: DONE}
    - {id: RUN-2, objective: "Validate on real GitHub repository, harden security and complete review/handover", tasks: [T5, T6], exit_condition: "Final-head CI green and fresh-context L2 review completed", status: IN_REVIEW}

review_plan:
  artifact_class: GOVERNANCE_AUTOMATION
  independence_level: L2_TARGET
  required_hats:
    - ARCHITECTURE_REUSE
    - VERIFICATION_VALIDATION
    - SECURITY
    - PERFORMANCE_SRE
    - DOCUMENTATION_TRACEABILITY
    - RED_TEAM_SKEPTIC
  completed_reviews:
    - REVIEW-0002
  open_findings:
    - "REVIEW-0002 requires fresh-context L2 review before final completion claim"
    - "Hash-locked Python artifacts are a tracked supply-chain hardening follow-up"
    - "Formal JSON Schema depth is a tracked future hardening item"

required_tests:
