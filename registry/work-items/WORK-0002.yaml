id: WORK-0002
title: "Automate repository governance validation"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-16"

purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "PR #5 is the narrow trusted-default-branch T12 predecessor. REVIEW-0049 is now terminal COMPLETE/CHANGES_REQUIRED independent negative evidence on c8f1fec24358c25224771a15b647d56c8a2f0287 via PRR_kwDOUUI5ts8AAAABN4sxvg, with independent P1s PRRT_kwDOUUI5ts6jEPa- and PRRT_kwDOUUI5ts6jEPa_. REVIEW-0050 addresses both: V5 keeps reversible pending-head authority across origin-PR closure and reclassifies same-head siblings after terminal green; the recovery successor makes unresolved pre-POST write-ahead ambiguity loud and provides only an exact-tuple, operator-confirmed, serialized, no-actions:write break-glass clear path. Exact candidate cbe21fa4cebc1c8f8b3030af17284de5700f9818 passed Bootstrap #154 / run 35152847816 with 194/194 tests, 1856 statements / 842 branches, 100 percent line+branch and live read-only PR #2 probe SUCCESS. All 65 inline material threads remain unresolved; T4/T12/AC-6 remain IN_REVIEW."

scope:
  in:
    - deterministic repository-governance validation and traceability
    - GitHub control-plane exact merge-check and review-thread gating
    - trusted default-branch stale-green bootstrap required before PR #2 closure
    - stable unique open Pull Requests authority snapshots
    - exact latest GitHub Actions-owned MONDE / Merge Gate check as merge-state authority
    - canonical current-PR rerun authority from refs/pull/<N>/merge plus current merge-ref SHA and current head/base identity
    - bounded selected-PR target discovery with durable scan_pr/scan_page/scan_anchor continuation and drift restart
    - same-invocation page-boundary verification so offset pagination cannot silently skip a retained target
    - exact positive non-Boolean run/workflow/job/attempt/scheduler-issue/pending-PR/recovery identifiers
    - no trust in dynamic workflow_run.pull_requests as event-time provenance
    - no exhaustive Actions-history reconstruction on the mutation path
    - durable machine-managed scheduler cursor in issue #7 and serialized trusted writers
    - at most seven head groups considered and three actual rerun POSTs per invocation
    - current PR authority revalidation immediately before mutation and before post-condition acceptance
    - exact mutation baseline and single-next-attempt attribution around rerun POSTs
    - terminal protected-job plus effective exact-head check causal binding before invalidation is accepted
    - durable retention of a PR/head when post-condition observation is deferred or a completed rerun is already stale-green again
    - durable write-ahead pending-mutation identity before rerun POST, sufficient to resume observation without issuing a duplicate POST
    - pending mutation authority survives origin-PR closure until the exact external mutation effect is terminally accounted for
    - terminal merge-acceptable closed-origin pending results reclassify current open same-head PRs before scheduler progress can forget the mutation
    - ambiguous rerun POST outcomes remain pending and fail closed instead of automatic replay
    - bounded ambiguous pending observation is loud and retains state rather than silently succeeding
    - trusted break-glass recovery is exact-tuple bound, operator-confirmed, auditable, serialized and has no actions:write capability
    - recovery revalidates unchanged baseline attempt, prior effective-check identity and current same-head authority before clearing an operator-confirmed unposted intent
    - invocation-wide hard 100-call GitHub request counter with mutation/post-condition/state-write reserves
    - fail-closed REST/GraphQL/Checks/Actions/Issue/PR/recovery metadata and bounded pagination
    - least-privilege live read-only probe; actions:write only on trusted scheduled invalidation, issues:write on scheduled/recovery trusted paths
    - exact-head line/branch coverage, real GitHub probe and review lifecycle proof
  out:
    - MONDE product implementation
    - product-language CI not yet selected
    - semantic duplicate detection requiring AI reasoning
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

