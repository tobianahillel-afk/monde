purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "PR #5 is the narrow trusted-default-branch T12 predecessor. REVIEW-0047 is terminal COMPLETE/CHANGES_REQUIRED on d266d73c15b524413209be16d4970ec42928ea04. REVIEW-0048 reached frozen exact HEAD b5932be9a5f2d36c192bf482a3051a8523b97a34 with Bootstrap #137 green, but the Codex code-review invocation was refused by quota and no independent L2 ran. Author-side adversarial review PRR_kwDOUUI5ts8AAAABN4OKew found a P1: scheduler V3 does not durably persist an already-issued rerun identity across DeferredObservation, allowing a duplicate rerun if Actions/Checks visibility still exposes the prior completed attempt on the next schedule. REVIEW-0048 is therefore CLOSED/CHANGES_REQUIRED administrative negative evidence. All 63 inline material threads remain unresolved; T4/T12/AC-6 remain IN_REVIEW."

scope:
  in:
    - deterministic repository-governance validation and traceability
    - GitHub control-plane exact merge-check and review-thread gating
    - trusted default-branch stale-green bootstrap required before PR #2 closure
    - stable unique open Pull Requests authority snapshots
    - exact latest GitHub Actions-owned MONDE / Merge Gate check as merge-state authority
    - canonical current-PR rerun authority from refs/pull/<N>/merge plus current merge-ref SHA and current head/base identity
    - bounded selected-PR target discovery with durable scan_pr/scan_page/scan_anchor continuation and drift restart
    - same-invocation page-boundary verification so offset pagination cannot silently skip a retained target
    - exact positive non-Boolean run/workflow/job/attempt/scheduler-issue identifiers
    - no trust in dynamic workflow_run.pull_requests as event-time provenance
    - no exhaustive Actions-history reconstruction on the mutation path
    - durable machine-managed scheduler cursor in issue #7 and serialized trusted writers
    - at most seven head groups considered and three actual rerun POSTs per invocation
    - current PR authority revalidation immediately before mutation and before post-condition acceptance
    - exact mutation baseline and single-next-attempt attribution around rerun POSTs
    - terminal protected-job plus effective exact-head check causal binding before invalidation is accepted
    - durable retention of a PR/head when post-condition observation is deferred or a completed rerun is already stale-green again
    - durable pending-mutation identity sufficient to resume observation after an accepted rerun POST without issuing a duplicate POST
    - invocation-wide hard 100-call GitHub request counter with mutation/post-condition/state reserves
    - fail-closed REST/GraphQL/Checks/Actions/Issue metadata and bounded pagination
    - least-privilege live read-only probe; actions:write/issues:write only on trusted scheduled path
    - exact-head line/branch coverage, real GitHub probe and review lifecycle proof
  out:
    - MONDE product implementation
    - product-language CI not yet selected
    - semantic duplicate detection requiring AI reasoning
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

