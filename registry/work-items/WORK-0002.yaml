id: WORK-0002
title: "Automate repository governance validation"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-16"

purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "PR #5 is the narrow trusted-default-branch T12 predecessor. REVIEW-0045 independently reviewed exact frozen HEAD adbc68fb47af26b78edd6a1bd02893c000c3c639 and returned five new P1 findings despite green exact-head proofs. REVIEW-0045 is therefore terminal COMPLETE/CHANGES_REQUIRED. The new findings require terminal post-rerun check observation, a complete bounded selected-PR target strategy beyond twelve checks, base identity binding, actual mutation-point enforcement of the three-rerun cap, and serialized/versioned issue #7 cursor updates. All 54 inline material threads remain unresolved."

scope:
  in:
    - deterministic repository-governance validation and traceability
    - GitHub control-plane exact merge-check and review-thread gating
    - trusted default-branch stale-green bootstrap required before PR #2 closure
    - stable unique open Pull Requests authority snapshots
    - exact latest GitHub Actions-owned MONDE / Merge Gate check as merge-state authority
    - canonical PR-family triggering authority from exactly one reusable-workflow refs/pull/<N>/merge reference
    - bounded exact-head check candidates as an index to direct canonical run and protected-job validation, with selected-PR completeness
    - no trust in dynamic workflow_run.pull_requests as event-time provenance
    - no exhaustive Actions-history reconstruction on mutation path
    - durable machine-managed scheduler cursor in issue #7 rather than wall-clock rotation
    - serialization or versioned compare-and-set semantics for scheduler cursor writers
    - at most seven head groups considered and three actual rerun POSTs per invocation
    - selected-PR direct revalidation, including head and base identity, rather than a second global open-PR refresh
    - final current review-thread observation immediately before rerun
    - terminal post-rerun required-check observation before invalidation is accepted
    - shared-head continuation when an earlier sibling becomes clean while another remains unresolved
    - invocation-wide hard GitHub request counter with explicit mutation/post-condition/state reserves
    - fail-closed REST/GraphQL/Checks/Actions/Issue metadata and bounded pagination
    - least-privilege live read-only probe; actions:write/issues:write only on trusted scheduled path
    - exact-head line/branch coverage, real GitHub probe and review lifecycle proof
  out:
    - MONDE product implementation
    - product-language CI not yet selected
    - semantic duplicate detection requiring AI reasoning
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

