implementation_plan:
  tasks:
    - id: T1
      description: "Define deterministic validator rules and execution boundaries."
      depends_on: []
      expected_files: [tools/governance/validate_repo.py]
      status: DONE
    - id: T2
      description: "Implement registry, path, dependency, progress, project-state and Markdown validation."
      depends_on: [T1]
      expected_files: [tools/governance/validate_repo.py]
      status: DONE
    - id: T3
      description: "Build meaningful unit/integration fixtures and reach 100% line/branch coverage."
      depends_on: [T2]
      expected_files: [tests/governance/test_validate_repo.py, pyproject.toml]
      status: DONE
    - id: T4
      description: "Add minimal-permission GitHub Actions workflow."
      depends_on: [T2, T3]
      expected_files: [.github/workflows/governance.yml]
      status: DONE
    - id: T5
      description: "Execute validator on actual repository through PR CI and resolve true/false positives."
      depends_on: [T4]
      expected_files: []
      status: DONE
    - id: T6
      description: "Synchronize TEST/REVIEW evidence, security/performance review, state and handover for merge."
      depends_on: [T5]
      expected_files: [registry/tests/TEST-0002.yaml, registry/tests/TEST-0003.yaml, registry/reviews/REVIEW-0002.yaml, PROJECT_STATE.md, registry/progress/matrix.yaml]
      status: IN_PROGRESS
  planned_runs:
    - id: RUN-1
      objective: "Implement deterministic validator and prove local test strength"
      tasks: [T1, T2, T3, T4]
      exit_condition: "Validator code and workflow exist with 100% local line/branch coverage"
      status: DONE
    - id: RUN-2
      objective: "Validate on real GitHub repository and complete review/handover"
      tasks: [T5, T6]
      exit_condition: "PR CI is green and review/evidence/state are complete"
      status: IN_PROGRESS

