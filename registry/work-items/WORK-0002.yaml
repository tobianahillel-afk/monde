id: WORK-0002
title: "Automate repository governance validation"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-16"

purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "Owner explicitly requested P0-P2 hardening after real runs and repeated adversarial review exposed missing review, progress, scope, GitHub-state, commit-history, meta-governance and control-plane guarantees. PR #5 remains the narrow T12 trusted-default-branch predecessor required before PR #2 can safely close. The bootstrap has hardened canonical workflow/check authority, stale-green-first target discovery, current-incarnation attribution, filtered-search server-cap handling, stable unique Actions snapshots, stable unique Pull Requests authority snapshots, bounded closed-PR history, protected-job/current-attempt authority, strict identifier typing, shared-SHA and branch-reset behavior, regression discovery and durable REQ/TEST/REVIEW traceability. REVIEW-0042 proved that shared-head per-PR authority, late open-authority revalidation and quantitative API-budget closure still require correction."

scope:
  in:
    - deterministic registry/status/reference/path validation
    - JSON Schema validation for registry records
    - reverse progress-matrix membership and DONE-dimension validation
    - review-evidence status/outcome/hat/independence/blocking-finding validation
    - hierarchical L0/L1/L2/L3 review-independence enforcement
    - canonical Review Council outcome vocabulary with bounded legacy compatibility
    - work dependency, task/run and cycle validation
    - PROJECT_STATE active-work validation
    - assumption/risk due-date validation
    - Markdown title/path parsing and repository path containment
    - immutable GitHub Action and Docker-action pin validation
    - high-confidence committed-secret pattern detection at HEAD and across the PR commit range
    - base-to-head and per-commit transition validation over the union of paths touched in the commit sequence
    - immutable registry IDs and published-record deletion guard
    - post-READY semantic scope-drift guard
    - review-freshness guard after substantive changes, including review requirements themselves
    - meta-governance path binding to an active changed A3/A4 work item through affected_paths
    - AI context-manifest generation
    - GitHub live HEAD/mergeability/review-thread gate
    - hash-locked governance Python toolchain
    - reusable GitHub Actions governance core, Dependency Review and CodeQL lanes
    - CI artifacts and stable MONDE merge gate
    - trusted default-branch stale-green bootstrap polling required before PR #2 merge eligibility
    - non-destructive live GitHub contract validation for the bootstrap bridge against PR #2, its actual consumer
    - effective merge state is read directly from the exact latest GitHub Actions-owned MONDE / Merge Gate check for the exact SHA
    - exact required-check state and unresolved review-thread state are positively classified before any current-incarnation rerun-target history is sampled
    - clean, incomplete and non-merge-acceptable PRs do not trigger target-history or closed-history discovery
    - canonical MONDE Gate workflow-run history is used only to discover the current-incarnation rerun target explicitly allowed for a positively proven stale-green PR
    - bootstrap run binding uses GitHub-server head repository/ref/SHA rather than workflow_run.pull_requests association cardinality
    - complete fail-closed validation of every canonical PR-family run record used for rerun targeting, including status=completed, structured owner/repo identity and timezone-aware created_at/updated_at with updated_at >= created_at
    - filtered workflow-run searches split into closed non-overlapping second ranges whenever GitHub's 1000-result filtered-search ceiling is reached; a saturated single timestamp second fails closed
    - filtered workflow-run windows are accepted only with exact unique run IDs and two identical snapshots; stable total_count alone is insufficient authority
    - Actions workflow-runs and Jobs envelope total_count is a typed authoritative cardinality contract; pagination rejects malformed, inconsistent, over-count, incomplete-short and duplicate-identity collections
    - open Pull Requests authority is accepted only after two identical canonical authority-field snapshots with unique exact positive PR numbers
    - bounded closed Pull Requests history authority is accepted only after two identical canonical authority-field snapshots with unique exact positive PR numbers
    - Pull Requests snapshot fingerprints bind PR number, state, repository/ref/SHA and created_at, plus closed_at/updated_at for closed history
    - the Pull Requests snapshot adapter is the executable entrypoint for both live validation and trusted scheduled mutation paths
    - effective exact protected-check state is read through Checks API; selected current-incarnation rerun target's protected MONDE / Merge Gate job is independently validated through Actions Jobs API
    - GitHub merge-acceptable required-check conclusions success, neutral and skipped all trigger stale-green review-thread revalidation
    - required-job records fail closed on malformed id/run_id/run_attempt/name/status/conclusion/head_sha; identifiers and attempts are positive exact non-Boolean integers and the protected job is unique per selected run
    - workflow_id and all other numeric trust bindings are exact positive non-Boolean integers rather than relying on Python coercive equality
    - open-PR collection members explicitly report state=open before authority use
    - current PR-incarnation binding uses PR/run creation times plus same-repository/same-branch closed-PR lifetime windows independent of the closed PR's final SHA snapshot
    - closed PR history is ordered by updated desc and bounded to lifetimes capable of overlapping the earliest stale-green active incarnation instead of traversing branch lifetime
    - one-poll caches bind exact required-check state by SHA and protected target-job state by run/attempt
    - scheduled stale-green polling runs every ten minutes while retaining the five-minute job timeout
    - bounded fail-closed REST and GraphQL pagination, including typed endCursor metadata on terminal and continuing pages
    - bootstrap pull-request trigger covers the complete test_stale_green_bootstrap*.py regression family and the PR snapshot adapter
    - TEST-0009 canonically lists all seven bootstrap regression modules
    - stable REQ-0026 -> WORK-0002 -> TEST-0009 / REVIEW-0031 / REVIEW-0032 / REVIEW-0033 / REVIEW-0034 / REVIEW-0035 / REVIEW-0036 / REVIEW-0037 / REVIEW-0038 / REVIEW-0039 / REVIEW-0040 / REVIEW-0041 / REVIEW-0042 traceability for the material bootstrap behavior
    - exact-head bootstrap proof on review lifecycle changes as well as executable/work/project changes
  out:
    - MONDE product implementation
    - product-language CI not yet selected
    - semantic duplicate detection requiring AI reasoning
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

