impact_analysis:
  blast_radius: CROSS_COMPONENT
  upstream: [WORK-0001]
  downstream: [WORK-0003, WORK-0004]
  migrations_or_reprocessing: []
  compatibility_notes: "Validators fail closed and do not rewrite canonical state. Historical execution evidence remains historical rather than being relabeled as proof of later SHAs. Review requirements are substantive; adding completed-review evidence is administrative. This default-branch mirror intentionally carries only globally resolvable WORK-0002 lifecycle/dependency state plus the narrow PR #5 stale-green bootstrap predecessor; the richer T7-T12 implementation, review/test registry graph and PR #2 closure identities remain authoritative only after explicit checkout of feat/work-0002-governance-ci until PR #2 is integrated. Canonical PR-family runs are queried only for active head SHAs from the earliest active PR-incarnation creation bound, then fully validated before selection. Sensitive Actions paginated envelopes require stable typed total_count equality with the observed collection. Merge-acceptable state is classified from the actual protected MONDE / Merge Gate job/check; success/neutral/skipped share one stale-green revalidation contract. Protected-job records are bound to exact positive integer run identifiers and the selected workflow run's positive current run_attempt. Independently selected target runs are protected-job validated even when their run ID equals the effective record's ID. Current target selection also consults PR.created_at/run.created_at and same-repository/same-branch closed-PR lifetime windows without trusting the closed PR final SHA as complete history; workflow_run.pull_requests remains non-authoritative association metadata. REVIEW-0031 through REVIEW-0038 are durable terminal CHANGES_REQUIRED evidence and are never reopened. REVIEW-0039 is OPEN and must not transition to IN_PROGRESS until this synchronized lifecycle checkpoint receives exact-head proof. The bootstrap is temporary; after PR #5 merge, PR #2's older permissive thread_state_poll must port/reuse the hardened contract before T12 can close."

