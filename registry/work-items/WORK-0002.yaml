    - "commit-range high-confidence secret scanning"
    - "bootstrap schedule grants actions:write only to the trusted default-branch poll job"
  performance:
    - "governance core remains bounded by CI timeout"
    - "canonical workflow history is partitioned by active head SHA and active-incarnation lower bounds so lifetime repository history cannot alone exhaust pagination"
    - "each Actions workflow-run/Jobs search remains bounded to 20 pages and must prove complete cardinality through total_count"
    - "bootstrap bounds review-thread GraphQL pagination and rejects cursor cycles"
    - "closed-PR history queries are cached per head owner/branch within each poll"
    - "fresh REVIEW-0039 must evaluate active-head filter completeness, GitHub filtered-search limits and rate/latency impact"
  real_system:
    - TEST-0009
    - "PR #5 Bootstrap GitHub contract probe on exact candidate using read-only live GitHub open/closed-PR, scoped workflow-runs, Actions Jobs and GraphQL APIs against WORK-0002 PR #2"
  epistemic:
    - "execution evidence is bound to GitHub SHA rather than silently promoted across heads"
    - "candidate PR #2 state cannot self-prove a schedule that exists only after merge; the bridge must be preexisting on main"
    - "the protected MONDE / Merge Gate job/check, not aggregate workflow conclusion, is merge-state authority"
    - "collection completeness is established by typed stable total_count equality rather than page length alone"
    - "equal run IDs do not collapse independently selected target metadata or remove the obligation to validate target protected-job state"
    - "all PR-family run/job metadata, strict identifier types, current-attempt relations and merge-acceptable conclusion semantics that may affect effective or target state are validated under one fail-closed contract"
    - "server-reported head repository/ref plus PR lifetime metadata scopes ambiguous history; the closed PR final head SHA is only a snapshot and candidate-produced artifacts/workflow_run.pull_requests association-list cardinality are not authority"

