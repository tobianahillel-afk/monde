id: WORK-0002
title: "Automate repository governance validation"
status: IN_REVIEW
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-16"

purpose: |
  Turn MONDE governance/specification/traceability contracts into executable CI and GitHub control-plane checks so repository state, review evidence, scope and proof cannot silently drift.

scope_change:
  approved: true
  rationale: "PR #5 is the narrow trusted-default-branch T12 predecessor. REVIEW-0047 is now terminal COMPLETE/CHANGES_REQUIRED on exact frozen HEAD d266d73c15b524413209be16d4970ec42928ea04 via independent review PRR_kwDOUUI5ts8AAAABN1lrxA. The exact head was proven by Bootstrap #129 / run 35103667502 after the REVIEW-0047 IN_PROGRESS synchronization; runtime remained 116 tests, 1153 statements, 522 branches, 100% line+branch with the live read-only PR #2 contract probe green. REVIEW-0047 added three P1 findings to the prior 60, leaving 63 unresolved inline material threads. No historical thread has been resolved. A successor correction/review is required before PR #5 can become merge-eligible."

scope:
  in:
    - deterministic repository-governance validation and traceability
    - GitHub control-plane exact merge-check and review-thread gating
    - trusted default-branch stale-green bootstrap required before PR #2 closure
    - stable unique open Pull Requests authority snapshots
    - exact latest GitHub Actions-owned MONDE / Merge Gate check as merge-state authority
    - canonical PR-family triggering authority from exactly one reusable-workflow refs/pull/<N>/merge reference plus its current merge-ref SHA
    - bounded selected-PR rerun-target discovery with durable scan_pr/scan_page/scan_anchor continuation and drift restart
    - direct canonical run, protected current-attempt job and scheduler-issue validation with exact positive non-Boolean integer identifiers
    - no trust in dynamic workflow_run.pull_requests as event-time provenance
    - no exhaustive Actions-history reconstruction on mutation path
    - durable machine-managed scheduler cursor in issue #7 rather than wall-clock rotation
    - serialized scheduler cursor writers through a dedicated trusted GitHub Actions concurrency group
    - at most seven head groups considered and three actual rerun POSTs per invocation
    - selected-PR direct revalidation including head/base/merge context rather than a second global open-PR refresh
    - current PR authority revalidation immediately before rerun mutation and again before post-condition acceptance
    - final current review-thread observation immediately before rerun
    - delayed rerun selection persisted across scheduler invocations until a causal terminal post-condition is established
    - exact-run new-attempt terminal post-condition plus protected-job and effective exact-head check causal binding before invalidation is accepted
    - shared-head continuation when an earlier sibling becomes clean while another remains unresolved
    - invocation-wide hard 100-call GitHub request counter with explicit mutation/post-condition/state reserves
    - fail-closed REST/GraphQL/Checks/Actions/Issue metadata and bounded pagination
    - least-privilege live read-only probe; actions:write/issues:write only on trusted scheduled path
    - exact-head line/branch coverage, real GitHub probe and review lifecycle proof
  out:
    - MONDE product implementation
    - product-language CI not yet selected
    - semantic duplicate detection requiring AI reasoning
    - branch/ruleset/visibility administration owned by WORK-0003
    - product architecture fitness functions requiring product code

