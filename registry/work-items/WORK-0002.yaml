id: WORK-0002
title: "Automate repository governance validation"
status: IN_PROGRESS
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.2
owner: "repository governance"
created_at: "2026-09-10"
updated_at: "2026-09-10"

purpose: |
  Turn the governance contracts introduced by WORK-0001 into executable CI checks so repository state,
  specifications, traceability and review evidence cannot silently drift.

scope:
  in:
    - deterministic repository governance validator
    - validate YAML registry structure
    - validate allowed statuses
    - validate unique stable IDs across WORK/CAP/REQ/ASM/RISK/REVIEW/TEST/EXP records
    - validate cross-record references
    - validate read_before and affected path references
    - validate work dependencies, task/run references and dependency cycles
    - validate PROJECT_STATE active work references
    - validate progress matrix status consistency
    - validate DONE work-item completion gates
    - validate overdue assumption/risk review dates
    - validate canonical Markdown placeholders and relative links
    - GitHub Actions execution on pull requests and development branches
    - 100 percent meaningful line and branch coverage for validator code
    - real-repository CI validation and actionable diagnostics
  out:
    - MONDE product implementation
    - language/toolchain CI for future product code
    - AI-based semantic-equivalence detection
    - branch protection and required-check configuration owned by WORK-0003
    - final architecture fitness functions that require product code to exist

acceptance_criteria:
  - id: AC-1
    description: "Invalid registry/status/reference/path state fails CI with actionable diagnostics."
    status: DONE
  - id: AC-2
    description: "Governance validator itself has 100% meaningful line and branch coverage."
    status: DONE
  - id: AC-3
    description: "CI executes on pull requests and validates the actual repository."
    status: DONE
  - id: AC-4
    description: "Critical work-item completion, dependency and project-state defects are detectable automatically."
    status: DONE
  - id: AC-5
    description: "Documentation, time-based assumption/risk and progress consistency defects are checked automatically."
    status: DONE
  - id: AC-6
    description: "Validation evidence, review, security/performance assessment and handover are recorded before merge."
    status: IN_PROGRESS

