discoveries:
- 100 percent coverage did not prevent missing governance properties; review, mutation and transition checks are separately required.
- GitHub live state can invalidate stale PROJECT_STATE prose after it is committed.
- Test/review definitions must be separated from SHA-bound execution evidence.
- Meta-governance authorization must bind the changed sensitive path to the active work item, not merely observe an unrelated A3/A4 record.
- Canonical policy registries that define validators, including integration-provenance exception policy, are themselves meta-governance trust anchors and cannot authorize their own weakening from candidate state.
- Security scanning must account for reachable PR commit history until squash-only merge is enforced; textual patches alone are insufficient because Git may classify a secret-bearing blob as binary.
- Assurance level must impose a minimum review-independence floor rather than trusting a self-declared weaker target.
- Requirement acceptance must use one qualifying review and one qualifying cold-read record that each co-satisfy their full contract; properties cannot be split across unrelated evidence records.
- Acceptance evidence must bind the exact content-identity policy revision as well as the resulting digest, and no intervening policy revision may be hidden by a later byte-for-byte revert or merge-history simplification.
- ACCEPTED requirement/risk records are continuing invariants: same-status edits and later dependency changes must not bypass the original acceptance contract.
- Dependency-driven continuing acceptance is required; globally rejudging every historical ACCEPTED record under later rules is also incorrect because it creates retroactive governance.
- A changed registry record is itself an impact-analysis seed; path-only WORK matching is insufficient.
- Repository-owner authority evidence must bind the actual GitHub repository and independently verify the named actor/permission rather than trust mutable policy-internal agreement.
- Exact-head GitHub approval is necessary but not sufficient; the approver must be trusted, context-separated and bound to qualifying L2 evidence.
- The live merge gate must prove exact-head independent approval and must be rerun when supported review state changes rather than relying on stale success; unsupported review-thread state changes require a trusted bounded polling bridge.
- Canonical YAML must fail closed on duplicate mapping keys; last-key-wins parsing can silently corrupt durable project state.
- A risk cannot enter ACCEPTED when its owning-work assurance cannot be resolved deterministically from canonical scope; ambiguous ownership fails closed.
- Squash merging preserves tree state but destroys direct branch ancestry, so exact source-head/tree/integrated-commit provenance is required for historical SHA-bound test evidence.
- Historical first-status materialization through an exact tree-equivalent squash is distinct from whether that record is eligible as acceptance evidence; evidence allowlists remain a separate fail-closed contract.
- A fail-closed parser must distinguish an exact known malformed historical blob from a deleted file without making malformed YAML generically acceptable.
- Exact-head proof must separate the PR head from GitHub's synthetic merge ref; otherwise base-only history can contaminate ancestry and current-tree claims.
- New fail-closed lifecycle rules need immutable predecessor-bound, non-reusable adoption boundaries so candidate state cannot move the enforcement start point.
- Progress reopening evidence, including top-level WORK-status reopenings, must be scoped to the exact target and must represent a genuinely new trigger rather than reorder/delete/prose churn.
- Squash provenance may bridge historical review/test evidence only for explicit eligible IDs and exact equal-tree source/integrated commits.
- One-shot review import binding and import eligibility are distinct phases: the field may bind once to the exact earlier first-COMPLETE materialization commit under prior authorization, while later evidence use additionally requires consumed authorization.
- Durable closure integrity is an identity-set property: equal counts cannot substitute for exact one-to-one PRRT coverage.
- Effective workflow semantics must be validated from parsed YAML structure rather than textual snippets that comments or formatting can mimic.
