required_tests:
  unit:
  - TEST-0002
  property:
  - valid/invalid status, ID, reference, path, transition, review and progress variants
  integration:
  - TEST-0003
  contract:
  - registry/schema/progress/review/change-control integrity
  e2e:
  - TEST-0003
  regression:
  - initial Codex P1 review-evidence finding
  - initial Codex P1 DONE progress-dimension finding
  - initial Codex P2 reverse matrix membership finding
  - initial Codex P2 Markdown link-title finding
  - L3 independence target cannot be satisfied by L1/L2 evidence
  - canonical APPROVE / APPROVE_WITH_FOLLOWUP outcomes are accepted
  - review requirements are part of review-freshness semantics
  - commit-sequence validation includes paths changed then restored
  - meta-governance changes are bound to affected active A3/A4 work
  - secrets introduced and removed inside the PR remain detectable
  - A3 requires at least L2 review independence and A4 requires L3
  - COMPLETE review evidence cannot omit artifact.commit_sha
  - PASS test records cannot be empty self-declarations
  - NOT_APPLICABLE progress dimensions require work-item justifications
  - changed REQ/REVIEW/TEST/other registry records seed dependency-aware context routing
  - PROJECT_STATE next action is current and transition-stable
  - scope drift and review freshness
  - new non-initial TEST/REVIEW/REQ terminal records fail unless covered by exact historical/import exception
  - PROPOSED to ACCEPTED requirements fail without exact bound independent review and cold-read evidence
  - mutable/short/nonexistent review commit references fail freshness
  - blocking accepted findings fail without canonical authority matrix evidence
  - required-test semantic weakening stales review while execution-only evidence changes remain administrative
  - endpoint scope excludes base-only changes by using merge-base semantics
  - RISK ACCEPTED transitions fail without all canonical acceptance fields, resolvable owning-work assurance and allowed authority evidence
  - requirement acceptance rejects an invented but internally repeated digest by recomputing REQUIREMENT_NORMATIVE_V1 through RFC 8785/JCS
  - repository-owner evidence cannot point at an unrelated GitHub repository
  - externally imported COMPLETE reviews cannot satisfy completion before import/authorization consumption is finalized
  - PASS TEST evidence rejects nonexistent or irrelevant execution commit SHAs
  - CLOSED reviews never contribute completion hats, independence or approval
  - duplicate YAML mapping keys fail parsing instead of silently overwriting earlier canonical state
  - squash-integrated PASS evidence qualifies only through exact source-head/tree/integrated-commit provenance
  - an exact historical malformed YAML blob may suppress only the false delete/recreate interpretation of its one bound repair commit
  - pull-request governance proof checks out the exact requested head SHA
  - completed review approval-bearing fields cannot be administratively rewritten after review
  - accepted-finding evidence resolves the claimed actor/role/scope
  - imported COMPLETE review binding equals the real first COMPLETE materialization commit
  - requirement acceptance rejects an unfinalized externally imported review
  - requirement cold-read evidence rejects nonexistent or irrelevant execution revisions
  - progress transitions/reopenings are enforced from an exact non-reusable adoption boundary
  - squash provenance requires non-reusable flags and explicit eligible review/test IDs
  - DONE work rejects unfinished implementation tasks or planned runs
  - canonical status/authority/content-identity policy registries are protected meta-governance and candidate policy cannot self-authorize its own weakening
  - progress adoption boundaries reject candidate-only movement and remain pinned to immutable predecessor history
  - one requirement review must co-satisfy scope/digest/revision/provenance/import/floor checks
  - one cold-read TEST must co-satisfy requirement revision, qualification, outcomes, provenance, reachability and floor checks
  - requirement acceptance evidence becomes stale when the content-identity policy revision changes even if the digest string remains equal
  - repository-owner evidence is checked against the actual GitHub repository and real permission proof
  - live merge gate rejects resolved threads without eligible independent exact-head approval
  - durable WORK open_findings exactly covers every live material closure thread before completion
  - same-status ACCEPTED requirement edits revalidate canonical acceptance evidence and digest
  - same-status ACCEPTED risk edits revalidate canonical authority/acceptance evidence
  - COMPLETE review checks/completed_at/verification provenance cannot be added or changed after completion
  - content-identity policy change-then-revert between evidence and acceptance still invalidates prior evidence
  - exact-head APPROVED review does not satisfy merge eligibility without trusted L2/context-separated reviewer evidence
  - WORK-status reopening cannot borrow an unrelated WORK finding or scope trigger
  security:
  - immutable action/digest pins
  - hash-locked Python artifacts
  - least-privilege workflow tokens
  - commit-range high-confidence secret scanning
  performance:
  - governance core remains bounded by CI timeout
  real_system:
