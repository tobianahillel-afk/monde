required_tests:
  unit: [TEST-0009]
  property:
    - "exact latest GitHub Actions-owned MONDE / Merge Gate check is merge-state authority"
    - "direct check -> run -> protected-job authority is exact-head, current-attempt, current-base and PR-bound"
    - "selected-PR target discovery remains bounded without permanently omitting a retained target behind a fixed candidate prefix"
    - "durable issue #7 cursor advances independently of wall-clock schedule delivery and cannot regress under overlapping schedule writers"
    - "one invocation considers at most seven head groups and performs at most three actual rerun POSTs"
    - "request-budget accounting reserves enough headroom for target validation, rerun POST, terminal post-condition and cursor write"
    - "current review-thread state is observed immediately before rerun"
    - "post-rerun observation waits for a terminal required-check conclusion before accepting invalidation"
    - "shared-head processing continues when an earlier sibling becomes clean and eventually returns green"
  integration: [TEST-0009]
  contract: ["registry/schema/progress/review/change-control integrity", "bootstrap GitHub Checks/REST/GraphQL/Actions/Issues control-plane contract"]
  e2e: []
  regression:
    - "all 54 PR #5 inline findings remain represented and unresolved during correction"
    - "queued/in-progress successor check later completes success while another same-head sibling remains unresolved"
    - "selected PR target exists outside the twelve newest sibling checks"
    - "PR is retargeted to a different base without changing head SHA"
    - "more than three same-head siblings successively trigger fallthrough attempts"
    - "two schedule executions overlap and attempt conflicting issue #7 cursor updates"
    - "deep Actions history is not traversed on mutation target path"
    - "malformed scheduler issue, check, run, job and PR authority fails closed"
  security: ["immutable pins", "hash-locked Python artifacts", "least privilege", "live probe read-only", "actions:write/issues:write only on trusted scheduled path"]
  performance:
    - "successor remains explicitly request-bounded per invocation"
    - "one invocation considers at most seven head groups and performs at most three rerun POSTs"
    - "live proof is wiring evidence and not a substitute for worst-case capacity regressions"
  real_system: [TEST-0009]
  epistemic:
    - "execution evidence is exact-SHA bound"
    - "workflow_run.pull_requests dynamic associations are not triggering-PR provenance"
    - "canonical reusable-workflow pull ref and base identity must both remain positively bound"

