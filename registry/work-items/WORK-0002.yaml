discoveries:
  - "A completed rerun that is already stale again must retain the selected head instead of being treated as completed processing."
  - "A rerun POST must be attributed to exactly one next attempt; arbitrary attempt jumps are ambiguous under concurrent reruns."
  - "Offset pagination drift must be detected between consecutive pages inside the same invocation, not only across saved continuations."
  - "An accepted rerun must be represented durably while it is not yet externally visible; scan continuation alone cannot prove whether a mutation is already in flight."
  - "Origin-PR closure does not terminate an already-issued external rerun; reversible pending-head authority must survive until its head-scoped terminal effect is accounted for."
  - "Write-ahead safety needs an explicit liveness/escalation contract for the pre-POST crash window; silently retaining a baseline pending forever is not sufficient."
  - "A break-glass recovery path can preserve deny-by-default semantics only when it cannot rerun, requires exact durable authority plus explicit human evidence, revalidates no mutation became visible, and is serialized with the poll."

