    - "review requirements are part of review-freshness semantics"
    - "commit-sequence validation includes paths changed then restored"
    - "meta-governance changes are bound to affected active A3/A4 work"
    - "secrets introduced and removed inside the PR remain detectable"
    - "scope drift and review freshness"
    - "stale-green bootstrap selects only workflow ID 354465551 at .github/workflows/governance.yml"
    - "bootstrap rejects malformed REST/GraphQL entries rather than silently treating them as absence"
    - "bootstrap includes pull_request_review and pull_request_review_comment gate executions"
    - "bootstrap coverage is enforced at 100 percent line and branch"
    - "workflow_run.pull_requests association cardinality is not trusted as triggering-PR identity"
    - "distinct PR branches sharing one commit SHA retain distinct GitHub-server head identities"
    - "duplicate open PR head repository/ref/SHA identity fails closed"
    - "newer shared-SHA merge-acceptable state from another PR causes target PR re-invalidation"
    - "unknown terminal conclusion, non-completed status, Boolean PR number and malformed head metadata fail closed"
    - "malformed or missing created_at on any PR-family run fails closed before current-PR identity filtering, including another branch sharing the same SHA"
    - "updated_at earlier than created_at fails closed before selection"
    - "malformed canonical run repository full_name fails closed before shared-SHA selection"
    - "non-open records from the open-PR endpoint fail closed"
    - "reviewThreads terminal and continuing pages validate typed endCursor metadata; repeated cursor and pagination exhaustion fail closed"
    - "the pull-request workflow path trigger covers the complete test_stale_green_bootstrap*.py family"
    - "TEST-0009 test_path lists every bootstrap regression module including merge-acceptable conclusion coverage"
    - "workflow failure with protected MONDE / Merge Gate neutral or skipped is still classified as merge-acceptable stale green"
    - "required-job missing/duplicate/malformed id/run_id/run_attempt/name/status/conclusion/head_sha fails closed"
    - "workflow run_attempt and every returned job run_attempt are positive non-Boolean integers and must match exactly"
    - "job run_id and other protected identifiers reject Boolean, float and coercible non-integer values"
    - "the target protected job is validated even when effective and target records report the same run ID"
    - "canonical workflow-run queries are scoped per active head SHA and earliest active incarnation time rather than lifetime history"
    - "workflow_runs and jobs pagination rejects missing/malformed/inconsistent total_count, over-count and short incomplete collections"
    - "success, neutral and skipped effective protected required-check conclusions all inspect unresolved threads and rerun the current target"
    - "a run from a prior closed PR incarnation is excluded even if its updated_at becomes newer after rerun"
    - "a run created for another exact same-head PR during a lifetime overlap is excluded even when that other PR later closes"
    - "a historical PR that closes on a different final SHA still creates an ambiguity window for same-repository/same-branch runs produced before a branch reset"
    - "a current run created before a later duplicate PR opens remains eligible rather than being over-rejected"
    - "malformed closed-PR number/state/timestamps/lifetime or head repository metadata fails closed"
    - "any present GraphQL errors value other than an empty list fails closed, including falsey malformed values"
    - "material bootstrap behavior has stable REQ-0026, TEST-0009 and REVIEW-0031/0032/0033/0034/0035/0036/0037/0038/0039 trace identities"
