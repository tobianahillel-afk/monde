impact_analysis:
  blast_radius: CROSS_COMPONENT
  upstream: [WORK-0001]
  downstream: [WORK-0003, WORK-0004]
  migrations_or_reprocessing: []
  compatibility_notes: "Validators fail closed and do not rewrite canonical state. Historical execution evidence remains historical rather than being relabeled as proof of later SHAs. Review requirements are substantive; adding completed-review evidence is administrative. This default-branch mirror intentionally carries only globally resolvable WORK-0002 lifecycle/dependency state plus the narrow PR #5 stale-green bootstrap predecessor; the richer T7-T12 implementation, review/test registry graph and PR #2 closure identities remain authoritative only after explicit checkout of feat/work-0002-governance-ci until PR #2 is integrated. Effective merge state is now read from the exact latest GitHub Actions-owned MONDE / Merge Gate check for the exact SHA. Canonical Actions workflow history is used only to identify a positively bound current-incarnation rerun target. Filtered workflow history is partitioned into stable, unique, closed non-overlapping second windows below GitHub's 1000-result search ceiling and fails closed if one second remains saturated. Closed PR history is bounded by the earliest active incarnation. Sensitive Actions paginated envelopes require typed total_count equality and unique identities. Protected target-job records bind exact positive integer identifiers and current run_attempt. Current target selection also consults PR.created_at/run.created_at and same-repository/same-branch closed-PR lifetime windows without trusting the closed PR final SHA as complete history; workflow_run.pull_requests remains non-authoritative association metadata. Required check/job/cache identities use strict types. The poll caches exact check/job lookups and runs every ten minutes to bound API pressure. REVIEW-0031 through REVIEW-0039 are durable terminal CHANGES_REQUIRED evidence and are never reopened. REVIEW-0040 is IN_PROGRESS in the same Git tree checkpoint as matching WORK-0002 and PROJECT_STATE; the exact synchronized descendant must pass before external review invocation. The bootstrap is temporary; after PR #5 merge, PR #2's older permissive thread_state_poll must port/reuse this positive-authority contract before T12 can close."

