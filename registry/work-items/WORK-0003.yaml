purpose: |
  Configure GitHub repository-level protections so process rules are enforced at the hosting layer as well as documented in the repository.

scope:
  in:
    - decide and configure repository visibility
    - protect main branch
    - require pull requests
    - require selected status checks once available
    - prevent force-push/deletion of main where supported
    - define merge strategy
    - enable applicable secret/dependency/code scanning features
    - document actual repository settings
  out:
    - product implementation
    - organization-wide GitHub administration unrelated to MONDE

