id: WORK-0003
title: "Configure GitHub control-plane protection and merge policy"
status: PLANNED
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.3
created_at: "2026-09-10"
updated_at: "2026-09-10"

purpose: |
  Make GitHub enforce MONDE's repository rules so merge safety no longer depends on agent discipline alone.

scope:
  in:
    - intentionally configure repository visibility
    - protect main and require pull requests
    - require the stable MONDE / Merge Gate on the current HEAD
    - require conversation resolution and prevent force-push/deletion where supported
    - choose one canonical merge strategy, preferring squash
    - enable applicable secret scanning/push protection, dependency and code scanning
    - configure GitHub Actions policy, including immutable SHA requirements where available
    - verify CODEOWNERS/reviewer routing behavior
    - verify Dependabot for GitHub Actions and Python governance dependencies
    - document actual settings and unsupported/account-plan limitations
    - define root-of-trust handling for meta-governance changes
  out:
    - MONDE product implementation
    - unrelated organization-wide GitHub administration
    - deployment environments/OIDC until deployment exists
    - merge queue until concurrency justifies it

acceptance_criteria:
  - {id: AC-1, description: "Repository visibility is intentional and documented before sensitive MONDE inventory work.", status: NOT_STARTED}
  - {id: AC-2, description: "main is PR-only with applicable force-push/deletion/conversation protections.", status: NOT_STARTED}
  - {id: AC-3, description: "The stable MONDE / Merge Gate is required on the exact merge candidate HEAD.", status: NOT_STARTED}
  - {id: AC-4, description: "Applicable GitHub security/supply-chain protections are enabled and verified on the real repository.", status: NOT_STARTED}
  - {id: AC-5, description: "Actual settings, limitations, rollback and owner actions are documented and cold-start resumable.", status: NOT_STARTED}

