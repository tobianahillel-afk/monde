id: WORK-0005
title: "Implement MONDE V2 single interactive writer and read-only ChatGPT L2 delegation"
status: PROPOSED
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.4
owner: "MONDE interactive development operating model"
created_at: "2026-10-10"
updated_at: "2026-10-11"

purpose: |
  Design, implement and independently review one manually triggered ChatGPT
  developer using the connected GitHub repository, with up to four one-shot
  read-only ChatGPT tasks for research and context-separated L2 review.
  Tasks return full reports in their own conversations and never mutate GitHub.
  The earlier four-writer ACTIVE_4/Issue-comment arbiter is superseded research,
  not an implementation or deployment requirement for this V2.

scope:
  in:
    - one user-triggered foreground developer is the only GitHub writer
    - research, architecture, security and tests may be delegated to one to four read-only scheduled ChatGPT tasks only when beneficial
    - review assignments contain mission ID, repository, PR, exact SHA, source paths, objectives and author context
    - separate-context reviewers return full reports in ChatGPT, never GitHub comments
    - foreground retrieves available task reports using conversation history and explicitly verifies their provenance and exact SHA
    - inaccessible reports are REPORT_UNAVAILABLE and execution alone is not evidence
    - independent L2 technical review is not a distinct GitHub actor or native APPROVED review
    - batch coherent code changes and focused tests, then trusted exact-HEAD CI at promotion boundaries
    - reuse existing Accepted MONDE lifecycle, registry, tests, reviews and branch protections
    - work solely through ChatGPT and connected GitHub with GitHub-hosted CI
    - maintain a safe resumed-state handoff for user-triggered subsequent interactive sessions
    - retain legacy engineering research as superseded historical analysis
  out:
    - four autonomous Scheduled task development writers
    - issue-comment write-grant dispatcher or ACTIVE_4 deployment
    - scheduled tasks editing code, issues, comments, PRs, refs or GitHub settings
    - unattended merges, code promotion or task-to-task self-approval
    - external paid AI, Codex, desktop computer, persistent service or new database
    - weakening Accepted governance, WORK-0002/3 review and integration rules
    - implementation of unrelated MONDE product or WRE functionality

acceptance_criteria:
  - id: AC-1
    description: "Only the manually triggered foreground chat can write to GitHub; Scheduled tasks are explicitly read-only."
    status: NOT_STARTED
  - id: AC-2
    description: "One through four bounded read-only assignments are uniquely identified, scope-checked and tied to an exact PR SHA."
    status: NOT_STARTED
  - id: AC-3
    description: "Research/L2 task prompts prohibit GitHub mutation and request complete source-backed reports in the separate ChatGPT answer."
    status: NOT_STARTED
  - id: AC-4
    description: "Available reports are matched to mission, repository, PR, SHA, source context and actual retrieved message before qualification."
    status: NOT_STARTED
  - id: AC-5
    description: "Missing, unverifiable, malformed, out-of-scope and stale reports never become automatic L2 approval."
    status: NOT_STARTED
  - id: AC-6
    description: "Technical L2 and native GitHub approval remain separate authorities with no same-account bypass."
    status: NOT_STARTED
  - id: AC-7
    description: "Pure helper code cannot schedule tasks, call GitHub mutation APIs, grant product write permissions or auto-merge."
    status: NOT_STARTED
  - id: AC-8
    description: "Unprivileged GitHub Actions checks the candidate exact HEAD, runs relevant unit and security tests, and verifies independent review only when externally evidenced."
    status: NOT_STARTED
  - id: AC-9
    description: "An independent ChatGPT context challenges security, architecture, correctness, test coverage and integration and returns a report on frozen HEAD."
    status: NOT_STARTED
  - id: AC-10
    description: "Active branch rules, Accepted status machines and any mandatory exact-head merge/reviewer gates are not silently relaxed."
    status: NOT_STARTED
  - id: AC-11
    description: "The current interactive protocol has a cold-readable README/prompt, bounded checkpoint, explicit rollback and no additional runtime."
    status: NOT_STARTED
  - id: AC-12
    description: "Earlier ACTIVE_4, scheduled four-writer and dispatcher contracts are explicitly superseded, with no conflicting operational directive."
    status: NOT_STARTED

