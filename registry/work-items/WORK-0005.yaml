id: WORK-0005
title: "Specify the GitHub-only ChatGPT development engine and independent review protocol"
status: PROPOSED
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.4
owner: "MONDE development operating model"
created_at: "2026-10-10"
updated_at: "2026-10-11"

purpose: |
  Specify, compare and independently validate a four-worker ChatGPT Scheduled
  tasks development model that operates exclusively through the connected
  GitHub repository and GitHub-hosted Actions. Eliminate dependency on local
  compute, a persistent third-party agent runtime and Codex review credits,
  while preserving existing non-author approval and security gates.

scope:
  in:
    - evaluate current MONDE documentation, WORK dependencies and reviewer policy
    - define GitHub-only worker/task/DAG/claim/fencing/CI-future/review protocols
    - define role-fluid intra-run phases and truly separate-context ChatGPT L2
    - distinguish technical L2 evidence from GitHub non-author APPROVED reviews
    - document relevant zero-host and GitHub connector limitations
    - research reusable GitHub and open-source CI/lint/QA capabilities
    - define verifiable test matrix, pilot gates and rollback criteria
    - specify automatic reconciliation and explicit incident-recovery mode
    - define fifteen fail-closed activation gates with proof requirements
    - audit high-impact development-engine traps, root causes, cost and progressive release gates
    - test a single-writer GitHub Actions allocator as a simpler alternative to per-worker CAS
    - specify six minimal invariants and core GitHub-native reuse-first implementation choices
    - define context-sensitive dynamic agent roles, decision rubric, autonomy/authority limits and review evidence
    - define same-cause repeat-failure diagnosis, refactor/redesign triggers and stop-search/freeze boundaries without adding new runtime components
    - document observable ChatGPT/GitHub tool retrieval pitfalls, staged read routing and non-calibrated slowdown estimates
    - prefer immediate zero-custom-runtime MONDE capability inventory and one-worker pilot before adding a concurrency controller
    - compare one-writer, premature four-writer, and 1+3 research/reviewer critical paths and budgets
    - prioritize useful accepted MONDE output by batching coherent source/test/doc GitHub operations, freeze final candidate once and use risk-relevant rapid feedback before all mandatory trusted checks
    - measure generated-vs-merged product LOC funnel and challenge conservative throughput assumptions with real executed Scheduled-task evidence
    - define proposed open-source technology families, public GitHub Actions free-tier assumptions and version pinning policy
    - specify same-invocation FRAME/RESEARCH/DECIDE/BUILD/VERIFY transitions, risk-based engineering gates, algorithm comparison and benchmark contracts
    - connect historical MONDE user intent retrieval and source provenance to existing WORK-0004 without cloning a capability registry
    - estimate 96 nominal hourly slots/day, conditional accepted product-code throughput and critical-path delivery under uncertainty
    - record official Scheduled task active-slot and Project upload access limitations
    - produce proposed ADR and research RFC without changing Accepted semantics
  out:
    - implementation or activation of the four Scheduled tasks
    - modification of existing WORK-0002 or PR #2/#14 accepted trust criteria
    - unilateral change to the Constitution or review-approval authority
    - changing repository administrator settings without an authorized route
    - any MONDE product or WRE implementation
    - installation of Beads, Gas Town, OpenHands, Temporal or local services

acceptance_criteria:
  - id: AC-1
    description: "The exact ChatGPT + GitHub-only runtime, capabilities, costs, permissions and limitations are documented, with no required external AI reviewer."
    status: NOT_STARTED
  - id: AC-2
    description: "Minimal trusted GitHub Actions assignment, no-overlap, CI/review futures, safe grant recovery and incident-recovery transitions are unambiguous, idempotent and testable; CAS/fencing control ref is a fallback only if separately selected."
    status: NOT_STARTED
  - id: AC-3
    description: "L0/L1/L2/L3 procedural independence and the separate GitHub author/non-author approval rule are accurately preserved."
    status: NOT_STARTED
  - id: AC-4
    description: "The reuse inventory proves that no parallel custom CI, task UI, merge queue or agent host is required."
    status: NOT_STARTED
  - id: AC-5
    description: "A cold-reading independent context can resume from the RFC and recovery/readiness runbooks, verify all launch gates and choose safe staged implementation without four premature write-enabled tasks."
    status: NOT_STARTED
  - id: AC-6
    description: "The proposed architectural decision and all mandatory review hats are assessed before acceptance; no protective gate is bypassed."
    status: NOT_STARTED
  - id: AC-7
    description: "Critical-path and reviewer-loop cost risks are classified, and the reuse-first one-dispatcher/few-custom-functions architecture is traceable through a minimal Actions-dispatcher-vs-CAS proof plan and progressive safety gates."
    status: NOT_STARTED
  - id: AC-8
    description: "The autonomous role policy distinguishes reversible implementation decisions, independent reviews, and owner/host authority; OSS stack and exact-version freeze policy have no hidden paid runtime dependency."
    status: NOT_STARTED

  # Proposed acceptance additions for substantive engineering/research and productivity model
  - id: AC-9
    description: "A single scheduled worker can complete multiple authorized engineering phases and revise a provisional technical choice after falsifying evidence, without misclassifying same-chat review as L2 or making high-risk decisions Accepted by itself."
    status: NOT_STARTED
  - id: AC-10
    description: "Complex algorithm/security/science/tool choices have repeatable source comparison, global dependency impact and validation rules, with research proportional to risk."
    status: NOT_STARTED
  - id: AC-11
    description: "Historical MONDE conversations inform WORK-0004 through source-confidence and privacy-safe provenance; no worker is assumed to have automatic access to all past chats or Project uploads."
    status: NOT_STARTED
  - id: AC-12
    description: "Four-worker throughput and delivery duration are modeled as conditional scenarios with explicit assumptions and measured GitHub repo code-type baselines, not promised rates."
    status: NOT_STARTED
  - id: AC-13
    description: "The operating contract includes evidence-driven root-cause/refactor/reconsider transitions, sufficient-evidence freeze and stop-search triggers, and no-bypass exit rules."
    status: NOT_STARTED
  - id: AC-14
    description: "Worker GitHub cold-start and tool-output model is scoped, independently reproducible, safe against untrusted tool text and tested for redundant reads and avoidable repeated work."
    status: NOT_STARTED
  - id: AC-15
    description: "The percentage slowdown model clearly labels all nonmeasured overlapping assumptions and defines matched 1/2/4-worker observational pilots before any speedup assertion."
    status: NOT_STARTED
  - id: AC-16
    description: "A pending or running GitHub Action or review does not itself end an active ChatGPT invocation: valid independent work and bounded real status polling continue, terminal results are handled, and only genuine runtime/tool/policy limits force a recoverable checkpoint."
    status: NOT_STARTED
  - id: AC-17
    description: "The A through E engineering phases are selected per task and risk; irrelevant research, choice or implementation phases can be skipped while all applicable tests, independent review and protected merge gates remain mandatory."
    status: NOT_STARTED
  - id: AC-18
    description: "The product-documentation bootstrap is achievable without an engine: L0 research, L1 single authorized writer, L2 trusted arbiter only for needed parallel writes, L3 four writers after accepted safety gates."
    status: NOT_STARTED
  - id: AC-19
    description: "One-writer vs four unconstrained vs one-writer-plus-independent-research/review scenarios explicitly quantify critical-path effort and limits, no fictitious four-times productivity claim."
    status: NOT_STARTED
  - id: AC-20
    description: "Maximum-throughput engineering selects cohesive multi-file Git commits when safely supported, early targeted verification and all mandatory exact-head gates, without redundant CI/status-only updates or unbounded large unrelated PRs."
    status: NOT_STARTED
  - id: AC-21
    description: "The accepted-product conversion funnel separates generated code, test code, authored product changes and merged net functional LOC; a higher 960/3600/9000 sensitivity model explicitly stays unmeasured and never relaxes review/host requirements."
    status: NOT_STARTED

  - id: AC-22
    description: "Evidence-based root-cause analysis ties observed WORK-0002 CI reference failures, stale-review loops and trust boundaries to six no-new-service Ready-to-Build preflight checks."
    status: NOT_STARTED
  - id: AC-23
    description: "A WORK-0002 reprioritization proposal preserves its IN_REVIEW evidence and main protection prerequisites; WORK-0001 stays DONE, and no unreviewed governance gate is bypassed."
    status: NOT_STARTED

