id: WORK-0005
title: "Specify the GitHub-only ChatGPT development engine and independent review protocol"
status: PROPOSED
phase: PHASE-0
lot: LOT-0
sublot: SUBLOT-0.4
owner: "MONDE development operating model"
created_at: "2026-10-10"
updated_at: "2026-10-10"

purpose: |
  Specify, compare and independently validate a four-worker ChatGPT Scheduled
  tasks development model that operates exclusively through the connected
  GitHub repository and GitHub-hosted Actions. Eliminate dependency on local
  compute, a persistent third-party agent runtime and Codex review credits,
  while preserving existing non-author approval and security gates.

scope:
  in:
    - evaluate current MONDE documentation, WORK dependencies and reviewer policy
    - define GitHub-only worker/task/DAG/claim/fencing/CI-future/review protocols
    - define role-fluid intra-run phases and truly separate-context ChatGPT L2
    - distinguish technical L2 evidence from GitHub non-author APPROVED reviews
    - document relevant zero-host and GitHub connector limitations
    - research reusable GitHub and open-source CI/lint/QA capabilities
    - define verifiable test matrix, pilot gates and rollback criteria
    - specify automatic reconciliation and explicit incident-recovery mode
    - define fifteen fail-closed activation gates with proof requirements
    - audit high-impact development-engine traps, root causes, cost and progressive release gates
    - test a single-writer GitHub Actions allocator as a simpler alternative to per-worker CAS
    - specify six minimal invariants and core GitHub-native reuse-first implementation choices
    - produce proposed ADR and research RFC without changing Accepted semantics
  out:
    - implementation or activation of the four Scheduled tasks
    - modification of existing WORK-0002 or PR #2/#14 accepted trust criteria
    - unilateral change to the Constitution or review-approval authority
    - changing repository administrator settings without an authorized route
    - any MONDE product or WRE implementation
    - installation of Beads, Gas Town, OpenHands, Temporal or local services

acceptance_criteria:
  - id: AC-1
    description: "The exact ChatGPT + GitHub-only runtime, capabilities, costs, permissions and limitations are documented, with no required external AI reviewer."
    status: NOT_STARTED
  - id: AC-2
    description: "All assignment, lease/fencing, no-overlap, CI futures, automatic reconciliation and manual incident-recovery transitions are unambiguous, idempotent and testable."
    status: NOT_STARTED
  - id: AC-3
    description: "L0/L1/L2/L3 procedural independence and the separate GitHub author/non-author approval rule are accurately preserved."
    status: NOT_STARTED
  - id: AC-4
    description: "The reuse inventory proves that no parallel custom CI, task UI, merge queue or agent host is required."
    status: NOT_STARTED
  - id: AC-5
    description: "A cold-reading independent context can resume from the RFC and recovery/readiness runbooks, verify all launch gates and choose safe staged implementation without four premature write-enabled tasks."
    status: NOT_STARTED
  - id: AC-6
    description: "The proposed architectural decision and all mandatory review hats are assessed before acceptance; no protective gate is bypassed."
    status: NOT_STARTED
  - id: AC-7
    description: "Critical-path and reviewer-loop cost risks are classified, and the reuse-first one-dispatcher/few-custom-functions architecture is traceable through a minimal Actions-dispatcher-vs-CAS proof plan and progressive safety gates."
    status: NOT_STARTED

