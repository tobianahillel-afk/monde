id: WORK-0042
title: "Compare durable MONDE Mini source snapshots without rewriting history"
status: PROPOSED
phase: PHASE-0
lot: LOT-2
sublot: SUBLOT-2.1
owner: "MONDE Mini source evidence lifecycle"
created_at: "2026-10-17"
updated_at: "2026-10-17"
purpose: |
  Compare two independently persisted, validated source-report states and expose
  exactly what new evidence and claims arrived, by source and entity, without
  interpreting source disagreement as new physical truth.
scope:
  in: ["read-only append-only snapshot comparison", "per-source change summary", "source report CLI", "source-reported new Point GeoJSON export", "auditable CSV of added reports and old/new correction values", "offline HTML map of newly recorded source Points"]
  out: ["automatic belief reconciliation", "destructive updates", "new external API", "background agent"]
acceptance_criteria:
  - {id: AC-1, description: "Report newly added source evidence, claims and same-source corrections.", status: NOT_STARTED}
  - {id: AC-2, description: "Reject removed, reordered or changed pre-existing history.", status: NOT_STARTED}
  - {id: AC-3, description: "Support actual saved mixed GeoPackage/GeoJSON source states and one-command read-only CLI.", status: NOT_STARTED}
  - {id: AC-4, description: "Export newly recorded source-reported Point positions to interoperable GeoJSON with original provenance and temporal metadata.", status: NOT_STARTED}
  - {id: AC-5, description: "Export all newly recorded source assertions including their original and superseded values as read-only typed CSV evidence.", status: NOT_STARTED}
  - {id: AC-6, description: "Inspect newly recorded source-reported Points in the existing standalone offline map, preserving provenance and never inferring physical movement.", status: NOT_STARTED}
