      transition: PROPOSED -> ACCEPTED
      content_identity:
        scheme_source: registry/content-identity.yaml#schemes.REQUIREMENT_NORMATIVE_V1
        requirement_field: content_identity
        required_scheme: REQUIREMENT_NORMATIVE_V1
        digest_must_match_recomputation: true
      independent_review:
        evidence_field: verification.acceptance_evidence
        required_record_type: REVIEW
        required_status: COMPLETE
        required_outcomes:
        - APPROVE
        - APPROVE_WITH_FOLLOWUP
        minimum_independence_source: applicable owning-work assurance policy
        requirement_must_be_in_scope: true
        reviewed_while_requirement_status: PROPOSED
        revision_binding_field: scope.requirement_revisions
        exact_content_digest_match: true
      cold_read:
        evidence_field: verification.acceptance_cold_read_test_ids
        required_record_type: TEST
        required_status: PASS
        qualification_field: acceptance_cold_read.qualifies
        qualification_required_value: true
        exact_revision_required: true
        requirement_must_be_protected: true
        tested_while_requirement_status: PROPOSED
        source_id_required: true
        source_submitted_at_required: true
        executor_context_id_required: true
        allowed_independence_levels:
        - L2
        - L3
        fresh_context_required: true
        authoring_context_separated_required: true
        requirement_binding_field: acceptance_cold_read.requirements
        exact_content_digest_match: true
        required_status_at_read: PROPOSED
        required_outcomes:
        - understood_without_author_reasoning
        - atomic_and_testable
        - dependencies_and_conflicts_checked
        - omissions_and_failure_modes_checked
        - evidence_plan_sufficient
        all_required_outcomes_value: PASS
        all_required_outcomes_pass_field: acceptance_cold_read.all_required_outcomes_pass
        all_required_outcomes_pass_required_value: true
      invalidation_rule: If any field included by the requirement's content_identity scheme changes after a qualifying review
        or cold read, the recomputed digest changes and every acceptance proof bound to the prior digest becomes non-qualifying.
        Remaining in PROPOSED status does not preserve stale proof. Evidence/provenance-link edits excluded by the identity
        scheme may occur without changing normative identity.
      rule: "A normal PROPOSED \u2192 ACCEPTED edge is necessary but not sufficient. The requirement's declared normative\
        \ digest must recompute correctly. At acceptance there must be at least one resolvable COMPLETE approval-capable independent\
        \ REVIEW referenced through verification.acceptance_evidence whose scope includes the requirement, whose scope.requirement_revisions\
        \ binds that requirement to the exact current digest, whose independence satisfies policy and which inspected it while\
        \ PROPOSED; and at least one resolvable PASS TEST referenced through verification.acceptance_cold_read_test_ids that\
        \ protects the requirement and explicitly qualifies as a fresh-context authoring-separated cold read, binds the same\
        \ exact digest while PROPOSED, carries durable source/executor provenance and records PASS for every required cold-read\
        \ outcome. Generic PASS tests, stale digests, negative reviews, prose/docs, author assertion, or a lifecycle-valid\
        \ edge alone never satisfy this precondition."
