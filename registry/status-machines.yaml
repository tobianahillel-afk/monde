    outcomes: [APPROVE, APPROVE_WITH_FOLLOWUP, CHANGES_REQUIRED, BLOCKED]
    approval_capable_outcomes: [APPROVE, APPROVE_WITH_FOLLOWUP]
    finding_severities: [R1_CRITICAL, R2_MAJOR, R3_MODERATE, R4_MINOR]
    finding_dispositions: [OPEN, RESOLVED, ACCEPTED, TRACKED_FOLLOWUP, OWNER_ACTION_REQUIRED]
    accepted_finding_required_fields:
      - acceptance.accepted_by
      - acceptance.authority_role
      - acceptance.authority_evidence
      - acceptance.rationale
      - acceptance.accepted_at
      - acceptance.review_condition
    accepted_finding_rule: "A finding with disposition ACCEPTED must identify the accepting actor, authority role, non-empty evidence establishing that authority for the reviewed artifact/risk, rationale, acceptance time, and a future review/expiry condition. For an R1/R2 finding to stop blocking A3/A4 completion, that acceptance evidence must demonstrate authority appropriate to the work item's assurance level; an author cannot make a blocking finding non-blocking merely by writing ACCEPTED. A4 additionally requires formal owner approval wherever the assurance policy requires it."
    completion_rule: "Only a COMPLETE review whose outcome is one of approval_capable_outcomes may provide approval evidence. It must be bound to the reviewed artifact/version, include the required executed review roles/independence, and have no unresolved blocking R1/R2 finding unless that finding satisfies accepted_finding_rule. COMPLETE reviews with CHANGES_REQUIRED or BLOCKED are durable negative review evidence and never satisfy a work-item review-completion gate."
    closed_rule: "CLOSED is an administrative terminal state for a review that will not provide approval evidence; CLOSED never satisfies a work-item review-completion gate."
    external_import_required_fields:
      - record_id
      - imported_status
      - artifact_commit_sha
      - source_review_id
      - source_submitted_at
      - reviewer_context_id
      - expected_outcome
      - one_shot
