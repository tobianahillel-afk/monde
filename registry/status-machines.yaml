version: 4
canonical: true
updated_at: "2026-09-10"

principles:
  - "A record status is valid only when declared by the machine for its registry."
  - "Transitions not listed here are invalid unless a reviewed migration explicitly changes this contract."
  - "A metadata-only edit may retain the same status; this is not a lifecycle transition."
  - "Terminal and superseded records remain historically addressable; IDs are never reused."
  - "Project/work progress dimensions use their own lifecycle and must not be treated as the status vocabulary of every registry."

registry_machines:
  work_items:
    initial: PROPOSED
    states: [PROPOSED, PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, DEPRECATED, CANCELLED]
    transitions:
      PROPOSED: [PLANNED, CANCELLED]
      PLANNED: [READY, BLOCKED, CANCELLED]
      READY: [IN_PROGRESS, BLOCKED, CANCELLED]
      IN_PROGRESS: [PARTIAL, BLOCKED, IN_REVIEW, CANCELLED]
      PARTIAL: [IN_PROGRESS, BLOCKED, IN_REVIEW, CANCELLED]
      BLOCKED: [READY, IN_PROGRESS, PARTIAL, CANCELLED]
      IN_REVIEW: [IN_PROGRESS, PARTIAL, BLOCKED, DONE]
      DONE: [DEPRECATED]
      DEPRECATED: []
      CANCELLED: []

  capabilities:
    initial: PROPOSED
    states: [PROPOSED, PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, DEPRECATED, CANCELLED]
    transitions:
      PROPOSED: [PLANNED, CANCELLED]
      PLANNED: [READY, BLOCKED, CANCELLED]
      READY: [IN_PROGRESS, BLOCKED, CANCELLED]
      IN_PROGRESS: [PARTIAL, BLOCKED, IN_REVIEW, CANCELLED]
      PARTIAL: [IN_PROGRESS, BLOCKED, IN_REVIEW, CANCELLED]
      BLOCKED: [READY, IN_PROGRESS, PARTIAL, CANCELLED]
      IN_REVIEW: [IN_PROGRESS, PARTIAL, BLOCKED, DONE]
      DONE: [DEPRECATED]
      DEPRECATED: []
      CANCELLED: []

  requirements:
    initial: PROPOSED
    states: [PROPOSED, ACCEPTED, SUPERSEDED, DEPRECATED, CANCELLED]
    transitions:
      PROPOSED: [ACCEPTED, CANCELLED]
      ACCEPTED: [SUPERSEDED, DEPRECATED]
      SUPERSEDED: []
      DEPRECATED: []
      CANCELLED: []

  assumptions:
    initial: OPEN
    states: [OPEN, VALIDATING, RESOLVED, SUPERSEDED, EXPIRED]
    transitions:
      OPEN: [VALIDATING, RESOLVED, SUPERSEDED, EXPIRED]
      VALIDATING: [OPEN, RESOLVED, SUPERSEDED, EXPIRED]
      RESOLVED: [SUPERSEDED]
      SUPERSEDED: []
      EXPIRED: [OPEN, SUPERSEDED]
    resolution_outcomes: [CONFIRMED, REJECTED, PARTIALLY_CONFIRMED, UNKNOWN]

  risks:
    initial: OPEN
    states: [OPEN, MITIGATING, MONITORING, ACCEPTED, CLOSED, SUPERSEDED]
    transitions:
      OPEN: [MITIGATING, MONITORING, ACCEPTED, CLOSED, SUPERSEDED]
      MITIGATING: [OPEN, MONITORING, ACCEPTED, CLOSED, SUPERSEDED]
      MONITORING: [OPEN, MITIGATING, ACCEPTED, CLOSED, SUPERSEDED]
      ACCEPTED: [OPEN, MONITORING, CLOSED, SUPERSEDED]
      CLOSED: [OPEN, SUPERSEDED]
      SUPERSEDED: []

  reviews:
    initial: OPEN
    states: [OPEN, IN_PROGRESS, COMPLETE, CLOSED]
    transitions:
      OPEN: [IN_PROGRESS, CLOSED]
      IN_PROGRESS: [COMPLETE, CLOSED]
      COMPLETE: []
      CLOSED: []
    outcomes: [APPROVE, APPROVE_WITH_FOLLOWUP, CHANGES_REQUIRED, BLOCKED]
    approval_capable_outcomes: [APPROVE, APPROVE_WITH_FOLLOWUP]
    finding_severities: [R1_CRITICAL, R2_MAJOR, R3_MODERATE, R4_MINOR]
    finding_dispositions: [OPEN, RESOLVED, ACCEPTED, TRACKED_FOLLOWUP, OWNER_ACTION_REQUIRED]
    accepted_finding_required_fields:
      - acceptance.accepted_by
      - acceptance.authority_role
      - acceptance.authority_evidence
      - acceptance.rationale
      - acceptance.accepted_at
      - acceptance.review_condition
    accepted_finding_rule: "A finding with disposition ACCEPTED must identify the accepting actor, authority role, non-empty evidence establishing that authority for the reviewed artifact/risk, rationale, acceptance time, and a future review/expiry condition. For an R1/R2 finding to stop blocking A3/A4 completion, that acceptance evidence must demonstrate authority appropriate to the work item's assurance level; an author cannot make a blocking finding non-blocking merely by writing ACCEPTED. A4 additionally requires formal owner approval wherever the assurance policy requires it."
    completion_rule: "Only a COMPLETE review whose outcome is one of approval_capable_outcomes may provide approval evidence. It must be bound to the reviewed artifact/version, include the required executed review roles/independence, and have no unresolved blocking R1/R2 finding unless that finding satisfies accepted_finding_rule. COMPLETE reviews with CHANGES_REQUIRED or BLOCKED are durable negative review evidence and never satisfy a work-item review-completion gate."
    closed_rule: "CLOSED is an administrative terminal state for a review that will not provide approval evidence; CLOSED never satisfies a work-item review-completion gate."

  tests:
    initial: PLANNED
    states: [PLANNED, READY, RUNNING, PASS, FAIL, BLOCKED, CANCELLED, SUPERSEDED]
    transitions:
      PLANNED: [READY, BLOCKED, CANCELLED]
      READY: [RUNNING, BLOCKED, CANCELLED]
      RUNNING: [PASS, FAIL, BLOCKED]
      PASS: [READY, SUPERSEDED]
      FAIL: [READY, BLOCKED, SUPERSEDED]
      BLOCKED: [READY, CANCELLED, SUPERSEDED]
      CANCELLED: []
      SUPERSEDED: []
    pass_rule: "PASS is evidence-bearing: the record must identify what it protects, how it ran, its result, and concrete evidence; every state-bound PASS execution must have a non-null exact tested/reviewed commit_sha."
    historical_pass_rule: "If an older PASS execution has no provable exact revision, do not invent one and do not keep that record as active gating PASS evidence. Preserve its historical execution fields, transition the record to SUPERSEDED, identify replacement evidence that actually re-executes or explicitly partitions the superseded scope, and use revision-bound evidence for current gates."

  experiments:
    initial: PLANNED
    states: [PLANNED, READY, RUNNING, COMPLETE, FAILED, BLOCKED, CANCELLED, SUPERSEDED]
    transitions:
      PLANNED: [READY, BLOCKED, CANCELLED]
      READY: [RUNNING, BLOCKED, CANCELLED]
      RUNNING: [COMPLETE, FAILED, BLOCKED]
      COMPLETE: [SUPERSEDED]
      FAILED: [READY, SUPERSEDED]
      BLOCKED: [READY, CANCELLED, SUPERSEDED]
      CANCELLED: []
      SUPERSEDED: []

  dependencies:
    initial: PROPOSED
    states: [PROPOSED, ACTIVE, SUPERSEDED, RETIRED]
    transitions:
      PROPOSED: [ACTIVE, RETIRED]
      ACTIVE: [SUPERSEDED, RETIRED]
      SUPERSEDED: []
      RETIRED: []

progress:
  canonical_source: "This section is the sole lifecycle vocabulary for phase, lot, sublot, acceptance-criterion, task, run, quality-dimension and WORK progress-dimension state. registry/progress/matrix.yaml stores current instances only."
  initial: NOT_STARTED
  applies_to: [PHASE, LOT, SUBLOT, ACCEPTANCE_CRITERION, TASK, RUN, QUALITY_DIMENSION, WORK_PROGRESS_DIMENSION]
  states: [NOT_STARTED, PROPOSED, PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, DEPRECATED, CANCELLED, NOT_APPLICABLE]
  transitions:
    NOT_STARTED: [PROPOSED, PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    PROPOSED: [PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    PLANNED: [READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    READY: [IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    IN_PROGRESS: [PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    PARTIAL: [IN_PROGRESS, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    BLOCKED: [READY, IN_PROGRESS, PARTIAL, IN_REVIEW, CANCELLED, NOT_APPLICABLE]
    IN_REVIEW: [IN_PROGRESS, PARTIAL, BLOCKED, DONE, CANCELLED, NOT_APPLICABLE]
    DONE: [DEPRECATED]
    DEPRECATED: []
    CANCELLED: []
    NOT_APPLICABLE: [NOT_STARTED, PLANNED]
  work_item_status_rule: "The status field of a WORK entry in the progress matrix mirrors the canonical registry_machines.work_items state and transition; NOT_APPLICABLE is never a WORK record status."
  done_allowed_dimension_states: [DONE, NOT_APPLICABLE]
  not_applicable_rule: "Every NOT_APPLICABLE dimension requires a non-empty justification in the corresponding work item and remains subject to review for non-compensable gates."
