progress:
  canonical_source: "This section is the sole lifecycle vocabulary for phase, lot, sublot, acceptance-criterion, task, run, quality-dimension and WORK progress-dimension state. registry/progress/matrix.yaml stores current instances only."
  initial: NOT_STARTED
  applies_to: [PHASE, LOT, SUBLOT, ACCEPTANCE_CRITERION, TASK, RUN, QUALITY_DIMENSION, WORK_PROGRESS_DIMENSION]
  states: [NOT_STARTED, PROPOSED, PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, DEPRECATED, CANCELLED, NOT_APPLICABLE]
  transitions:
    NOT_STARTED: [PROPOSED, PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    PROPOSED: [PLANNED, READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    PLANNED: [READY, IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    READY: [IN_PROGRESS, PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    IN_PROGRESS: [PARTIAL, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    PARTIAL: [IN_PROGRESS, BLOCKED, IN_REVIEW, DONE, CANCELLED, NOT_APPLICABLE]
    BLOCKED: [READY, IN_PROGRESS, PARTIAL, IN_REVIEW, CANCELLED, NOT_APPLICABLE]
    IN_REVIEW: [IN_PROGRESS, PARTIAL, BLOCKED, DONE, CANCELLED, NOT_APPLICABLE]
    DONE: [IN_REVIEW, DEPRECATED]
    DEPRECATED: []
    CANCELLED: []
    NOT_APPLICABLE: [NOT_STARTED, PLANNED]
  reopening_rule: "DONE → IN_REVIEW is a reviewed reopening transition, not silent regression. It is allowed only when new evidence, a review finding, dependency change, or invalidated proof materially re-questions prior completion. The owning WORK/project handover must identify the trigger and affected evidence, downstream completion assumptions must be re-evaluated, and the reopened dimension must satisfy the normal review/completion gates before returning to DONE."
  work_item_status_rule: "The status field of a WORK entry in the progress matrix mirrors the canonical registry_machines.work_items state and transition; NOT_APPLICABLE is never a WORK record status."
  done_allowed_dimension_states: [DONE, NOT_APPLICABLE]
  not_applicable_rule: "Every NOT_APPLICABLE dimension requires a non-empty justification in the corresponding work item and remains subject to review for non-compensable gates."
