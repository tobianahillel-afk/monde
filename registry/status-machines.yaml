version: 10
canonical: true
updated_at: '2026-09-14'
principles:
- A record status is valid only when declared by the machine for its registry.
- Transitions not listed here are invalid unless an exact reviewed migration, historical-import or historical-replay exception
  in this contract applies.
- Migration/import/replay exceptions are historical, record-specific and commit-bound; they never add a generic transition
  or alternate initial state and may not be reused for future records.
- A metadata-only edit may retain the same status; this is not a lifecycle transition.
- Terminal and superseded records remain historically addressable; IDs are never reused.
- Project/work progress dimensions use their own lifecycle and must not be treated as the status vocabulary of every registry.
- Completion evidence may be reopened when later evidence invalidates or materially re-questions it; reopening is recorded
  rather than rewriting the prior state.
- Lifecycle checkpoints represent states that actually existed while the governed activity was occurring; replaying OPEN/IN_PROGRESS
  after an external review already completed is not evidence that those execution states occurred.
- A review completed externally before registry materialization may be imported in its resulting status only through immutable
  pre-v7 historical evidence or a one-shot external-import authorization that already exists in a parent commit before materialization
  and is later bound to the actual import commit.
- A TEST execution completed externally while its registry record is still non-terminal may be imported in its resulting status
  only through an exact one-shot external-execution authorization that exists in a parent commit before result materialization,
  binds the source/executor/exact tested revision, and is later bound and consumed by the actual import commit; normal lifecycle
  checkpoints must never be replayed after the external execution already finished.
- 'Requirement acceptance proof is content-bound: review and cold-read evidence qualify only for the exact normative digest
  being accepted.'
- A generic PASS test is never automatically a requirement-acceptance cold read; qualifying cold reads carry explicit fresh-context
  provenance, exact requirement digests and required outcomes.
- Risk and blocking-finding acceptance authority is resolved from registry/acceptance-authority.yaml; free-form authority
  labels or prose evidence alone never grant authority.
