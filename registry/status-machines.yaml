version: 6
canonical: true
updated_at: "2026-09-10"

principles:
  - "A record status is valid only when declared by the machine for its registry."
  - "Transitions not listed here are invalid unless an exact reviewed migration or historical-import exception in this contract applies."
  - "Migration/import exceptions are historical, record-specific and commit-bound; they never add a generic transition or alternate initial state and may not be reused for future records."
  - "A metadata-only edit may retain the same status; this is not a lifecycle transition."
  - "Terminal and superseded records remain historically addressable; IDs are never reused."
  - "Project/work progress dimensions use their own lifecycle and must not be treated as the status vocabulary of every registry."
  - "Completion evidence may be reopened when later evidence invalidates or materially re-questions it; reopening is recorded rather than rewriting the prior state."
  - "A registry record materialized after an already-completed external governance event may enter Git in its resulting status only when an exact reviewed historical-import exception names that record, status and introduction commit."

registry_machines:
