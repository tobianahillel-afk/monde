  reopening_rule: "DONE \u2192 IN_REVIEW is a reviewed reopening transition, not silent regression. It is allowed only when\
    \ new evidence, a review finding, dependency change, or invalidated proof materially re-questions prior completion. The\
    \ owning WORK/project handover must identify the trigger and affected evidence, downstream completion assumptions must\
    \ be re-evaluated, and the reopened dimension must satisfy the normal review/completion gates before returning to DONE."
  work_item_status_rule: The status field of a WORK entry in the progress matrix mirrors the canonical registry_machines.work_items
    state and transition; NOT_APPLICABLE is never a WORK record status.
