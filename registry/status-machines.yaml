    initial: OPEN
    states: [OPEN, VALIDATING, RESOLVED, SUPERSEDED, EXPIRED]
    transitions:
      OPEN: [VALIDATING, RESOLVED, SUPERSEDED, EXPIRED]
      VALIDATING: [OPEN, RESOLVED, SUPERSEDED, EXPIRED]
      RESOLVED: [SUPERSEDED]
      SUPERSEDED: []
      EXPIRED: [OPEN, SUPERSEDED]
    resolution_outcomes: [CONFIRMED, REJECTED, PARTIALLY_CONFIRMED, UNKNOWN]

  risks:
