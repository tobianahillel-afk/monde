      and import_commit exactly match a reviewed exception above and actual Git history. The exception preserves immutable
      history only; it does not make ACCEPTED an initial state, does not create a generic transition, and cannot authorize
      any future requirement to bypass PROPOSED. Records introduced in the same bootstrap commit that established this machine
      are baseline state, not post-contract imports.
