    accepted_finding_authority_matrix_source: registry/acceptance-authority.yaml#finding_acceptance
    accepted_finding_authority_evidence_contract_source: registry/acceptance-authority.yaml#evidence_contract
    accepted_finding_rule: A finding with disposition ACCEPTED must identify the accepting actor, matrix-authorized role,
      typed durable authority evidence, matrix version/rule, rationale, acceptance time and a future review/expiry condition.
      The role MUST be allowed by the finding-acceptance matrix for the owning work assurance level + finding severity, and
      the evidence type/reference MUST satisfy the authority role contract. Merely authoring the finding, naming an arbitrary
      role, supplying prose, or populating non-empty fields is insufficient.
    completion_rule: Only a COMPLETE review whose outcome is one of approval_capable_outcomes may provide approval evidence.
      It must be bound to the reviewed artifact/version, include the required executed review roles/independence, and have
      no unresolved blocking R1/R2 finding unless that finding satisfies accepted_finding_rule. COMPLETE reviews with CHANGES_REQUIRED
      or BLOCKED are durable negative review evidence and never satisfy a work-item review-completion gate.
    closed_rule: CLOSED is an administrative terminal state for a review that will not provide approval evidence; CLOSED never
      satisfies a work-item review-completion gate.
