version: 7
canonical: true
updated_at: "2026-09-11"

principles:
  - "A record status is valid only when declared by the machine for its registry."
  - "Transitions not listed here are invalid unless an exact reviewed migration, historical-import or historical-replay exception in this contract applies."
  - "Migration/import/replay exceptions are historical, record-specific and commit-bound; they never add a generic transition or alternate initial state and may not be reused for future records."
  - "A metadata-only edit may retain the same status; this is not a lifecycle transition."
  - "Terminal and superseded records remain historically addressable; IDs are never reused."
  - "Project/work progress dimensions use their own lifecycle and must not be treated as the status vocabulary of every registry."
  - "Completion evidence may be reopened when later evidence invalidates or materially re-questions it; reopening is recorded rather than rewriting the prior state."
  - "Lifecycle checkpoints represent states that actually existed while the governed activity was occurring; replaying OPEN/IN_PROGRESS after an external review already completed is not evidence that those execution states occurred."
  - "A review completed externally before registry materialization may be imported in its resulting status only through immutable pre-v7 historical evidence or a one-shot external-import authorization that already exists in a parent commit before materialization and is later bound to the actual import commit."

