      authority_matrix_source: registry/acceptance-authority.yaml#risk_acceptance
      authority_evidence_contract_source: registry/acceptance-authority.yaml#evidence_contract
      rule: Any transition into ACCEPTED requires resolution.accepted=true plus a named accepting actor, authority role, typed
        evidence reference, exact authority-matrix version/rule, rationale, acceptance timestamp and review/expiry condition.
        The role MUST be allowed by the resolved category + owning-work assurance + assessment.impact matrix rule; the evidence
        type MUST be allowed for that role; the durable evidence reference MUST establish that the named actor holds that
        role/delegation. Unknown matrix inputs or free-form/unrecognized roles/evidence fail closed. An unresolved critical
        security finding or unknown critical trust boundary may be accepted only under the matrix rule applicable to that
        exact security category, assurance and impact.
