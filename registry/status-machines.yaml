  tests:
    initial: PLANNED
    states: [PLANNED, READY, RUNNING, PASS, FAIL, BLOCKED, CANCELLED, SUPERSEDED]
    transitions:
      PLANNED: [READY, BLOCKED, CANCELLED]
      READY: [RUNNING, BLOCKED, CANCELLED]
      RUNNING: [PASS, FAIL, BLOCKED]
      PASS: [READY, SUPERSEDED]
      FAIL: [READY, BLOCKED, SUPERSEDED]
      BLOCKED: [READY, CANCELLED, SUPERSEDED]
      CANCELLED: []
      SUPERSEDED: []
    pass_rule: "PASS is evidence-bearing: the record must identify what it protects, how it ran, its result, and concrete evidence; every state-bound PASS execution must have a non-null exact tested/reviewed commit_sha."
    historical_pass_rule: "If an older PASS execution has no provable exact revision, do not invent one and do not keep that record as active gating PASS evidence. Preserve its historical execution fields, transition the record to SUPERSEDED, identify replacement evidence that actually re-executes or explicitly partitions the superseded scope, and use revision-bound evidence for current gates."
    historical_transition_exceptions:
      - record_id: TEST-0004
        from: PLANNED
        to: PASS
        before_commit: "98e8cdccc07bd3c2d8313d81f296f49c97c44379"
        transition_commit: "e8337d833ca0b524bed69318ca4b3691c9ce6c23"
        reason: "TEST-0004 was executed and recorded before the corrective branch consistently applied READY/RUNNING checkpoints. The immutable branch history cannot be repaired by inventing commits; this exact historical edge is retained as a reviewed migration exception while the evidence remains SHA-bound to 23ef1a88e9a5106b12144d4c6649868a6a691a8f."
        historical_only: true
        future_reuse_forbidden: true
        review_origin: "REVIEW-0009/F-2"
    transition_exception_rule: "A historical transition exception is valid only when record_id, from, to, before_commit and transition_commit all exactly match the recorded Git history. It does not modify the generic transitions table, cannot authorize any future transition, and requires independent review of the migration rationale."

