  contracts:
    - "trusted default-branch stale-green review-state invalidation"
    - "effective merge state is read directly from the exact latest GitHub Actions-owned MONDE / Merge Gate check for the exact head SHA"
    - "canonical Actions workflow history is used only to discover a current-incarnation rerun target, never as merge-state authority"
    - "filtered workflow-run searches are partitioned into closed non-overlapping second windows below GitHub's 1,000-result ceiling"
    - "accepted filtered workflow-run windows have unique exact IDs and identical repeated snapshots before use"
