    - "check/run/job lookups are cached within one poll and the scheduled poll cadence is ten minutes"
    - "fail-closed GitHub Checks/Actions/Pull Requests/GraphQL metadata and bounded pagination"
    - "bootstrap regression and TEST-0009 / WORK-0002 / PROJECT_STATE traceability completeness"
  risks:
    - "GitHub Checks latest-state semantics or app identity could be misbound, allowing a non-authoritative check to drive stale-green classification."
    - "Time-window partitioning could overlap, omit a second, or accept an unstable/duplicate filtered snapshot."
    - "Current-incarnation rerun-target selection could still admit a prior/overlapping PR context despite direct check-state authority."
    - "Closed-PR history bounding could stop too early or fail to remain complete for lifetimes able to overlap the active incarnation."
    - "Caching or reduced cadence could accidentally preserve stale authority or still exceed GitHub request budgets under scale."
