findings:
  - id: F-1
    severity: R2_MAJOR
    category: SUPPLY_CHAIN_SECURITY
    description: "Initial workflow referenced mutable major GitHub Action tags and persisted checkout credentials by default."
    evidence:
      - ".github/workflows/governance.yml initial PR diff"
      - "official action refs verified for checkout v7.0.1 and setup-python v7.0.0"
    disposition: RESOLVED
    resolved_by: "Pinned checkout/setup-python to immutable commit SHAs and set persist-credentials=false."
  - id: F-2
    severity: R3_MODERATE
    category: DEPENDENCY_REPRODUCIBILITY
    description: "Initial CI dependency ranges allowed environment drift and pip was upgraded on each run."
    evidence:
      - "initial pyproject/workflow"
    disposition: RESOLVED
    resolved_by: "Pinned validated direct/transitive governance dependency versions in requirements/governance-ci.txt and removed pip upgrade."
  - id: F-3
    severity: R2_MAJOR
    category: PATH_BOUNDARY
    description: "Path validation originally checked existence but did not reject absolute or traversal/symlink paths resolving outside repository root."
    evidence:
      - "validate_paths and validate_markdown code review"
      - "tests/governance/test_path_safety.py"
      - "GitHub Actions run 34418747551"
    disposition: RESOLVED
    resolved_by: "Added deterministic path-safety gate for YAML declarations and Markdown links, including traversal/absolute/symlink escapes; regression tests retain 100 percent line/branch coverage."
  - id: F-4
    severity: R3_MODERATE
    category: SUPPLY_CHAIN_SECURITY
    description: "Python package versions are exact but package artifact hashes are not yet locked."
    evidence:
      - "requirements/governance-ci.txt"
    disposition: TRACKED_FOLLOWUP
    resolved_by: "Hash-locked dependency generation is deferred to dedicated supply-chain hardening; exact versions already remove ordinary resolver drift."
  - id: F-5
    severity: R4_LOW
    category: CI_TRUST_BOUNDARY
    description: "PR CI necessarily executes repository test code on a hosted runner."
    evidence:
      - ".github/workflows/governance.yml"
      - "GitHub Actions run 34418747551 logs"
    disposition: ACCEPTED
    resolved_by: "Use GitHub-hosted runner, pull_request event, read-only contents token, no repository secrets, no privileged/self-hosted runner, immutable actions, and non-persisted checkout credentials."
  - id: F-6
    severity: R3_MODERATE
    category: SCHEMA_DEPTH
    description: "Current validator enforces selected deterministic invariants but does not yet validate every registry field through formal JSON Schema."
    evidence:
      - "WORK-0002 bounded scope"
      - "validator implementation"
    disposition: TRACKED_FOLLOWUP
    resolved_by: "Keep this deterministic first slice bounded; add machine-readable JSON Schema validation as registries stabilize."
  - id: F-7
    severity: R4_LOW
    category: SELF_ENFORCEMENT
    description: "During hardening, CI correctly failed when WORK-0002 referenced REVIEW-0002 before that registry record existed."
    evidence:
      - "GitHub Actions run 34418545142"
    disposition: RESOLVED
    resolved_by: "Created REVIEW-0002 as the declared review artifact; subsequent hardened run is green. This demonstrates cross-record enforcement on the actual repository."

