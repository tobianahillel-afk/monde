findings:
  - id: F-1
    severity: R2_MAJOR
    category: VERIFICATION_VALIDATION
    description: "At reviewed HEAD e405c977f9de58cd4d88849784d425de6a61cd1d, v8 requires exact-revision cold-read evidence but does not require the requirement content at the later PROPOSED → ACCEPTED transition to be identical to the content inspected by both the qualifying review and cold-read. A requirement may therefore change normative_statement, dependencies, or verification semantics after both proofs while remaining PROPOSED and still satisfy the listed preconditions. Bind the qualifying review and cold-read to the exact requirement content/revision being accepted, or mechanically invalidate those proofs after any substantive requirement edit."
    evidence:
      - "PR #3 fresh-context Codex review on exact head e405c977f9de58cd4d88849784d425de6a61cd1d"
      - "GitHub review PRR_kwDOUUI5ts8AAAABNX_ZcQ submitted 2026-09-13T22:36:15Z"
      - "Inline finding thread PRRT_kwDOUUI5ts6h8mbR"
      - "registry/status-machines.yaml requirement acceptance_preconditions do not bind both proofs to the exact requirement content accepted later"
      - "AGENTS.md requires applicable independent Review Council/cold-read evidence before acceptance"
    disposition: OPEN
    resolved_by: null

  - id: F-2
    severity: R2_MAJOR
    category: VERIFICATION_VALIDATION
    description: "At reviewed HEAD e405c977f9de58cd4d88849784d425de6a61cd1d, v8 treats any exact-SHA PASS test referenced by verification.test_ids and protecting the requirement as qualifying cold-read evidence. Neither the requirement acceptance contract nor the TEST record shape requires a fresh executor/context identity or durable evidence that the cold-read questions were independently answered. An author-produced test such as TEST-0006 can therefore satisfy this half of acceptance. Require verifiable fresh-context cold-read provenance and explicit outcomes rather than only a structural TEST edge."
    evidence:
      - "PR #3 fresh-context Codex review on exact head e405c977f9de58cd4d88849784d425de6a61cd1d"
      - "GitHub review PRR_kwDOUUI5ts8AAAABNX_ZcQ submitted 2026-09-13T22:36:15Z"
      - "Inline finding thread PRRT_kwDOUUI5ts6h8mbS"
      - "registry/status-machines.yaml cold_read preconditions require PASS/exact revision/protection but no fresh-context provenance or executed cold-read outcomes"
      - "Current TEST records do not make fresh-context executor/context proof mandatory for requirement acceptance"
    disposition: OPEN
    resolved_by: null

  - id: F-3
    severity: R2_MAJOR
    category: SECURITY
    description: "At reviewed HEAD e405c977f9de58cd4d88849784d425de6a61cd1d, v8 requires authority appropriate to risk severity/category and assurance level but points only to policies that themselves say 'appropriate' or 'correct' authority. No canonical machine-resolvable matrix defines which role may accept each severity/category/assurance combination or what typed evidence establishes delegation. Arbitrary non-empty authority_role and authority_evidence strings therefore cannot be mechanically rejected. Define a resolvable authority matrix or require a typed approval record from an actor authorized by such a matrix."
    evidence:
      - "PR #3 fresh-context Codex review on exact head e405c977f9de58cd4d88849784d425de6a61cd1d"
      - "GitHub review PRR_kwDOUUI5ts8AAAABNX_ZcQ submitted 2026-09-13T22:36:15Z"
      - "Inline finding thread PRRT_kwDOUUI5ts6h8mbT"
      - "registry/status-machines.yaml risk acceptance_preconditions accept free-form authority_role/authority_evidence constrained only by policy prose"
      - "docs/09_GOVERNANCE/threat-modeling.md and docs/13_QUALITY/assurance-levels.md do not currently expose a machine-readable role-by-risk acceptance matrix"
    disposition: OPEN
    resolved_by: null

