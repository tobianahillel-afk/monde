    resolved_by: "WORK-0002 implements governance/specification/traceability validation and is independently reviewed before merge."
  - id: F-3
    severity: R2_MAJOR
    category: SECURITY
    description: "Repository is currently public while future MONDE specifications may contain sensitive/high-risk architectural material."
    evidence: ["Repository metadata inspected 2026-09-10", "Explicit owner decision 2026-09-10: repository remains public", "WORK-0003"]
    disposition: ACCEPTED
    resolved_by: "Owner explicitly accepts a public repository. Repository content must remain public-code-safe: no credentials, secrets, private/personal datasets or user-identifying runtime data may be committed; sensitive runtime data and secrets remain outside Git. WORK-0003 retains branch/ruleset/check/security hardening but not privatization as a requirement."
  - id: F-4
    severity: R2_MAJOR
    category: SPECIFICATION_PROCESS
    description: "Initial bootstrap governed execution well but insufficiently governed specification reasoning, assumptions, traceability and independent review."
    evidence: ["Gap analysis during PR review"]
    disposition: RESOLVED
    resolved_by: "Added specification quality, requirements/assumptions/risks, Review Council, traceability, DoR, NFR, research and backtesting protocols."
  - id: F-5
    severity: R3_MODERATE
    category: REVIEW_INDEPENDENCE
    description: "Current structured review is same-context L1; foundational governance targets a fresh-context L2 review before final confidence."
    evidence: ["Review Council independence policy", "REVIEW-0003 fresh-context Codex review of merged b88e9edf"]
    disposition: RESOLVED
    resolved_by: "A fresh-context GitHub Codex L2 review was executed against merged commit b88e9edf and recorded as REVIEW-0003. That independent review found three new issues now tracked separately; final approval still requires re-review of their corrections."
  - id: F-6
    severity: R2_MAJOR
    category: PROCESS_DRIFT
    description: "The PR template still reflected the pre-assurance process and could let future contributors omit REQ/ASM/RISK, assurance, scientific validation and Review Council evidence."
    evidence: [".github/pull_request_template.md second-pass diff inspection"]
    disposition: RESOLVED
    resolved_by: "PR template synchronized with DoR, assurance, specification, scientific/backtest, NFR, threat-model, observability and hard-gate checks."
  - id: F-7
    severity: R3_MODERATE
