id: TEST-0005
name: "WORK-0001 evidence, authority and requirement-acceptance drill"
status: READY
type: MANUAL_E2E

protects:
  requirements: [REQ-0005, REQ-0010, REQ-0015, REQ-0016, REQ-0017, REQ-0018, REQ-0019, REQ-0020, REQ-0021, REQ-0022, REQ-0023, REQ-0024, REQ-0025]
  capabilities: []
  contracts:
    - "exact-SHA PASS evidence"
    - "review finding acceptance authority"
    - "atomic specification requirement ownership"
    - "requirement supersession traceability"
    - "pre-acceptance Review Council and cold-read gate"
    - "machine-enforced requirement acceptance preconditions"
    - "WORK-0001 corrective traceability"
  risks:
    - "Legacy unbound PASS is treated as current gating evidence"
    - "Blocking review finding is self-accepted without authority"
    - "A compound requirement hides partial specification failure"
    - "A superseded compound requirement remains an active normative owner or its replacement set is incomplete"
    - "A lifecycle-valid PROPOSED → ACCEPTED transition is performed before independent Review Council/cold-read evidence exists"
    - "A negative or out-of-scope review is mistaken for machine-valid requirement acceptance evidence"
  invariants:
    - "No active PASS state-bound test lacks an exact tested revision"
    - "An ACCEPTED R1/R2 finding cannot become non-blocking without explicit authority evidence"
    - "Independently fail-able specification obligations have distinct REQ identities"
    - "REQ-0005 remains superseded rather than silently narrowed"
    - "Prematurely accepted REQ-0020/REQ-0021/REQ-0022 remain historical SUPERSEDED records"
    - "Current AC-5 owners REQ-0023/REQ-0024/REQ-0025 remain PROPOSED throughout this pre-acceptance test"
    - "A post-v7 requirement reaches ACCEPTED only after required independent Review Council and cold-read evidence exists, not merely because PROPOSED → ACCEPTED is a legal transition"
    - "Under status-machine v8, only an approval-capable COMPLETE independent review that includes the requirement while PROPOSED plus an exact-revision PASS cold-read test that protects it can satisfy acceptance preconditions"

environment:
  kind: REAL_GITHUB_REPOSITORY
  real_dependencies:
    - "tobianahillel-afk/monde"
    - "PR #3"
    - "PR #3 Git history"
  mocked_dependencies: []

cases:
  happy_path:
    - "TEST-0001 is SUPERSEDED, preserves its historical execution fields, and points to revision-bound replacement TEST-0006 without inventing a commit SHA"
    - "registry/status-machines.yaml requires exact commit_sha for active state-bound PASS records"
    - "registry/reviews/_TEMPLATE.yaml carries structured acceptance authority fields"
    - "REVIEW-0001/F-3 records repository-owner acceptance authority and evidence"
    - "REQ-0010 owns atomic requirement identity/testability only"
    - "REQ-0015 through REQ-0019 separately own assumptions/risks, research, failure modes, cross-document consistency and traceability"
    - "REQ-0005 is SUPERSEDED and remains historically addressable"
    - "REQ-0020/REQ-0021/REQ-0022 are SUPERSEDED after their premature acceptance and each points to its proposed successor"
    - "REQ-0023 separately owns Definition of Ready and remains PROPOSED"
    - "REQ-0024 separately owns Definition of Done and remains PROPOSED"
    - "REQ-0025 separately owns verification strategy and remains PROPOSED"
    - "Git history proves REQ-0023/REQ-0024/REQ-0025 first materialized PROPOSED in 772616269581f622605416b2e34f6d4e270241df"
    - "WORK-0001 AC-5 active traceability reaches REQ-0023/REQ-0024/REQ-0025 and omits superseded REQ-0005/REQ-0020/REQ-0021/REQ-0022 from active ownership"
    - "AGENTS.md specification workflow requires Review Council hats and a cold-read before Accepted"
    - "status-machines v8 acceptance_preconditions requires a resolvable COMPLETE approval-capable independent REVIEW from verification.acceptance_evidence that includes the requirement while still PROPOSED"
    - "status-machines v8 acceptance_preconditions also requires a resolvable exact-revision PASS TEST from verification.test_ids that protects the requirement and ran while it was still PROPOSED"
    - "REVIEW-0018/F-1 and REVIEW-0024/F-1 are negative findings, so neither REVIEW-0018 nor REVIEW-0024 can satisfy the independent-approval half of v8 acceptance"
    - "This TEST-0005 execution is pre-acceptance cold-read evidence only and cannot itself supply independent review approval"
  edge_cases:
    - "Historical execution evidence remains inspectable even when its record is SUPERSEDED"
    - "An accepted requirement that later proves prematurely accepted is superseded through a legal forward transition rather than rolled back to PROPOSED"
    - "Proposed replacements may have complete text/test mappings while intentionally remaining non-Accepted until independent review"
    - "verification.acceptance_evidence may contain contextual docs or negative findings; only a qualifying approval-capable REVIEW record counts for the independent-review precondition"
  failure_modes:
    - "TEST status PASS with null state-bound execution.commit_sha"
    - "R1/R2 disposition ACCEPTED with missing authority evidence"
    - "REQ-0010 owns more than one independently fail-able obligation"
    - "REQ-0005 becomes active again after supersession"
    - "REQ-0020/REQ-0021/REQ-0022 remain active after REVIEW-0018"
    - "Any of REQ-0023/REQ-0024/REQ-0025 is ACCEPTED before an approval-capable independent review that actually inspected it while PROPOSED"
    - "A CHANGES_REQUIRED/BLOCKED review is treated as acceptance approval"
    - "A review that omitted the requirement from scope is treated as acceptance approval"
    - "A cold-read TEST that does not protect the requirement or ran after acceptance is treated as qualifying pre-acceptance evidence"
    - "Any of DoR, DoD or verification strategy lacks a proposed atomic owner"
    - "WORK-0001 active requirements omit a proposed AC-5 owner or still include a superseded predecessor"
  adversarial_cases:
    - "Attempt to roll REQ-0020/REQ-0021/REQ-0022 backward from ACCEPTED to PROPOSED and verify the lifecycle forbids it"
    - "Attempt to treat the prior TEST-0005 PASS on d4202e0f as sufficient acceptance evidence even though it ran after REQ-0020/21/22 acceptance"
    - "Attempt to accept REQ-0023/REQ-0024/REQ-0025 using REVIEW-0024/CHANGES_REQUIRED plus a lifecycle-valid edge and verify v8 rejects it"
    - "Attempt to accept a requirement with only author-produced PASS tests and no independent approval-capable review and verify v8 rejects it"
    - "Attempt to use an approval-capable review that inspected the requirement only after it was ACCEPTED and verify v8 rejects it"
    - "Satisfy Definition of Ready while violating Definition of Done and verify the obligations remain independently visible"
    - "Satisfy DoR and DoD while omitting verification-strategy rules and verify that omission remains independently visible"

