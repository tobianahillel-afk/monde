  edge_cases:
    - "Historical execution evidence remains inspectable even when its record is SUPERSEDED"
    - "An accepted requirement that later proves prematurely accepted is superseded through a legal forward transition rather than rolled back to PROPOSED"
    - "Proposed replacements may have complete text/test mappings while intentionally remaining non-Accepted until independent review"
  failure_modes:
    - "TEST status PASS with null state-bound execution.commit_sha"
    - "R1/R2 disposition ACCEPTED with missing authority evidence"
    - "REQ-0010 owns more than one independently fail-able obligation"
    - "REQ-0005 becomes active again after supersession"
    - "REQ-0020/REQ-0021/REQ-0022 remain active after REVIEW-0018"
    - "Any of REQ-0023/REQ-0024/REQ-0025 is ACCEPTED before the next approval-capable independent review"
    - "Any of DoR, DoD or verification strategy lacks a proposed atomic owner"
    - "WORK-0001 active requirements omit a proposed AC-5 owner or still include a superseded predecessor"
    - "Cold-read evidence is produced only after requirement acceptance"
  adversarial_cases:
    - "Attempt to roll REQ-0020/REQ-0021/REQ-0022 backward from ACCEPTED to PROPOSED and verify the lifecycle forbids it"
    - "Attempt to treat the prior TEST-0005 PASS on d4202e0f as sufficient acceptance evidence even though it ran after REQ-0020/21/22 acceptance"
    - "Attempt to accept REQ-0023/REQ-0024/REQ-0025 solely because this test passes, without a fresh approval-capable L2"
    - "Satisfy Definition of Ready while violating Definition of Done and verify the obligations remain independently visible"
    - "Satisfy DoR and DoD while omitting verification-strategy rules and verify that omission remains independently visible"

