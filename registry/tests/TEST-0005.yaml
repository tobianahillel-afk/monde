    - "registry/status-machines.yaml requires exact commit_sha for active state-bound PASS records"
    - "registry/reviews/_TEMPLATE.yaml carries structured acceptance authority fields"
    - "REVIEW-0001/F-3 records repository-owner acceptance authority and evidence"
    - "REQ-0010 owns atomic requirement identity/testability only"
    - "REQ-0015 through REQ-0019 separately own assumptions/risks, research, failure modes, cross-document consistency and traceability"
    - "REQ-0005 is SUPERSEDED and remains historically addressable"
    - "REQ-0020/REQ-0021/REQ-0022 are SUPERSEDED after their premature acceptance and each points to its proposed successor"
    - "REQ-0023 separately owns Definition of Ready and remains PROPOSED"
    - "REQ-0024 separately owns Definition of Done and remains PROPOSED"
    - "REQ-0025 separately owns verification strategy and remains PROPOSED"
    - "Git history proves REQ-0023/REQ-0024/REQ-0025 first materialized PROPOSED in 772616269581f622605416b2e34f6d4e270241df"
    - "WORK-0001 AC-5 active traceability reaches REQ-0023/REQ-0024/REQ-0025 and omits superseded REQ-0005/REQ-0020/REQ-0021/REQ-0022 from active ownership"
    - "AGENTS.md specification workflow requires Review Council hats and a cold-read before Accepted"
