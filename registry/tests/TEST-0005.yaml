  failure_modes:
    - "Any declared requirement digest differs from RFC 8785/JCS recomputation"
    - "A field included by REQUIREMENT_NORMATIVE_V1 changes but stale review/cold-read evidence is still accepted"
    - "A non-JCS serializer is allowed to choose alternate Unicode escaping, key ordering, number spelling or whitespace"
    - "A review has approval-capable outcome but omits or mismatches scope.requirement_revisions for the requirement"
    - "A generic PASS TEST in verification.test_ids is accepted as the cold-read half without being referenced by acceptance_cold_read_test_ids"
    - "A cold-read TEST qualifies without required source/executor/freshness/digest/outcome evidence"
    - "Any active AC-5 requirement is ACCEPTED before both exact-digest proof halves exist"
  adversarial_cases:
    - "Serialize a non-ASCII string once literally and once as a JSON Unicode escape and verify only RFC 8785/JCS bytes are conformant"
