  command_or_workflow: "Manual exact-SHA GitHub cold-read and cross-PR lifecycle consistency review of PR #3 synchronized tree 3b4477f00953f1a352fe7c40497853fc01e103b6, including live PR #2 head/state verification"
  last_run_at: "2026-09-10"
  commit_sha: "3b4477f00953f1a352fe7c40497853fc01e103b6"
  result: PASS
