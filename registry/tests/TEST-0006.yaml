id: TEST-0006
name: "Revision-bound bootstrap resume/status replacement and review-outcome drill"
status: PASS
type: MANUAL_E2E

protects:
  requirements: [REQ-0023, REQ-0024, REQ-0025]
  capabilities: []
  contracts:
    - "AI resume protocol"
    - "status vocabulary consistency"
    - "active work routing"
    - "review approval outcome semantics"
    - "historical test supersession coverage"
    - "cross-branch resume boundary"
    - "status-machine historical import/replay isolation"
    - "external completed-review provenance"
    - "transition-stable current-proof routing"
    - "atomic AC-5 replacement discoverability"
    - "pre-acceptance Review Council/cold-read sequencing"
  risks:
    - "AI resumes from stale or incomplete context"
    - "Unknown or competing status semantics cause governance drift"
    - "A negative COMPLETE review is treated as approval evidence"
    - "Superseding an unbound historical test drops its original coverage"
    - "An active work mirror references branch-only prerequisites that are unreadable in the current tree"
    - "Historical import/replay exceptions accidentally weaken normal review or requirement lifecycle semantics"
    - "An externally completed review is represented as repository-native lifecycle execution or is imported without truthful one-shot provenance"
    - "A handover sends a cold-resuming agent backward into administrative synchronization already complete at the tested SHA"
    - "WORK/PROJECT_STATE duplicates volatile TEST or PR heads and becomes stale immediately after evidence changes"
    - "Cold resume routes active ownership through superseded requirements or treats author test evidence as approval"
  invariants:
    - "Repository state, not chat history, is sufficient to resume active work"
    - "registry/status-machines.yaml is the single lifecycle source of truth"
    - "Only COMPLETE reviews with APPROVE or APPROVE_WITH_FOLLOWUP may provide approval evidence"
    - "A superseding test re-executes the protected behavior represented by the superseded test"
    - "Every current-tree read_before path is resolvable before an agent is instructed to edit; branch-only prerequisites become mandatory only after an explicit checkout handoff"
    - "Historical import/replay exceptions remain exact, historical-only and future-reuse-forbidden and do not alter generic initial states/transitions"
    - "Post-v7 external completed-review imports require a one-shot authorization that predates materialization and is bound to the exact import commit"
    - "PROJECT_STATE advances from the current review/test state and never orders a synchronization or evidence-recording step already complete at the tested SHA"
    - "The current TEST execution is authoritative in the TEST record; handover prose may retain reviewed baselines but does not become a second mutable result registry"
    - "Live PR #2 HEAD/check/thread truth is queried from GitHub rather than canonized as a volatile repository-state constant"
    - "REQ-0005 and prematurely accepted REQ-0020/REQ-0021/REQ-0022 remain historical/superseded while REQ-0023/REQ-0024/REQ-0025 are the active PROPOSED AC-5 owners"
    - "REQ-0023/REQ-0024/REQ-0025 remain PROPOSED until an approval-capable independent review inspects them"

