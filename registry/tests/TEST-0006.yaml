    - "TEST-0001 is SUPERSEDED and points to TEST-0006, whose protected contracts include every original TEST-0001 contract"
  edge_cases:
    - "A concurrently active work item on another PR is represented by one consistent global lifecycle while volatile live PR metadata remains external"
    - "A branch-specific prerequisite is not placed in current-tree read_before until the handoff branch containing it is checked out"
    - "A COMPLETE review with all findings resolved but outcome CHANGES_REQUIRED remains negative evidence and cannot approve"
    - "A COMPLETE review with outcome APPROVE_WITH_FOLLOWUP may approve only subject to other completion and blocking-finding rules"
    - "Historical import/replay exceptions can preserve immutable legacy history without changing generic lifecycle semantics"
    - "An externally completed negative review may be imported truthfully but remains negative evidence"
    - "Historical TEST-0001 remains inspectable while no longer serving as gating PASS evidence"
    - "A prior TEST-0006 PASS remains valid for its exact historical tree while a later handover edit can require a new current-head rerun"
    - "A prematurely accepted requirement remains inspectable as superseded history while a new owner remains PROPOSED"
  failure_modes:
    - "README/START_HERE does not route to the current project state and active work"
    - "PROJECT_STATE cannot identify current work and its next gate without chat history"
    - "PROJECT_STATE and WORK-0001 disagree on REVIEW-0018/current proof state"
    - "PROJECT_STATE instructs a cold-resuming agent to perform administrative or TEST transitions already complete at the tested SHA"
    - "PROJECT_STATE or WORK-0001 hardcodes a volatile current TEST result or PR #2 HEAD as a second mutable source of truth"
    - "PROJECT_STATE, WORK-0002 and matrix disagree on WORK-0002 lifecycle"
    - "A current-tree WORK-0002 read_before path does not resolve"
    - "The handoff to the WORK-0002 implementation branch is implicit or requires guessing"
    - "COMPLETE+CHANGES_REQUIRED or COMPLETE+BLOCKED can satisfy review completion"
    - "A historical import/replay exception authorizes a future record or weakens generic lifecycle"
    - "REVIEW-0018 authorization/import/binding/consumption do not agree"
    - "TEST-0001 is superseded by evidence that omits original protected contracts"
    - "WORK-0001 still uses superseded AC-5 owners or omits one of REQ-0023/REQ-0024/REQ-0025"
    - "REQ-0023/REQ-0024/REQ-0025 becomes ACCEPTED before the next approval-capable independent review"
  adversarial_cases:
    - "Resolve every PR #3 WORK-0002 read_before path at the exact tested SHA rather than assuming branch-local files exist"
    - "Verify branch-only prerequisites on feat/work-0002-governance-ci"
    - "Query live PR #2 and compare its lifecycle with synchronized WORK-0002/matrix state without requiring PROJECT_STATE to duplicate its volatile HEAD"
    - "Resolve every R1/R2 finding on a CHANGES_REQUIRED review and verify its negative outcome still prevents approval"
    - "Attempt to reuse a consumed v7 external-review authorization and verify the contract forbids it"
    - "Follow TEST-0001.supersession and compare original protected contracts/invariant with TEST-0006 coverage"
    - "Cold-read README then START_HERE/PROJECT_STATE/WORK-0001 and attempt to resume without conversation memory"
    - "Walk PROJECT_STATE Next action at READY/RUNNING/PASS and verify it continues from current TEST-0006 state instead of ordering a completed transition"
    - "Walk AC-5 ownership from WORK-0001 and verify active proposed owners are REQ-0023/REQ-0024/REQ-0025"
    - "Attempt to treat TEST-0005 PASS as approval authority and verify REQ-0023/24/25 remain PROPOSED"

