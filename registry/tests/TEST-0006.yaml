    - "WORK-0001 active requirements include REQ-0023/REQ-0024/REQ-0025 and omit superseded REQ-0005/REQ-0020/REQ-0021/REQ-0022 from active normative ownership"
    - "REQ-0023/REQ-0024/REQ-0025 are each PROPOSED and separately own DoR, DoD and verification strategy"
    - "TEST-0005 is PASS on exact pre-acceptance tree efd48467352c0ce4ec344ebe410fd9e98d938721 with history binding 79a95e7cda3b62b68208e333ddc1593c510167f7"
