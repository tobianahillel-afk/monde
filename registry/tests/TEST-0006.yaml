    - "registry/progress/matrix.yaml @ 3b4477f00953f1a352fe7c40497853fc01e103b6 mirrors WORK-0002 IN_REVIEW and points to registry/status-machines.yaml#progress without a duplicate vocabulary"
    - "registry/work-items/WORK-0001.yaml @ 3b4477f00953f1a352fe7c40497853fc01e103b6 remains IN_REVIEW and identifies TEST-0006 rerun plus fresh L2 as the remaining gate"
    - "registry/status-machines.yaml @ 3b4477f00953f1a352fe7c40497853fc01e103b6 restricts approval evidence to COMPLETE + APPROVE/APPROVE_WITH_FOLLOWUP and declares the TEST rerun lifecycle"
    - "registry/tests/TEST-0001.yaml @ 3b4477f00953f1a352fe7c40497853fc01e103b6 is SUPERSEDED by TEST-0006 with explicit original-scope replacement"
    - "README.md, AGENTS.md and docs/00_START_HERE.md @ 3b4477f00953f1a352fe7c40497853fc01e103b6 preserve the repository-first cold-resume route"
