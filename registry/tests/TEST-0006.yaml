    - "COMPLETE+CHANGES_REQUIRED or COMPLETE+BLOCKED can satisfy review completion"
    - "A historical import/replay exception adds a generic OPEN → COMPLETE review transition, alternate COMPLETE initial state, alternate ACCEPTED requirement initial state, or authorizes a future record"
    - "A post-v7 externally completed review is materialized before authorization, has mismatched provenance, or reuses a consumed authorization"
