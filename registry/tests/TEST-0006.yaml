    - "all progress/status values used by the inspected active routing are declared by the canonical lifecycle machine"
    - "registry/status-machines.yaml declares approval_capable_outcomes as APPROVE and APPROVE_WITH_FOLLOWUP only"
    - "review completion_rule explicitly rejects COMPLETE+CHANGES_REQUIRED/BLOCKED as approval evidence"
    - "status-machines v7 keeps generic review OPEN → IN_PROGRESS → COMPLETE and requirement PROPOSED → ACCEPTED semantics unchanged while isolating exact historical imports/replay"
