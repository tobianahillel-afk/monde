    - "REVIEW-0026 one-shot provenance is exact and all three findings remain OPEN"
    - "REQ-0023/24/25 remain PROPOSED with exact recomputable JCS normative digests"
    - "Each active requirement maps to TEST-0006 generally and TEST-0008 specifically for acceptance cold read"
    - "TEST-0008 protects all three requirements and remains qualifies=false before independent execution"
    - "TEST-0005 current proof is 27c4d591… PASS 786a759a… binding f6caaf77…"
    - "TEST-0007 current proof is b0d4b4f6… PASS 592b88eb… binding 8e5edd80…"
    - "REVIEW-0001/F-3 uses GITHUB_REPOSITORY_OWNER_PERMISSION with durable GitHub repo metadata URL and live owner/admin proof"
    - "WORK-0002 PR #3 mirror remains locally resolvable with affected_schemas [] and no branch-local proof IDs"
    - "After explicit PR #2 boundary, live PR #2 remains coherent and branch-local schemas/proof resolve there"
    - "REQ-0010 current proof remains TEST-0005 while TEST-0004 remains historical without reverse current coverage"
  edge_cases:
    - "A prior TEST-0006 PASS remains historical when REVIEW-0026 materially changes handover obligations"
    - "Evidence-link/history-only edits excluded by REQUIREMENT_NORMATIVE_V1 do not alter normative digests"
    - "A clean future review is not enough without TEST-0008; a clean TEST-0008 is not enough without approval-capable exact-digest review"
    - "After one qualifying current TEST-0006 PASS exists, handover skips administrative reruns and proceeds to frozen-candidate external review"
  failure_modes:
    - "WORK-0001 is malformed or disagrees with PROJECT_STATE on current work"
    - "PROJECT_STATE or WORK-0001 copies current TEST status/result/SHA as a second mutable source"
    - "Status-machine is not v9 or content/authority primitives are missing"
    - "REVIEW-0026 provenance disagrees or any F-1/F-2/F-3 is author-closed"
    - "Any active requirement is ACCEPTED or has a non-recomputing normative digest"
    - "Any active requirement omits TEST-0006 general mapping or TEST-0008 acceptance-cold-read mapping"
    - "TEST-0008 qualifies without real fresh-context source/executor/outcomes"
    - "TEST-0005 or TEST-0007 current proof chain is absent/unresolvable"
    - "REVIEW-0001/F-3 authority_evidence_ref is self-referential or does not establish owner authority"
    - "PR #3 WORK-0002 mirror exposes branch-local proof IDs or schemas before checkout"
    - "TEST-0004 claims current REQ-0010 reverse coverage"
    - "Live PR #2 is treated as a hardcoded stale repository constant"
  adversarial_cases:
    - "Independently parse exact current WORK-0001 YAML; if parse cannot be executed in the current runtime, keep that as an explicit external L2 gate rather than claim success"
    - "Recompute all three REQUIREMENT_NORMATIVE_V1 digests under RFC 8785/JCS from exact current requirement records"
    - "Attempt to use TEST-0005/TEST-0006 as acceptance cold-read evidence and verify v9 rejects that path"
    - "Attempt A3/R2 finding acceptance as WORK_OWNER or with self-referential authority evidence and verify rejection"
    - "Traverse each REQ-0023/24/25 → TEST-0006 and TEST-0008, then TEST-0006/0008 → all three"
    - "Resolve REVIEW-0026 authorization → import → binding → consumption from exact Git history"
    - "Query live PR #2 only after crossing the explicit branch boundary"

