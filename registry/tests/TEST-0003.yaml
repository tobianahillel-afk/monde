id: TEST-0003
name: Governance real-repository GitHub control-plane execution
status: PASS
type: REAL_SYSTEM_E2E
protects:
  requirements: []
  capabilities: []
  contracts:
  - MONDE GitHub control plane
  - stable merge gate
  - real repository governance execution
  risks:
  - fixtures pass while actual repository/workflow fails
  - stale PR state is mistaken for merge truth
  - supply-chain hardening breaks reproducibility
location:
  test_path: .github/workflows/governance.yml
  suite: MONDE Gate
environment:
