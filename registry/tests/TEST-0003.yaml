cases:
  happy_path:
  - hash-locked governance toolchain installs
  - deterministic governance and mutation smoke pass
  - base-to-head guard and context manifest execute
  - Dependency Review and CodeQL execute when applicable
  - final gate evaluates lane results and live GitHub state
  - repository-owner identity and admin permission are checked against the actual workflow repository
  - durable WORK open-findings count matches live unresolved review threads
  failure_modes:
  - coverage/governance/change guard failure
  - unresolved live review threads on ready PR
  - missing trusted context-separated L2/L3 APPROVED review on the exact current PR HEAD
  - HEAD mismatch or non-mergeable PR
  - dependency/code-scanning failure
  adversarial_cases:
  - draft PR defers live merge eligibility without pretending final approval
  - current execution evidence cannot be transferred to another SHA
  - resolved review threads without a trusted context-separated L2/L3 exact-HEAD approval remain merge-ineligible
  - a shallow exact-HEAD approval from an untrusted or non-context-separated account remains merge-ineligible
execution_definition:
  workflow: .github/workflows/governance.yml
