id: TEST-0002
name: "Governance deterministic unit and branch suite"
status: PASS
type: UNIT_INTEGRATION

protects:
  requirements: []
  capabilities: []
  contracts:
    - "repository governance validation"
    - "registry status/reference/path integrity"
    - "work dependency and completion gates"
    - "repository path containment"
  risks:
    - "validator silently accepts malformed repository state"
    - "100 percent coverage is achieved without failure-path coverage"
    - "declared or Markdown paths escape repository root"
  invariants:
    - "deterministic governance rules return actionable failures"
    - "repository-declared paths remain inside repository root"

location:
  test_path: tests/governance/
  suite: governance

environment:
  kind: GITHUB_ACTIONS_AND_ISOLATED_FIXTURES
  real_dependencies:
    - "GitHub Actions Python 3.13.15 runner"
  mocked_dependencies: []

cases:
  happy_path:
    - "clean representative repository passes"
    - "valid task dependencies and future review dates pass"
    - "valid in-repository YAML and Markdown paths pass"
  edge_cases:
    - "template registry files are ignored"
    - "terminal work cannot remain active"
    - "relative Markdown anchors/external URLs are ignored correctly"
    - "non-mapping progress states are detected"
    - "symlink resolution is checked against repository boundary"
  failure_modes:
    - "YAML parse errors"
    - "invalid record shape/id prefix/duplicate id/status"
    - "unknown registry references"
    - "missing or malformed read_before/affected paths"
    - "work dependency cycles and invalid task/run references"
    - "incomplete DONE work"
    - "overdue/invalid assumption and risk dates"
    - "canonical TODO/TBD/FIXME and broken Markdown links"
    - "missing/inconsistent progress matrix"
    - "missing/stale/unknown active project work"
    - "absolute, traversal and symlink path escape"
    - "Markdown path escape"
  adversarial_cases:
    - "malformed scalar/list structures where mappings are expected"
    - "duplicate stable IDs"
    - "bogus status values"
    - "../ traversal"
    - "absolute filesystem paths"
    - "in-repository symlink resolving outside root"

execution:
  command_or_workflow: "python -m pytest --cov=tools.governance --cov-branch --cov-report=term-missing --cov-fail-under=100"
