id: TEST-0007
name: "Progress reopening, historical migration/import/replay and external review provenance drill"
status: READY
type: MANUAL_E2E

protects:
  requirements: [REQ-0006]
  capabilities: []
  contracts:
    - "registry lifecycle/status-machine contract"
    - "progress reopening semantics"
    - "test execution lifecycle"
    - "exact historical transition migration exceptions"
    - "exact historical registry-import exceptions"
    - "exact historical review-replay exceptions"
    - "preauthorized one-shot external review imports"
    - "bidirectional requirement/test traceability"
    - "machine-enforced requirement acceptance preconditions"
    - "risk acceptance authority contract"
  risks:
    - "Truthful reopened evidence cannot be represented because DONE progress is terminal"
    - "Historical lifecycle violations are silently accepted or generalized into future shortcuts"
    - "A migration/import/replay exception matches more history than the exact legacy record/commit it is intended to preserve"
    - "An externally completed review is made to look repository-native by replaying statuses after its findings/outcome already exist"
    - "A future external review can be imported COMPLETE without an earlier authorization, or one authorization can be reused"
    - "Post-contract accepted requirements first materialized as ACCEPTED are rejected by accumulated-history validation or normalized into an alternate initial state"
    - "Forward traceability from REQ-0006 omits the current lifecycle-history proof"
    - "A lifecycle-valid requirement ACCEPTED transition bypasses independent review/cold-read evidence"
    - "A critical risk can be marked ACCEPTED without durable accepting-authority evidence"
  invariants:
    - "New adverse evidence can reopen DONE progress to IN_REVIEW without rewriting history"
    - "Reopening requires an explicit evidence/review trigger and normal gates before returning to DONE"
    - "Generic TEST transitions still require PLANNED → READY → RUNNING → PASS"
    - "The TEST-0004 legacy exception applies only to its exact immutable PLANNED → PASS commit edge"
    - "Review historical imports apply only to REVIEW-0004..REVIEW-0013 at their exact introduction commits; OPEN remains the initial review state and OPEN → IN_PROGRESS → COMPLETE remains the normal repository-native execution path"
    - "Requirement historical imports apply only to REQ-0015..REQ-0019 at exact commit 2712795dc9f10c1efed2088313d125f6f915cc98; PROPOSED remains the initial requirement state"
    - "REVIEW-0014's post-hoc OPEN/IN_PROGRESS replay is preserved only by one exact historical replay exception and never treated as execution-time lifecycle evidence"
    - "Externally completed reviews after v7 are imported COMPLETE only when their one-shot authorization exists in an earlier parent commit and is bound to the actual import commit afterward"
    - "REQ-0006 verification points to TEST-0007 and TEST-0007 protects REQ-0006 so forward and reverse traceability both reach the current proof"
    - "Status-machine v8 makes requirement acceptance evidence-bearing rather than validating only the PROPOSED → ACCEPTED edge"
    - "Status-machine v8 makes risk acceptance authority-bearing, and the risk template can represent every required authority field"

environment:
  kind: REAL_GITHUB_REPOSITORY
  real_dependencies:
    - "tobianahillel-afk/monde"
    - "PR #3 commit history"
    - "GitHub Codex review metadata for REVIEW-0014 through REVIEW-0024"
  mocked_dependencies: []

cases:
  happy_path:
    - "registry/status-machines.yaml allows progress DONE → IN_REVIEW and documents why a reviewed reopening is allowed"
    - "The historical WORK-0001/quality-dimension DONE → IN_REVIEW changes in commit 4ef4bfd27e28973fcebead8b2b5065422c4a8883 are representable under the reopening rule"
    - "Generic TEST transitions keep PASS reachable only from RUNNING"
    - "The TEST-0004 exception names record TEST-0004, from PLANNED, to PASS, before commit 98e8cdccc07bd3c2d8313d81f296f49c97c44379 and transition commit e8337d833ca0b524bed69318ca4b3691c9ce6c23"
    - "The exact Git history confirms TEST-0004 was PLANNED before e8337d833ca0b524bed69318ca4b3691c9ce6c23 and PASS at that transition"
    - "The review historical_import_exceptions enumerate REVIEW-0004 through REVIEW-0013 with their exact introduction commits and do not alter the generic review transition table"
    - "The requirement historical_import_exceptions enumerate only REQ-0015 through REQ-0019, each as ACCEPTED at exact introduction commit 2712795dc9f10c1efed2088313d125f6f915cc98"
    - "The historical_replay_exceptions contains exactly REVIEW-0014 with external source review PRR_kwDOUUI5ts8AAAABNFU66A and immutable sequence ec69110468c7e1cd79984dedb835504de8c0b561 → 2926a070de8371e7ad3aaebeca0d9e424700d43f → b03880759f7dde54b6f59f3ecaf4f2d5889e1eb7"
    - "Git history and REVIEW-0014 content confirm the first OPEN materialization already contained the final findings/outcome, so the contract correctly classifies that sequence as a historical replay rather than normal execution"
    - "REVIEW-0024 external-import authorization first exists in commit 44d465628e88d98f85414d565ef51e110fb1e891 before REVIEW-0024 first appears in 0b2ee6f13430d367c99dde55c6be726c13ab561a"
    - "REVIEW-0024 external_import references authorization 44d465628e88d98f85414d565ef51e110fb1e891 and actual import commit 0b2ee6f13430d367c99dde55c6be726c13ab561a"
    - "The REVIEW-0024 one-shot authorization is consumed_by_commit 0b2ee6f13430d367c99dde55c6be726c13ab561a, preventing reuse"
    - "registry/requirements/REQ-0006.yaml verification.test_ids contains TEST-0007 and acceptance_evidence includes TEST-0007"
    - "TEST-0007 protects.requirements contains REQ-0006, making the current proof bidirectionally traceable"
    - "Status-machine v8 requirement acceptance_preconditions requires both a qualifying approval-capable independent REVIEW and exact-revision pre-acceptance PASS TEST evidence"
    - "Status-machine v8 risk acceptance_preconditions requires accepted flag, accepting actor, authority role, non-empty authority evidence, rationale, acceptance time and review/expiry condition"
    - "registry/risks/_TEMPLATE.yaml exposes accepted_by, authority_role, authority_evidence, acceptance_rationale, accepted_at and review_condition under resolution"
    - "The risk acceptance rule requires authority appropriate to risk severity/category and affected-work assurance policy rather than trusting the risk author"
  edge_cases:
    - "A reopened DONE dimension remains IN_REVIEW until its normal gate is re-satisfied"
    - "An exact migration/import/replay exception preserves immutable history without asserting checkpoints that did not actually occur"
    - "REVIEW-0003, introduced in the same bootstrap commit that established the lifecycle machine, is baseline state rather than a post-contract import exception"
    - "An externally completed negative review may be imported as COMPLETE but remains negative evidence and cannot approve work or requirement acceptance"
    - "Historical TEST-0004 may remain as prior evidence while current lifecycle proof is separately reachable through TEST-0007"
    - "A risk author may also be an authorized accepting actor only when durable authority evidence proves that role; authorship alone is never authority"
  failure_modes:
    - "DONE progress can only deprecate and cannot re-enter review after new adverse evidence"
    - "DONE → IN_REVIEW is allowed without any trigger/rationale requirement"
    - "PLANNED → PASS appears in the generic TEST transition table"
    - "A generic OPEN → COMPLETE review transition is added instead of exact historical/import provenance"
    - "COMPLETE is made an alternate initial review state"
    - "A REVIEW-0004..0013 import exception omits exact record/status/introduction commit or permits future reuse"
    - "REVIEW-0014 is treated as normal execution merely because statuses were replayed in syntactically valid order"
    - "REVIEW-0014's replay exception can authorize any other review or commit sequence"
    - "REVIEW-0024 is materialized before its authorization exists in Git history"
    - "REVIEW-0024 authorization source review/artifact/outcome does not match the imported record"
    - "REVIEW-0024 authorization remains unconsumed, is bound to a different import commit, or can be consumed twice"
    - "ACCEPTED is made an alternate initial requirement state or a requirement may be created directly ACCEPTED without an exact historical import exception"
    - "A requirement import exception applies beyond REQ-0015..REQ-0019 or beyond exact commit 2712795dc9f10c1efed2088313d125f6f915cc98"
    - "A requirement reaches ACCEPTED with no approval-capable independent review while lifecycle validation still succeeds"
    - "A requirement reaches ACCEPTED using a CHANGES_REQUIRED/BLOCKED review or a review that did not inspect it while PROPOSED"
    - "A risk reaches ACCEPTED with resolution.accepted=false or missing accepting actor/authority role/authority evidence/rationale/time/review condition"
    - "A critical security risk is accepted solely by its author with no durable evidence that the author holds the policy-required authority"
    - "TEST-0007 protects REQ-0006 but REQ-0006 verification does not point back to TEST-0007"
  adversarial_cases:
    - "Attempt to apply the TEST-0004 exception to another TEST record or another commit pair and verify the contract forbids it"
    - "Attempt to apply a REVIEW-0004..0013 import exception or REVIEW-0014 replay exception to a future review and verify the contract forbids it"
    - "Attempt to reuse REVIEW-0024's consumed one-shot authorization for another import and verify the contract forbids it"
    - "Inspect Git ancestry to prove 44d465628e88d98f85414d565ef51e110fb1e891 predates 0b2ee6f13430d367c99dde55c6be726c13ab561a rather than trusting current prose"
    - "Attempt to introduce a new requirement directly ACCEPTED and verify none of the REQ-0015..0019 exceptions authorizes it"
    - "Attempt PROPOSED → ACCEPTED with only author-produced tests and no qualifying independent approval review and verify v8 rejects it"
    - "Attempt RISK OPEN → ACCEPTED with a rationale but no accepted_by/authority_role/authority_evidence and verify v8 rejects it"
    - "Attempt to satisfy risk authority by naming an arbitrary role without non-empty authority evidence and verify v8 rejects it"
    - "Start a forward traceability walk at REQ-0006 and verify it reaches TEST-0007 without relying on TEST-0007's reverse declaration"

execution:
  command_or_workflow: "Pending exact-SHA audit of lifecycle v8, REVIEW-0024 provenance, requirement acceptance preconditions and risk acceptance authority"
  last_run_at: null
  commit_sha: null
  result: null
  evidence: []

coverage:
  line_contribution: NOT_APPLICABLE_NO_EXECUTABLE_CODE
  branch_contribution: NOT_APPLICABLE_NO_EXECUTABLE_CODE

