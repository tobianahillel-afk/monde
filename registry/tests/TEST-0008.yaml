id: TEST-0008
name: "Fresh-context requirement acceptance cold read"
status: PLANNED
type: MANUAL_COLD_READ

protects:
  requirements: [REQ-0023, REQ-0024, REQ-0025]
  capabilities: []
  contracts:
    - "requirement normative content identity"
    - "fresh-context requirement acceptance cold read"
    - "content-bound requirement acceptance evidence"
  risks:
    - "A requirement is accepted using review/test evidence for an older normative revision"
    - "An author-run generic PASS test is mistaken for an independent cold read"
    - "A cold-read record omits explicit outcomes or fresh-context provenance"
  invariants:
    - "REQ-0023/REQ-0024/REQ-0025 remain PROPOSED during the cold read"
    - "Each covered requirement digest matches REQUIREMENT_NORMATIVE_V1 recomputation on the exact execution tree"
    - "A qualifying cold read is executed in an L2/L3 context separated from the authoring context"
    - "Every v9 required cold-read outcome is explicitly PASS before this test may qualify or become PASS"

location:
  test_path: null
  suite: "governance requirement acceptance cold-read"

environment:
  kind: REAL_GITHUB_REPOSITORY
  real_dependencies:
    - "tobianahillel-afk/monde"
    - "PR #3 exact frozen candidate"
    - "independent fresh-context reviewer"
  mocked_dependencies: []

cases:
  happy_path:
    - "A fresh-context L2/L3 reviewer reads the exact proposed requirement revision without relying on author reasoning and records explicit PASS outcomes"
    - "The reviewer/review record and TEST-0008 bind the same REQUIREMENT_NORMATIVE_V1 digest for each requirement"
  edge_cases:
    - "Evidence-link or lifecycle-only edits excluded by REQUIREMENT_NORMATIVE_V1 do not invalidate an otherwise identical normative digest"
  failure_modes:
    - "Any included normative field changes after the review/cold read but stale evidence is reused"
    - "Executor context is missing, same-context, below L2, or not authoring-separated"
    - "Source review identity/time is missing or unresolvable"
    - "Any required outcome is absent, non-PASS, or all_required_outcomes_pass is false"
    - "Any covered requirement is not PROPOSED on the execution tree"
    - "Any declared content digest fails recomputation"
  adversarial_cases:
    - "Change normative_statement after a clean read and verify the old digest no longer qualifies"
    - "Change depends_on or verification.method after a clean read and verify the old digest no longer qualifies"
    - "Use a generic author-run PASS TEST with no acceptance_cold_read qualification and verify v9 rejects it"

