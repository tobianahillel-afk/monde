id: TEST-0009
name: "Stale-green bootstrap control-plane contract"
status: PLANNED
type: INTEGRATION
protects:
  requirements: [REQ-0026]
  capabilities: []
  contracts: ["GitHub control-plane merge gate"]
  risks: []
  invariants:
    - "stale merge-acceptable canonical gate is invalidated when current PR review threads are unresolved"
    - "merge-state authority is the exact latest GitHub Actions-owned MONDE / Merge Gate check on the exact head SHA"
    - "rerun authority is positively bound to the current open PR through canonical refs/pull/<N>/merge metadata"
    - "mutation-path target discovery is bounded through exact check candidates plus direct run and job validation; exhaustive Actions history is not required"
    - "stable open Pull Requests authority uses unique PR numbers and identical authority snapshots"
    - "scheduler fairness uses a durable closed-world cursor in machine-managed issue #7 rather than wall-clock rotation"
    - "only selected PRs are revalidated directly; no per-head global open-PR refresh is required"
    - "one invocation inspects at most seven head groups and schedules at most three reruns"
    - "the authority adapter hard-caps script-issued GitHub calls at 100 and reserves mutation/post-condition headroom"
    - "a rerun is not accepted as invalidation until a new exact-head required check is observed and is non-merge-acceptable or non-completed"
    - "if a shared-head sibling becomes clean and its rerun returns green, processing continues to another sibling that is still unresolved"
    - "malformed REST, GraphQL, Checks, run, job, scheduler-state, or PR authority fails closed"
location:
  test_path: ".github/scripts/test_stale_green_bootstrap*.py"
  suite: "MONDE Stale-Green Bootstrap / Bootstrap self-test + Bootstrap GitHub contract probe"
environment:
  kind: GITHUB_ACTIONS
  real_dependencies:
    - "GitHub REST Actions, Checks, Pull Requests and Issues APIs"
    - "GitHub GraphQL reviewThreads API"
  mocked_dependencies:
    - "adversarial fixtures for authority drift, shared heads, budget exhaustion, malformed metadata, durable cursor progression, bounded target lookup and rerun post-conditions"
cases:
  happy_path:
    - "PR-bound direct check -> run -> protected job authority resolves without exhaustive workflow-run history"
    - "live PR #2 probe observes refs/pull/2/merge authority and current unresolved-thread state"
    - "durable scheduler cursor advances across bounded head groups"
  edge_cases:
    - "multiple open PRs share one SHA with divergent or changing review-thread state"
    - "a first sibling becomes clean after rerun while another same-head sibling remains unresolved"
    - "large open-PR sets do not require a second global refresh before mutation"
    - "budget approaches reserved mutation headroom"
    - "candidate check list contains terminal and non-terminal checks"
  failure_modes:
    - "scheduler issue identity/body is modified outside the closed-world contract"
    - "direct run or protected job metadata does not match expected workflow, head, attempt, or PR authority"
    - "bounded rerun fails to publish a new required-check post-condition"
    - "no bounded canonical target exists for an unresolved open PR"
    - "request budget cannot preserve reserved mutation/post-condition headroom"
  adversarial_cases:
    - "historically deep Actions data cannot force recursive exhaustive target reconstruction because the mutation path no longer performs it"
    - "skipped or delayed schedules do not reset fairness because cursor state is durable"
    - "shared-head green revival is followed by current thread reclassification and continuation to another unresolved sibling"
    - "dead/unreachable guard code is removed rather than artificially covered"
