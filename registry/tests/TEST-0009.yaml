id: TEST-0009
name: "Stale-green bootstrap control-plane contract"
status: PLANNED
type: INTEGRATION
protects:
  requirements: [REQ-0026]
  capabilities: []
  contracts: ["GitHub control-plane merge gate"]
  risks: []
  invariants:
    - "stale merge-acceptable canonical gate is invalidated when current PR review threads are unresolved"
    - "merge-state authority is the exact latest GitHub Actions-owned MONDE / Merge Gate check on the exact head SHA"
    - "when GitHub filter=latest returns multiple legitimate MONDE / Merge Gate checks from distinct check suites on one unchanged head, every candidate is validated and the newest started_at/check-id candidate is selected deterministically"
    - "filtered required-check authority is collected completely across bounded 100-record pages before selecting an effective check; total-count drift, cross-page duplicate ids, incomplete pages or pagination beyond the configured bound fail closed"
    - "after fetching each additional filtered required-check page, the previous page identity/order is revalidated so offset-page membership drift fails closed even when total_count and global uniqueness remain unchanged"
    - "before returning any multi-page filtered required-check collection, every fetched page identity/order is revalidated again so drift after an earlier adjacent check cannot survive a 3+ page traversal"
    - "paginated check-runs are candidate discovery only: any merge-acceptable candidate must bind to its exact current Actions run/job/attempt and be the newest protected MONDE Gate job by started_at/id among canonical same-head current attempts existing no later than an authority frontier captured after candidate discovery"
    - "every protected MONDE Gate job used in attempt-aware authority must start at or after its current workflow attempt run_started_at; malformed cross-object chronology fails closed before authority ordering"
    - "candidate authority is bound to an exact protected-job terminal snapshot across direct and frontier reads; status, conclusion or completed_at drift fails closed even when run/job id and started_at remain unchanged"
    - "every protected MONDE Gate job used in authority is fully contained by its current run lifetime: job.started_at cannot exceed run.updated_at and completed job completed_at cannot exceed run.updated_at"
    - "every current required-check candidate has a parseable temporally valid snapshot before selection: started_at is valid, completed checks have completed_at >= started_at, and incomplete checks do not carry completed_at; the selected merge-acceptable candidate completes no later than the captured authority frontier and its started_at/completed_at bind exactly to the direct protected Actions job"
    - "after target-run mutation baseline plus final PR/thread revalidation and immediately before durable pending write, global required-check authority is re-proved and must remain merge-acceptable with the exact pending_check_id; any authority advancement/change emits no pending write and no rerun POST, and the full mutation reserve must still remain after this final proof"
    - "rerun authority is positively bound to the current open PR through canonical refs/pull/<N>/merge metadata plus the current merge-ref SHA"
    - "selected-PR target discovery is bounded and durably resumable through scan_pr/scan_page/scan_anchor state rather than a permanently truncated candidate prefix"
    - "offset check-history pagination verifies page-boundary membership both across invocations and between consecutive pages inside one invocation before accepting completeness"
    - "direct run/workflow/job/attempt, scheduler-issue, pending-PR and recovery-input authority require exact positive non-Boolean integer identifiers"
    - "stable open Pull Requests authority uses unique PR numbers and identical authority snapshots"
    - "current PR revalidation binds head identity, base repository/ref/SHA, and merge_commit_sha immediately before mutation and before post-condition acceptance"
    - "scheduler fairness uses a durable closed-world cursor in machine-managed issue #7 rather than wall-clock rotation"
    - "scheduled poll mutation and manual recovery inspection share the bootstrap concurrency group, while recovery inspection has no scheduler-state write authority"
    - "only selected PRs are revalidated directly; no per-head global open-PR refresh is required"
    - "one poll invocation inspects at most seven head groups and performs at most three actual rerun POSTs"
    - "the authority adapter hard-caps script-issued GitHub calls at 100 and reserves mutation/post-condition/state-write headroom"
    - "a rerun is not accepted as invalidation until the mutation baseline identifies one exact next workflow attempt, its protected job is validated, and the effective exact-head required check is causally bound and terminal"
    - "before rerun POST, issue #7 durably records pending selected-PR authority, exact pending head, run_id, baseline attempt and prior check identity"
    - "while pending mutation state exists, a later schedule resumes observation and does not issue another rerun POST"
    - "origin-PR closure cannot erase an already-issued pending mutation; exact pending head/run/check authority survives until terminal accounting"
    - "terminal merge-acceptable closed-origin reruns reclassify current same-head PRs before pending state is released"
    - "an ambiguous POST result retains pending state and fails closed rather than automatically replaying the mutation"
    - "after durable pending state is written and a rerun POST may have succeeded, every non-terminal post-condition RuntimeError preserves pending authority and fails loud rather than entering the ordinary head-error/idle-state path"
    - "the complete interval from acknowledged pending write until acknowledged safe clear is protected: generic RuntimeError while pending remains active becomes pending uncertainty, while errors after a confirmed clear retain ordinary handling"
    - "an exception while acknowledging an attempted pending-state write is treated as pending uncertainty before any rerun POST, because the remote PATCH may already have committed even when local acknowledgement failed"
    - "bounded pending observation failure is loud and leaves durable state intact instead of silently succeeding"
    - "operator recovery inspection requires an exact durable pending tuple plus explicit confirmation and reason, and unchanged run-attempt/effective-check identity only to identify the intended pending record; the pending record remains unchanged"
    - "operator recovery has neither actions:write nor issues:write permission, cannot call scheduler-state writes, and cannot itself rerun a workflow"
    - "if a completed rerun is already stale-green again, the selected PR/head remains selected for immediate or durable reprocessing"
    - "if a shared-head sibling becomes clean and its rerun returns green, processing continues safely while respecting the invocation-wide POST cap"
    - "pending PR authority accepts only exact open/closed state; malformed state or changed authority fails closed"
    - "malformed REST, GraphQL, Checks, run, job, scheduler-state, PR, or recovery authority fails closed"
    - "multiple required-check candidates with duplicate ids, malformed identity, wrong app/name/head, invalid status/conclusion, or missing/unparseable recency metadata fail closed"
location:
  test_path: ".github/scripts/test_stale_green_bootstrap.py; .github/scripts/test_stale_green_bootstrap_incarnation.py; .github/scripts/test_stale_green_bootstrap_run_created_at.py; .github/scripts/test_stale_green_bootstrap_merge_acceptable.py; .github/scripts/test_stale_green_bootstrap_filtered_search.py; .github/scripts/test_stale_green_bootstrap_poll_order.py; .github/scripts/test_stale_green_bootstrap_pr_snapshot.py; .github/scripts/test_stale_green_bootstrap_progress.py; .github/scripts/test_stale_green_bootstrap_progress_fallthrough.py; .github/scripts/test_stale_green_bootstrap_authority.py; .github/scripts/test_stale_green_bootstrap_authority_edges.py; .github/scripts/test_stale_green_bootstrap_authority_shared.py; .github/scripts/test_stale_green_bootstrap_authority_review0046.py; .github/scripts/test_stale_green_bootstrap_authority_review0047.py; .github/scripts/test_stale_green_bootstrap_authority_terminal_wait.py; .github/scripts/test_stale_green_bootstrap_authority_review0048.py; .github/scripts/test_stale_green_bootstrap_authority_review0048_edges.py; .github/scripts/test_stale_green_bootstrap_authority_review0048_final.py; .github/scripts/test_stale_green_bootstrap_authority_review0049.py; .github/scripts/test_stale_green_bootstrap_authority_review0049_edges.py; .github/scripts/test_stale_green_bootstrap_authority_review0049_final_edges.py; .github/scripts/test_stale_green_bootstrap_authority_review0050.py; .github/scripts/test_stale_green_bootstrap_authority_review0050_edges.py; .github/scripts/test_stale_green_bootstrap_authority_review0050_recovery.py; .github/scripts/test_stale_green_bootstrap_authority_review0050_recovery_edges.py; .github/scripts/test_stale_green_bootstrap_authority_review0051_recovery.py; .github/scripts/test_stale_green_bootstrap_authority_review0054.py; .github/scripts/test_stale_green_bootstrap_authority_review0055.py; .github/scripts/test_stale_green_bootstrap_authority_review0056.py; .github/scripts/test_stale_green_bootstrap_authority_review0059.py; .github/scripts/test_stale_green_bootstrap_authority_review0060.py; .github/scripts/test_stale_green_bootstrap_authority_review0061.py; .github/scripts/test_stale_green_bootstrap_authority_review0062.py; .github/scripts/test_stale_green_bootstrap_authority_review0063.py; .github/scripts/test_stale_green_bootstrap_authority_review0064.py; .github/scripts/test_stale_green_bootstrap_authority_review0065.py"
  suite: "MONDE Stale-Green Bootstrap / Bootstrap self-test + Bootstrap GitHub contract probe"
environment:
  kind: GITHUB_ACTIONS
  real_dependencies:
    - "GitHub REST Actions, Checks, Pull Requests and Issues APIs"
    - "GitHub GraphQL reviewThreads API"
    - "GitHub workflow_dispatch and concurrency semantics for the trusted recovery surface"
  mocked_dependencies:
    - "adversarial fixtures for delayed reruns, exact attempt attribution, write-ahead pending mutation, closed-origin pending observation, pre-POST recovery ambiguity, shared-head stale-again interleavings, pagination drift, malformed metadata, base retargeting, anchored durable cursor progression/continuation, global rerun caps, request reserves and terminal post-conditions"
cases:
  happy_path:
    - "PR-bound direct check -> run -> protected job authority resolves without exhaustive workflow-run history"
    - "live PR #2 probe observes refs/pull/2/merge plus current merge-ref authority and current unresolved-thread state"
    - "live PR #2 probe remains valid after multiple supported review-triggered MONDE Gate runs create more than one legitimate latest check suite"
    - "durable scheduler cursor advances across bounded head groups and target-history pages with anchored continuation"
    - "write-ahead pending mutation is durably acknowledged before rerun POST and clears only after terminal observation"
    - "closed-origin pending mutation remains observable through exact pending head/run/attempt/check identity"
    - "operator-confirmed unposted intent can be inspected through an exact-tuple read-only path that preserves issue #7 and prints the exact canonical run for manual rerun"
  edge_cases:
    - "multiple open PRs share one SHA with divergent or changing review-thread state"
    - "review/review-comment reruns create multiple legitimate MONDE / Merge Gate check suites for one unchanged head SHA"
    - "one unchanged head accumulates more than 100 legitimate MONDE / Merge Gate check suites and the effective check lies beyond page 1"
    - "offset check pagination misses a newly-created effective check, but that check belongs to a newer canonical workflow run created before the captured authority frontier"
    - "an older workflow-run id is rerun after a newer run id was created; its newer current attempt/protected gate job remains eligible authority when that job is the newest by started_at/id"
    - "a competitor current attempt is newer by run_started_at but exposes an impossible earlier protected-job started_at; authority refuses instead of under-ranking the competitor"
    - "candidate protected job keeps the same run/job id and started_at but its frontier reread changes success to failure, completed to in_progress, or completed_at; authority refuses the stale candidate snapshot"
    - "candidate or competitor protected job has an impossible start or completion after current run.updated_at; authority fails closed before the impossible timestamp can over-rank a valid job"
    - "a current required-check candidate has missing/malformed completed_at, completes before it starts, or an incomplete candidate carries completed_at; the collection fails closed before candidate selection"
    - "the selected merge-acceptable required check completes after the captured frontier or disagrees with the direct protected job start/completion timing; authority fails closed"
    - "selected rerun completes merge-acceptable while the PR becomes unresolved again before final observation"
    - "another actor reruns the same workflow between discovery and this invocation's mutation"
    - "a different canonical Gate run becomes authoritative after the earlier latest-check proof but before pending write while target-run baseline, PR identity and unresolved threads remain unchanged; final mutation-bound authority reproof refuses both pending write and rerun POST"
    - "selected PR target lies behind more than twelve newer sibling checks"
    - "retained check-history membership changes between continuation invocations or between two pages read in one invocation"
    - "PR base or merge-ref context changes while head SHA remains unchanged"
    - "rerun remains queued or running beyond the local post-condition polling window"
    - "POST succeeds but its next attempt/check is not visible before the next scheduled invocation"
    - "pending write succeeds but POST outcome is ambiguous or POST may not have occurred"
    - "pending-state PATCH outcome is ambiguous because remote mutation may have committed but the returned acknowledgement is malformed or unavailable"
    - "origin PR closes while its already-issued rerun remains delayed or in flight"
    - "operator recovery runs after origin PR closes while an unresolved same-head sibling exists"
    - "budget approaches reserved mutation/post-condition/state-write headroom"
  failure_modes:
    - "scheduler issue identity/body is modified outside the closed-world contract or uses a coercible non-integer issue id"
    - "duplicate scheduled/recovery writers attempt to overlap"
    - "direct run or protected job metadata does not match expected workflow, head, attempt, exact integer types, PR, base, or merge-ref authority"
    - "pending PR number is Boolean/float, state is unknown, or authority digest no longer matches current open PR"
    - "pending run attempt regresses or jumps beyond the exact next attempt"
    - "a terminal attempt jump cannot be uniquely attributed to this invocation's POST"
    - "effective required check belongs to unrelated same-head activity rather than the exact rerun run/job/attempt"
    - "PR authority changes immediately before mutation or before post-condition acceptance"
    - "rerun reaches a terminal attempt but the causally bound required check does not appear before the bounded deadline"
    - "pending mutation cannot be causally reconciled after restart; bridge refuses automatic duplicate POST and raises an operator-recovery-required error"
    - "operator recovery inspection tuple, confirmation, reason, run attempt, or prior check identity is malformed or stale; inspection refuses without changing durable state"
    - "no canonical target exists after complete selected-PR check-history traversal"
    - "request budget cannot preserve reserved mutation/post-condition/state-write headroom"
    - "filtered required-check pagination changes total_count between pages, repeats a check id across pages, returns a short incomplete page, or exceeds the bounded page limit"
    - "filtered required-check pagination inserts and removes records between page reads while preserving total_count and unique ids; prior-page membership revalidation detects the drift and refuses authority"
    - "in a 3+ page required-check traversal, page 1 changes after its first boundary revalidation while page 2/page 3 remain stable; final all-page revalidation detects the late drift before authority selection"
    - "a merge-acceptable candidate belongs to a non-current attempt, disagrees with its protected job start/conclusion, is absent/changed in the bounded canonical Actions frontier, or is older than another protected gate job at the captured frontier; mutation authority fails closed"
    - "candidate direct protected-job terminal state disagrees with the same current job reread through the frontier; mutation authority fails closed before the older check snapshot can authorize rerun"
    - "protected job activity falls outside the upper bound of its current workflow run lifetime; mutation authority fails closed before started_at/id ordering"
    - "malformed terminal Check Run temporal metadata or Check Run/protected-job terminal timing disagreement reaches positive authority; mutation authority must fail closed before rerun"
    - "global Gate authority advances or becomes non-acceptable after the earlier proof but before pending write; final mutation-bound reproof fails closed before any durable mutation intent or rerun POST"
    - "post-rerun observation hits request-budget exhaustion or malformed run/job/check metadata after pending state was written; durable pending remains and the next invocation resumes observation without a duplicate POST"
  adversarial_cases:
    - "historically deep target history advances through durable selected-PR continuation and restarts safely when membership drifts"
    - "same-invocation page deletion/insertion/reordering cannot make an offset scan silently skip the only PR-bound target"
    - "skipped or delayed schedules do not reset fairness because cursor, scan and pending mutation state are durable"
    - "overlapping schedule/recovery executions are serialized so issue #7 cannot be last-write-wins regressed"
    - "shared-head green revival is followed by current thread reclassification and retained/repeated processing"
    - "every actual rerun POST counts toward the invocation-wide three-mutation cap"
    - "POST accepted but next attempt visibility is delayed across scheduler restart; no second POST is emitted"
    - "POST accepted and post-condition observation raises an unexpected RuntimeError; the scheduler cannot rewrite idle state over the pending mutation and automatic replay remains forbidden"
    - "terminal observation succeeds but unresolved-thread reclassification or clear acknowledgement fails while pending is still active; pending authority remains durable and the poll cannot fall through to idle-state rewrite"
    - "origin PR closes after POST while same-head sibling remains unresolved; pending mutation is not forgotten and later green cannot remain stale"
    - "write-ahead intent remains at baseline because POST never happened; normal poll is loudly fail-closed and manual recovery requires exact positive evidence rather than replay"
    - "write-ahead pending PATCH acknowledgement fails before any POST; the invocation emits no rerun and no idle overwrite, preserving any remotely committed pending record for the next invocation"
    - "manual recovery inspection refuses if the run attempt or effective check changed after write-ahead and never clears pending state even when inspection succeeds"
    - "float/Boolean trust-binding identifiers are rejected"
    - "V1/V2/V3/V4 idle scheduler state migrates conservatively into V5 without fabricating pending mutation identity"
    - "dead/unreachable guard code is removed rather than artificially covered"
