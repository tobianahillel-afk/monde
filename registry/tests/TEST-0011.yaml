id: TEST-0011
name: "Base-owned trusted WORK-0002 source attestation"
status: PLANNED
type: INTEGRATION
protects:
  requirements: []
  capabilities: []
  contracts:
    - "base-owned source and dependency lock provenance for WORK-0002"
    - "candidate executable source identity and Git mode comparison"
  risks: []
  invariants:
    - "trusted attestor, workflow and approved manifest are owned by main, never executed from PR #2"
    - "base trust roots must be complete and valid, but a pre-integration candidate may omit their paths"
    - "any candidate-provided trust-root path must match exact base SHA and mode"
    - "all approved 179 candidate source and policy/schema Git objects match the manifest exactly"
    - "unapproved added modified or missing executable source fails closed"
    - "Git trees are complete and linked by the exact requested commit and tree SHA"
    - "only tree/040000 directory nodes may be skipped"
    - "symlink/gitlink/checkout metadata and malformed mode or duplicate paths fail closed"
    - "trusted manifest duplicate JSON keys at any nesting level fail closed"
    - "four base-approved registry policy YAML contracts and eight schemas/registry JSON schemas are pinned by SHA/mode and are mandatory"
    - "any missing mutated or newly added policy/schema path is rejected before any trusted success"
    - "GitHub status acknowledgement must include exact validated candidate SHA and cannot omit the field"
    - "GitHub status acknowledgement rejects duplicate JSON keys including state context and sha at every nesting depth"
    - "pull_request_target executes only a default-branch checked-out attestor for exact PR #2 targeting main"
    - "the exact GitHub synthetic candidate+base merge commit must have parents [event base SHA, event candidate SHA] and a complete exact tree"
    - "the GitHub test-merge result must retain all default-branch trusted workflow/manifest/attestor object identities even if a pre-integration candidate legitimately omits them"
    - "a base-owned workflow publishes trusted-source pending then terminal success/failure status under one immutable context on the exact validated candidate HEAD SHA rather than using its base-SHA Actions result"
    - "a downloaded completed-run artifact ZIP has exactly one bounded canonical regular proof file; path traversal, extra files, symlinks, corrupt CRC and decompression oversize fail closed"
    - "the collector independently retrieves the latest relevant main-owned GitHub run and exact artifact identity; newer failed runs cannot be bypassed by older successes"
    - "the real GitHub workflow-run path with @main is accepted, while other branch suffixes are rejected"
    - "the collector ignores unrelated pull_request_target runs whose exact default-branch trusted-attestation job was skipped"
    - "workflow-run discovery traverses successive bounded REST pages rather than silently discarding a relevant PR #2 run after 100 unrelated skipped runs"
    - "a newer failed PR #2 attestation job supersedes any older successful relevant run; missing or malformed job provenance fails closed"
    - "a new current rerun attempt of an older run outranks a newer original run according to current attempt timing, never just original run creation time"
    - "after artifact download the collector recomputes the current relevant Actions run frontier and rejects any run, attempt, or status drift"
    - "all GitHub artifact ZIP content uses one vetted decoder with strict redirect, path, size and provenance checks"
    - "current PR #2 HEAD and main must remain stable before and after API collection"
    - "current live PR HEAD/base/merge object and main branch SHA are revalidated before an exact-candidate success status is published"
    - "a completed-run proof binds candidate SHA, current main/base SHA, run ID, run attempt, manifest digest, and approved source count"
    - "a raw success status without a completed successful main-owned workflow run and uniquely linked unexpired proof artifact never authorizes merge"
    - "the proposed read-only consumer rejects main advancement, a changed PR head, failed/in-progress runs, wrong artifact run, tampered manifest, duplicate JSON and coercive identity types"
location:
  test_path: ".github/trusted/test_trusted_source_attestor.py"
  suite: "MONDE Trusted WORK-0002 Source / Trusted-source self-tests"
environment:
  kind: GITHUB_ACTIONS
  real_dependencies: ["GitHub Git Trees and commit REST API", "GitHub Actions pull_request_target"]
  mocked_dependencies: ["malformed manifests and Git tree API responses", "wrong base/head identity"]
cases:
  happy_path:
    - "179 approved executable and policy/schema object identities match current PR #2 exact source tree"
    - "pre-integration PR #2 omits newer base-owned trust-root files"
    - "matching base-owned files in an integrated candidate are allowed"
    - "legitimate pre-integration absence passes candidate-source proof and its actual merge result retains all base-owned trust roots"
  edge_cases:
    - "recursive Git directory nodes of type tree mode 040000"
    - "duplicate JSON path or field key"
    - "candidate root duplicates and additional base-owned paths"
  failure_modes:
    - "missing or changed approved executable source"
    - "malformed truncated candidate/base trees and wrong commit/tree SHA"
    - "wrong pull request target or base ref"
    - "synthetic merge result deletes default-branch trust-root source"
    - "merge commit has reversed, missing or stale candidate/base parents"
    - "trusted status ACK has mismatched context, state or SHA"
    - "default branch or current PR merge metadata drifts during validation"
    - "a newer relevant attempt starts after the initial run selection but before artifact verification"
    - "run listing count or membership changes between GitHub pages"
    - "ambiguous or truncated run pagination beyond the explicitly bounded frontier fails closed"
  adversarial_cases:
    - "untrusted candidate Python wheel startup hook cannot become approved by candidate manifest edits"
    - "symlink gitlink or forged mode/type pair"
    - "malicious candidate overwrites default-branch attestor or trust manifest"
    - "post-integration candidate removes trusted workflow/manifest/attestor while all original 167 approved sources still match"
    - "pull_request_target run succeeds only on base SHA and thus cannot be used directly as PR-head merge authority"
    - "remote commit-status success survives a failed or ambiguously acknowledged workflow run; the consumer rejects it without completed successful run provenance"
    - "main advances after a successful old-base run and PR candidate HEAD remains unchanged; consumer rejects the old-base proof"
    - "artifact name matches but artifact workflow_run identity differs; consumer rejects"

