id: REQ-0013
title: "Risk-scaled assurance and independent review"
status: ACCEPTED
type: GOVERNANCE
normative_statement: "MONDE SHALL scale verification and Review Council rigor with assurance level A0-A4, blast radius, and criticality, and SHALL require context-separated or stronger review for foundational/high-risk work according to the canonical assurance contract."
rationale: "The same review strength is not adequate for both local low-risk edits and systemic governance changes."
