id: REQ-0026
title: "Trusted stale-green review-state invalidation"
status: PROPOSED
type: GOVERNANCE
normative_statement: "MONDE SHALL maintain trusted default-branch automation that prevents a stale successful canonical merge-gate state from remaining merge-authoritative when the current open pull-request incarnation has unresolved review threads or when complete resolved-thread state cannot be established within the bounded control-plane proof. The automation SHALL fail closed by converting the exact current ready pull request to GitHub draft state, SHALL never automatically ready a pull request, and SHALL preserve a fresh canonical gate trigger when a human later marks that pull request ready for review."
rationale: "Review-thread state can change without a native GitHub Actions thread-resolution trigger. Rewriting or exhaustively proving commit-scoped check history is not a bounded merge-safety primitive for arbitrarily deep shared-head history. GitHub draft state is PR-scoped and non-mergeable, so unresolved or unprovable review-thread state is forced to draft on exact PR identity. Human ready-for-review is the only path back to ready state and already triggers a fresh canonical MONDE Gate."
