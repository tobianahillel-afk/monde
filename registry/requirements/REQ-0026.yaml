id: REQ-0026
title: "Trusted stale-green review-state invalidation"
status: PROPOSED
type: GOVERNANCE
normative_statement: "MONDE SHALL maintain trusted default-branch automation that invalidates a stale successful canonical merge-gate state when the current open pull-request incarnation has unresolved review threads, while binding reruns to the canonical workflow and current PR incarnation and failing closed on malformed or ambiguous GitHub control-plane state."
rationale: "Review-thread state can change without a native GitHub Actions thread-resolution trigger. A stale successful commit-scoped gate must not remain usable when the current PR has become unresolved, and a bootstrap predecessor must not rerun an earlier or unrelated PR context."
