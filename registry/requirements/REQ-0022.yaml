id: REQ-0022
title: "Verification strategy contract"
status: SUPERSEDED
type: GOVERNANCE
normative_statement: "MONDE SHALL maintain a canonical verification strategy that defines the required test and evidence modes used to establish whether specification or implementation work is correct, sufficiently strong, reproducible where applicable, and eligible for completion."
rationale: "Verification strategy can fail independently from entry readiness and completion criteria, so its normative ownership must be separately traceable and reviewable."
