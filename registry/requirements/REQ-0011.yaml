id: REQ-0011
title: "Leakage-safe reproducibility and backtesting"
status: ACCEPTED
type: EPISTEMIC_GOVERNANCE
normative_statement: "MONDE SHALL evaluate historical forecasts, detectors, models, and scientific claims using the information available at the historical cutoff, with reproducible manifests, appropriate baselines, replay evidence, and explicit leakage controls."
