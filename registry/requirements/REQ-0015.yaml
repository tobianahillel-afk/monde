id: REQ-0015
title: "Explicit specification assumptions and risks"
status: ACCEPTED
type: GOVERNANCE
normative_statement: "MONDE SHALL record every material uncertainty or risk used by a canonical specification in the appropriate ASM or RISK registry instead of presenting it as settled prose."
