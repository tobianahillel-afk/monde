id: REQ-0019
title: "End-to-end specification traceability"
status: ACCEPTED
type: GOVERNANCE
normative_statement: "MONDE SHALL keep every material accepted requirement traceable through the applicable work, design or ADR, implementation or configuration, test, validation evidence and observability artifacts, and SHALL NOT accept an orphaned material requirement."
rationale: "A normative requirement without downstream evidence cannot be reliably implemented, validated, audited or changed."
